# pipeline2 — все числа, пороги и словари. Источник истины по ЧИСЛАМ.
# Откуда числа: почти все — оценки автора пайплайна по одной игре («Фитиль»), в книгах таких чисел нет.
# Их положено калибровать (stages/8-calibration.md). Менять файл можно только по слову пользователя;
# каждая правка — новой строкой в разделе changes внизу.

version: 1

# ---------------------------------------------------------------- этап 0: сэмплер
sample:
  wave_size: 16                 # пар в волне
  mode: regions                 # режим scripts/select_pairs.py
  max_sim: -0.10                # №1: косинус пары не выше
  region_sep: 0.55
  rank_cap: 20000
  fresh_sim_verb: 0.40          # глагол ближе этого к занятому — «старая ось», не брать
  fresh_sim_noun: 0.40          # то же для существительного
  noun_fresh_max_per_wave: 2    # сколько «несвежих» существительных допустимо в волне
  arch_quota: 6                 # не больше стольких пар одного архетипа глагола в волне
  stop_prefixes: [трат, корм, прируч, обменив, собир, стро, использ, покупа, прода, улучша, плати]
  experimental_archetypes: []   # пробные архетипы; включать по одному и записывать в changes

# ---------------------------------------------------------------- этап 1: гейты пары
pair:
  good_archetypes: [перенос, связь, поле]
  expected_survivors: [0, 4]    # если из волны выжило больше — перепроверить строже и записать пометку

# ---------------------------------------------------------------- этап 2: эскиз
sketch:
  max_lines: 40
  situations: 3                 # ситуаций с разным принципом решения
  growth_elements: 3            # элементов, которые вырастут из ядра

# ---------------------------------------------------------------- этап 3: скелет и боты
skeleton:
  max_lines: 150
  builder_minutes: 30
  levels: 3                     # первый — вводный (intro), пороги на него не действуют
bots:
  levels: 3
  states_cap: 200000            # предел перебора; не уложился — возврат
  states_min: 20                # если на всех уровнях состояний меньше — задача пустая
  random_max: 0.50              # доля побед случайного бота на невводных уровнях должна быть ниже
  attentive_horizons: [4, 6]    # «внимательный» бот видит ловушки на столько ходов
  attentive_all_max: 0.999      # отказ, если на всех уровнях бот с горизонтом 4 побеждает чаще
  lazy_strategies: [idle, first, repeat, greedy]
  max_steps: 400                # предел длины партии ленивого бота
  param_min_sensitive_levels: 1 # на стольких уровнях смена главного параметра должна менять par или решаемость
  returns: 1

# ---------------------------------------------------------------- этап 4: слепые проверки
judges:
  different_model_required: true  # судья — не та модель, что автор; если в среде модель одна — свежий субагент, и это записать
  default_on_doubt: reject
clarity:
  judges: 2
  predictions: 3                # вопросов «что получится после этих ходов»
  options: 4                    # вариантов ответа на каждый (верный и до трёх ложных)
  min_correct_predictions: 2    # у каждого судьи; иначе возврат
audience:
  name: "женщины 30–50, казуальные игроки"
  questions: 6
  min_yes: 4                    # меньше — в библиотеку как «семя»
depth:
  min_gate_elements: 1          # сколько элементов из карточки должны работать «воротами» в скелете
library:
  cell_fields: [action, mover, invariant]   # ячейка каркаса — совпадение этих трёх полей
  cell_max: 3
  # словари каркаса; новое значение добавляется сюда с датой в changes
  action:    [перенос, связь, поле, преграда, превращение, порядок, другое]
  mover:     [фронт, поток, часы, носитель, толпа, ничего, другое]       # что движется само
  invariant: [сумма, набор, порядок, длина, связность, ничего, другое]   # что сохраняется
  lock:      [состояние-клетки, совпадение-по-времени, порог-величины, доставка, перекрытие-пути, другое]
  win:       [дойти, доставить-всё, удержать-до-срока, разложить, другое]

# ---------------------------------------------------------------- балл очереди (максимум 16)
score:
  clarity:          {min: 0, max: 4}   # минимум из двух судей: верные предсказания (0–3) + верный первый ход (0–1)
  audience:         {min: 0, max: 3, by_yes: {4: 1, 5: 2, 6: 3}}
  bots_mid:         {min: 0, max: 3, full_band: [0.05, 0.60], half_bands: [[0.01, 0.05], [0.60, 0.90]], half_points: 1}
                                         # медиана побед «внимательного» бота (горизонт 4) по трём уровням
  three_situations: {min: 0, max: 2}   # №15, ставит судья
  double_edge:      {min: 0, max: 2}   # №11, ставит судья
  depth:            {min: 0, max: 2, by_gate_elements: {1: 1, 2: 2}}
  cost:             {min: -2, max: 0, no_text_state: -1, many_kinds: -1, max_kinds: 4}

# ---------------------------------------------------------------- этап 5: очередь
queue:
  size: 10
  stop_sampling_at: 10          # столько непроверенных прототипом в очереди — новые волны не запускать
  tie_break: [cost_desc, date_asc]
  build_order: [answer_price_asc, score_desc]   # порядок сборки прототипов
  pinned_statuses: [spec, reference, prototype, awaiting_playtest]   # этих из очереди не вытесняют
  control_every: 10             # каждый такой прототип — контрольный, из низа прошедших проверки

# ---------------------------------------------------------------- этап 6: спека
spec:
  max_lines: 120

# ---------------------------------------------------------------- этап 7: прототип и плейтест
prototype:
  plan_bot_min_wins: "8/10"
  random_bot_max: 0.50
  journal_required: true        # время, отмены, провалы и подсказки по уровням — в самом прототипе
playtest:
  testers: [3, 5]               # человек из аудитории
  pass_level: 3                 # уровень, который надо пройти без помощи
  pass_share: "2/3"             # доля тестеров, прошедших его
  reworks: 1

# ---------------------------------------------------------------- этап 8: калибровка
calibration:
  every_outcomes: 5
  flat_item_delta: 0.25         # разница средних ниже этой — слагаемое не различает исходы

# ---------------------------------------------------------------- журнал правок конфигурации
changes:
  - {date: "2026-11-23", what: "первая версия", who: "автор пайплайна", why: "см. rationale.md"}
