<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- sprites: player 0,0,128,128 | npc_calm 128,0,128,128 | npc_worried 256,0,128,128 | npc_panicking 384,0,128,128 | flask_icon 0,128,128,128 | drop 128,128,128,128 | flask_full 256,128,128,128 -->
<!-- All figures face up. Coordinates are whole cells, not tight bounds.
     Safe paint area: local [8,120] on both axes, including the glow.
     Player flask is half full. Unused cells remain transparent. -->
<defs>
<filter id="soft-glow" filterUnits="userSpaceOnUse" x="8" y="8" width="112" height="112" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
  <feFlood flood-color="#8a2be2" flood-opacity=".65"/>
  <feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<clipPath id="bottle-interior"><path d="M51 23 H77 V45 L94 72 Q108 108 78 111 H50 Q20 108 34 72 L51 45 Z"/></clipPath>
</defs>
