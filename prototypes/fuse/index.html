<script>
// Собрано из src/ командой `node src/build.js`. Руками править src/, не этот файл.
/* ===== ФИТИЛЬ: логика (без DOM). Мир пошаговый, детерминированный, по клеткам. =====
   Символы карты: # стена, . пол, _ провал, s камень, ~ вода, o масло, w доски, L лампа, K горящая лампа,
   G страж, g страж на масле, 1 и 2 — катушка (+1 и +2 к длине фитиля), D дверь, P старт. */
const FUSE_CORE = (() => {
  const WALL = 0, FLOOR = 1, STONE = 2, DOOR = 3, LAMP = 4, WATER = 5;   // тип клетки (не меняется)
  const PIT = 1, OIL = 2, BURN = 4, WOOD = 8, BURNW = 16;                 // состояние клетки (меняется)
  const FIRE = BURN | BURNW, BLOCK = PIT | BURN | WOOD | BURNW;
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };

  function compile(lv) {
    const rows = lv.map, H = rows.length, W = Math.max(...rows.map(r => r.length)), n = W * H;
    const type = new Uint8Array(n), init = new Uint8Array(n), lampAt = new Int8Array(n).fill(-1), guardAt = new Int8Array(n).fill(-1), spoolAt = new Int8Array(n).fill(-1);
    const lamps = [], guards = [], spools = [], spoolAdd = []; let start = -1, door = -1, lampLit0 = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ch = rows[y][x] || '#', c = y * W + x;
      if (ch === '#') type[c] = WALL;
      else if (ch === 's') type[c] = STONE;
      else if (ch === '~') type[c] = WATER;
      else if (ch === 'D') { type[c] = DOOR; door = c; }
      else if (ch === 'L' || ch === 'K') { type[c] = LAMP; lampAt[c] = lamps.length; if (ch === 'K') lampLit0 |= 1 << lamps.length; lamps.push(c); }
      else { type[c] = FLOOR;
        if (ch === '_') init[c] = PIT;
        if (ch === 'o' || ch === 'g') init[c] = OIL;
        if (ch === 'w') init[c] = WOOD;
        if (ch === 'G' || ch === 'g') { guardAt[c] = guards.length; guards.push(c); }
        if (ch === '1' || ch === '2') { spoolAt[c] = spools.length; spools.push(c); spoolAdd.push(+ch); }
        if (ch === 'P') start = c; }
    }
    const adj = [];
    for (let c = 0; c < n; c++) { const x = c % W, y = (c - x) / W, a = [];
      if (y > 0) a.push(c - W); if (y < H - 1) a.push(c + W); if (x > 0) a.push(c - 1); if (x < W - 1) a.push(c + 1); adj.push(a); }
    const reach = (c, r) => { const seen = new Set([c]); let fr = [c];        // свет: не дальше r шагов, стены не пропускают
      for (let k = 0; k < r; k++) { const nx = []; for (const a of fr) for (const b of adj[a]) if (type[b] !== WALL && !seen.has(b)) { seen.add(b); nx.push(b); } fr = nx; }
      return [...seen]; };
    const light1 = [], light2 = [];
    for (let c = 0; c < n; c++) { light1.push(type[c] === WALL ? [] : reach(c, 1)); light2.push(type[c] === WALL ? [] : reach(c, 2)); }
    return { W, H, n, N: lv.n, type, init, lampAt, guardAt, spoolAt, lamps, guards, spools, spoolAdd, start, door, lampLit0, adj, light1, light2 };
  }

  // длина фитиля сейчас: начальная + подобранные катушки
  function fuseLen(L, spools) { let N = L.N; for (let k = 0; k < L.spools.length; k++) if (spools >> k & 1) N += L.spoolAdd[k]; return N; }

  function computeLight(L, flame, d, lampLit) {
    const lit = new Uint8Array(L.n);
    if (L.type[flame] !== WATER) for (const c of L.light1[flame]) lit[c] = 1;      // в воде огонёк тлеет: не светит и не поджигает
    for (let i = 0; i < L.n; i++) if (d[i] & FIRE) for (const c of L.light1[i]) lit[c] = 1;
    for (let k = 0; k < L.lamps.length; k++) if (lampLit >> k & 1) for (const c of L.light2[L.lamps[k]]) lit[c] = 1;
    return lit;
  }
  // светлое пятно неспящего стража: связный освещённый кусок, в котором он стоит
  function patchOf(L, lit, g) { const s = L.guards[g]; if (!lit[s]) return null; const seen = new Uint8Array(L.n); seen[s] = 1; const st = [s], out = [s];
    while (st.length) { const a = st.pop(); for (const b of L.adj[a]) if (lit[b] && !seen[b]) { seen[b] = 1; st.push(b); out.push(b); } } return out; }
  function seenCells(L, lit, guardAlive) { const m = new Uint8Array(L.n);
    for (let g = 0; g < L.guards.length; g++) if (guardAlive >> g & 1) { const p = patchOf(L, lit, g); if (p) for (const c of p) m[c] = 1; } return m; }

  function init(L) { const d = L.init.slice(), all = (1 << L.guards.length) - 1;
    return { t: 0, tail: [L.start], d, lampLit: L.lampLit0, guardAlive: all, spools: 0, lit: computeLight(L, L.start, d, L.lampLit0), over: false, won: false, reason: null }; }

  // куда можно шагнуть: [{cell, win}]
  function legal(L, S) { if (S.over) return []; const p = S.tail[S.tail.length - 1], out = [];
    for (const a of L.adj[p]) { const ty = L.type[a];
      if (ty === DOOR) { if (S.lit[a]) out.push({ cell: a, win: true }); continue; }
      if (ty === WALL || ty === LAMP) continue;
      const g = L.guardAt[a]; if (g >= 0 && (S.guardAlive >> g & 1)) continue;
      if (S.d[a] & BLOCK) continue;
      if (S.tail.includes(a)) continue;                              // огонёк или шнур
      out.push({ cell: a, win: false }); }
    return out; }

  // мир после хода: шаг 2 (огонёк), 3 (пожар, лампы), 4 (свет). tail уже с новой клеткой игрока, N — длина фитиля после хода
  function world(L, S, tail, N) { const d = S.d.slice(), n = L.n; let lampLit = S.lampLit, guardAlive = S.guardAlive;
    const prevBurn = []; for (let i = 0; i < n; i++) if (d[i] & FIRE) prevBurn.push(i);
    if (tail.length > N + 1) { const left = tail.shift(); if (L.type[left] === FLOOR) d[left] = PIT; }       // пол и масло выгорают; камень и вода целы
    const flame = tail[0], hot = L.type[flame] !== WATER;
    for (const i of prevBurn) d[i] = (d[i] & BURNW) ? 0 : PIT;                                              // 3а: масло выгорает в провал, доски — в проход
    const newBurn = [], ign = i => { if (d[i] === OIL) { d[i] = BURN; newBurn.push(i); const g = L.guardAt[i]; if (g >= 0) guardAlive &= ~(1 << g); } else if (d[i] === WOOD) { d[i] = BURNW; newBurn.push(i); } };
    if (hot) { ign(flame); for (const a of L.adj[flame]) ign(a); } for (const b of prevBurn) for (const a of L.adj[b]) ign(a);   // 3б
    const lightLamp = i => { const k = L.lampAt[i]; if (k >= 0) lampLit |= 1 << k; };
    if (hot) for (const a of L.adj[flame]) lightLamp(a); for (const b of newBurn) for (const a of L.adj[b]) lightLamp(a);        // 3в
    return { d, lampLit, guardAlive, tail, lit: computeLight(L, flame, d, lampLit), newBurn }; }

  function apply(L, S, cell) { const t = S.t + 1, tail = S.tail.concat(cell);
    if (cell === L.door) return { t, tail, d: S.d, lampLit: S.lampLit, guardAlive: S.guardAlive, spools: S.spools, lit: S.lit, over: true, won: true, reason: null };
    const sp = L.spoolAt[cell], spools = sp >= 0 ? S.spools | 1 << sp : S.spools;
    const w = world(L, S, tail, fuseLen(L, spools)), R = { t, tail: w.tail, d: w.d, lampLit: w.lampLit, guardAlive: w.guardAlive, spools, lit: w.lit, over: false, won: false, reason: null };
    if (w.d[cell] & FIRE) { R.over = true; R.reason = 'burned'; }
    else if (seenCells(L, w.lit, w.guardAlive)[cell]) { R.over = true; R.reason = 'seen'; }
    else if (legal(L, R).length === 0) { R.over = true; R.reason = 'stuck'; }
    return R; }

  // что будет после следующего хода: огонёк, что загорится, свет, опасные клетки.
  // От шага игрока это зависит только через катушку: cell — куда он шагнёт (−1: на клетку без катушки)
  function preview(L, S, cell) { const sp = cell >= 0 ? L.spoolAt[cell] : -1, spools = sp >= 0 ? S.spools | 1 << sp : S.spools;
    const w = world(L, S, S.tail.concat(-1), fuseLen(L, spools)), seen = seenCells(L, w.lit, w.guardAlive), burn = new Uint8Array(L.n);
    for (const c of w.newBurn) burn[c] = 1;
    return { flame: w.tail[0], lit: w.lit, seen, burn, lampLit: w.lampLit, guardAlive: w.guardAlive, d: w.d }; }

  const key = S => String.fromCharCode.apply(null, S.d) + '|' + S.lampLit + '|' + S.guardAlive + '|' + S.spools + '|' + S.tail.join(',');
  const dirChar = (L, a, b) => b === a - L.W ? 'U' : b === a + L.W ? 'D' : b === a - 1 ? 'L' : 'R';
  const cellInDir = (L, a, ch) => { const [dx, dy] = DIRS[ch], x = a % L.W + dx, y = (a - a % L.W) / L.W + dy; return (x < 0 || y < 0 || x >= L.W || y >= L.H) ? -1 : y * L.W + x; };

  // решатель: перебор состояний в ширину от состояния S0 → кратчайший план (строка UDLR) или null
  function solveFrom(L, S0, maxStates) { maxStates = maxStates || 5e6; const t0 = Date.now();
    if (S0.over) return { solvable: S0.won, par: 0, plan: '', states: 1, ms: 0 };
    let frontier = [{ S: S0, id: 0 }]; const seen = new Set([key(S0)]), parent = [-1], move = ['']; let states = 1, depth = 0;
    while (frontier.length) { const next = []; depth++;
      for (const { S, id } of frontier) { const p = S.tail[S.tail.length - 1];
        for (const m of legal(L, S)) { const ch = dirChar(L, p, m.cell);

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = st ? '#fff0c2' : open ? '#5a66a8' : '#2a305c'; ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, 7); ctx.stroke();

    if (open) { text(String(k + 1), 0, -6, 21, st ? '#3a2210' : '#f6dfae', 800); for (let q = 0; q < 3; q++) { if (st) { ctx.fillStyle = q < st ? '#fff6d8' : 'rgba(110,60,20,0.55)'; ctx.beginPath(); for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + j * Math.PI / 5, rr2 = j % 2 ? 2.3 : 5.2; ctx.lineTo((q - 1) * 13 + Math.cos(a) * rr2, 14 + Math.sin(a) * rr2); } ctx.closePath(); ctx.fill(); } else star((q - 1) * 13, 14, 5.2, false); } } else { ctx.strokeStyle = '#c8873a'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ICON.lock(0, 0, 26); }
    ctx.restore(); if (LEVELS[i].exam) { const bx = x + r * 0.74, by = y - r * 0.74; ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(bx, by, 10, 0, 7); ctx.fill(); ctx.fillStyle = open ? '#e05a3a' : '#5a3a4a'; ctx.beginPath(); ctx.arc(bx, by, 8, 0, 7); ctx.fill(); text('!', bx, by + 0.5, 12, '#fff1d8', 900); }      // «!» — трудный уровень (так же подписан в шапке)
    if (isCur && open) prop(ctx, 'hero_a', x, y - r + 9 - Math.abs(Math.sin(now / 320)) * 4, 40); });
  // точки миров и нижний ряд
  const dy = VH - 116; WORLDS.forEach((q, k) => { ctx.fillStyle = k === UI.mapW ? '#ffd98a' : '#4a5490'; ctx.beginPath(); ctx.arc(VW / 2 + (k - (WORLDS.length - 1) / 2) * 18, dy, k === UI.mapW ? 5.5 : 4, 0, 7); ctx.fill(); });
  const by = VH - 62; [['bSound', -96], ['bLang', 0], ['bLog', 96]].forEach(([k, dx]) => text(T(k), VW / 2 + dx, VH - 22, 12, '#9aa3cc', 700)); roundBtn('snd', VW / 2 - 96, by, 25, ICON.sound, () => { SND.setOn(!save.sound); SND.play('click'); }, { arg: save.sound });
  pillBtn('lng', VW / 2 - 34, by - 25, 68, 50, T('lang'), () => { save.lang = save.lang === 'ru' ? 'en' : 'ru'; persist(); SND.play('click'); }, { size: 17 });
  roundBtn('sts', VW / 2 + 96, by, 25, ICON.list, () => { UI.screen = 'stats'; UI.statScroll = 0; SND.play('click'); });
  if (UI.toast && now < UI.toast.until) { ctx.font = font(13, 700); const tw = ctx.measureText(UI.toast.text).width + 28; ctx.fillStyle = '#2b3364'; rr(ctx, VW / 2 - tw / 2, VH - 160, tw, 32, 16); ctx.fill(); text(UI.toast.text, VW / 2, VH - 143.5, 13, PAL.text, 700); } }

// ---------- журнал плейтеста ----------
const fmtMs = ms => { const s = Math.round(ms / 1000); return s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : s + 'с'; };
function statsRows() { return LEVELS.map((l, i) => ({ i, id: l.id, st: save.stats[l.id], stars: starsOf(i) })).filter(r => r.st && (r.st.moves || r.st.wins)); }
function drawStats() { bg(); const rows = statsRows(), top = 104, rowH = 26, viewH = VH - top - 132, maxScroll = Math.max(0, rows.length * rowH - viewH); UI.statScroll = clamp(UI.statScroll, 0, maxScroll);
  text(T('stats'), VW / 2, 34, 22, PAL.text, 800); roundBtn('sclose', VW - 32, 32, 19, ICON.close, () => { UI.screen = 'map'; SND.play('click'); });
  const cols = [18, 118, 170, 216, 264, 314, 360], hd = T('statHead'); hd.forEach((h, k) => text(h, cols[k], 78, 10.5, PAL.dim, 800, k ? 'center' : 'left'));

    vals.forEach((v, c) => text(String(v), cols[c], y, 12, c === 0 ? (r.stars ? '#ffd98a' : PAL.text) : '#c9d0f2', 700, c ? 'center' : 'left')); });

  ctx.restore(); const by = VH - 104;
  pillBtn('sall', 20, by, VW - 40, 40, (save.openAll ? '✓ ' : '') + T('openAll'), () => { save.openAll = !save.openAll; persist(); SND.play('click'); }, { size: 14 });
  pillBtn('scopy', 20, by + 48, (VW - 50) / 2, 40, now - UI.copiedAt < 1500 ? T('copied') : T('copy'), () => { const data = JSON.stringify(stats()); try { navigator.clipboard.writeText(data); } catch (e) { /* нет доступа к буферу */ } UI.copiedAt = now; }, { size: 13 });
  pillBtn('sreset', 30 + (VW - 50) / 2, by + 48, (VW - 50) / 2, 40, now - UI.resetArm < 2500 ? T('resetAsk') : T('reset'), () => { if (now - UI.resetArm < 2500) { save.done = {}; save.stats = {}; save.seenWorld = {}; save.openAll = false; persist(); UI.resetArm = 0; } else UI.resetArm = now; }, { size: 13, danger: true }); }
function stats() { return statsRows().map(r => Object.assign({ level: r.i + 1, id: r.id, stars: r.stars }, r.st, { ms: Math.round(r.st.ms) })); }

// ---------- ввод ----------
function tryStep(dir) { if (UI.screen !== 'play' || UI.win || UI.card || now < V.failUntil) return; SND.unlock(); step(dir); }
const ptr = { down: false, x: 0, y: 0, moved: false, t: 0 };
function toLocal(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / SC, (e.clientY - r.top) / SC]; }
function hit(x, y) { for (let k = UI.btns.length - 1; k >= 0; k--) { const b = UI.btns[k]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; } return null; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); SND.unlock(); const [x, y] = toLocal(e); ptr.down = true; ptr.x = x; ptr.y = y; ptr.moved = false; ptr.t = now; UI.press = hit(x, y); if (cv.setPointerCapture) try { cv.setPointerCapture(e.pointerId); } catch (err) { /* не критично */ } });
cv.addEventListener('pointermove', e => { if (!ptr.down) return; const [x, y] = toLocal(e), dx = x - ptr.x, dy = y - ptr.y;
  if (UI.screen === 'stats' && !UI.press) { UI.statScroll -= dy; ptr.x = x; ptr.y = y; ptr.moved = true; return; }
  if (!ptr.moved && Math.hypot(dx, dy) > 24) { ptr.moved = true; if (UI.press) { UI.press = null; }
    if (UI.screen === 'play') tryStep(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
    else if (UI.screen === 'map' && Math.abs(dx) > Math.abs(dy)) { UI.mapW = clamp(UI.mapW + (dx < 0 ? 1 : -1), 0, WORLDS.length - 1); SND.play('click'); } } });
function release(e) { if (!ptr.down) return; ptr.down = false; const [x, y] = toLocal(e), b = UI.press; UI.press = null; if (ptr.moved) return;
  if (b) { const again = hit(x, y); if (again && again.id === b.id) b.fn(); return; }
  if (UI.screen === 'play' && !UI.win && !UI.card) { const hx = V.hero.x, hy = V.hero.y, dx = x - hx, dy = y - hy; if (y < CONFIG.top || y > VH - CONFIG.bottom || Math.hypot(dx, dy) < F.cell * 0.4) return; tryStep(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); } }

cv.addEventListener('wheel', e => { if (UI.screen === 'stats') { UI.statScroll += e.deltaY; e.preventDefault(); } }, { passive: false });
const KEYS = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', KeyW: 'U', KeyS: 'D', KeyA: 'L', KeyD: 'R' };
window.addEventListener('keydown', e => { SND.unlock(); if (UI.card) { if (e.code === 'Enter' || e.code === 'Space' || e.code === 'Escape') { save.seenWorld[UI.card.w] = 1; persist(); UI.card = null; } return; }
  if (UI.screen === 'play') { if (KEYS[e.code]) { e.preventDefault(); tryStep(KEYS[e.code]); }
    else if (e.code === 'KeyZ' || e.code === 'Backspace' || e.code === 'KeyU') { e.preventDefault(); if (!UI.win && now >= V.failUntil) undo(); } else if (e.code === 'KeyR') { UI.win = null; if (now >= V.failUntil) restart(); } else if (e.code === 'KeyH') doHint();
    else if (e.code === 'Enter' && UI.win) { if (M.idx < LEVELS.length - 1) startLevel(M.idx + 1); else goMap(); } else if (e.code === 'Escape') goMap(); }
  else if (UI.screen === 'map') { if (e.code === 'ArrowLeft') UI.mapW = Math.max(0, UI.mapW - 1); else if (e.code === 'ArrowRight') UI.mapW = Math.min(WORLDS.length - 1, UI.mapW + 1); else if (e.code === 'Enter' || e.code === 'Escape') { UI.screen = 'play'; } }
  else if (UI.screen === 'stats' && e.code === 'Escape') UI.screen = 'map'; });
M.listeners.push((type, d) => { if (type === 'win') after(520, () => { UI.win = { t0: now, stars: d.stars, moves: d.moves, par: d.par, rang: [] }; SND.play('win'); }); if (type === 'load' || type === 'restart') UI.win = null; if (type === 'load') UI.fadeT = now; if (type === 'fail' && navigator.vibrate) { try { navigator.vibrate(18); } catch (e) { /* не везде есть */ } } });

// ---------- главный цикл ----------

function frame(ts) { requestAnimationFrame(frame); const raw = ts - lastT; if (lastT && raw < 1000) { perf.frames++; perf.gap += raw; if (raw > 25) perf.slow++; } dtMs = Math.min(50, raw || 16); lastT = ts; now = ts; const p0 = performance.now();

  ctx.setTransform(SC * DPR, 0, 0, SC * DPR, 0, 0); UI.btns = [];
  if (UI.screen === 'play') drawPlay(); else if (UI.screen === 'map') drawMap(); else drawStats();
  if (UI.shownScreen !== UI.screen) { UI.shownScreen = UI.screen; UI.fadeT = now; } const fd = (now - UI.fadeT) / 220; if (fd < 1) { ctx.fillStyle = `rgba(4,5,12,${(1 - fd) * 0.9})`; ctx.fillRect(0, 0, VW, VH); }      // мягкая смена экрана и уровня
  const d = performance.now() - p0; perf.n++; perf.sum += d; if (d > perf.max) perf.max = d; }
setInterval(persist, 15000); window.addEventListener('pagehide', persist);
window.addEventListener('resize', resize); window.addEventListener('orientationchange', resize);

window.FUSE = { CONFIG, LEVELS, WORLDS, load: n => { UI.win = null; UI.card = null; UI.screen = 'play'; return load(n); }, state, legal: legalDirs, step, undo, restart, preview, solve, hint, stats, log, core: C, ui: UI, view: V, perf,
  cellXY: c => { const r = cv.getBoundingClientRect(); return [r.left + cellX(c) * SC, r.top + cellY(c) * SC]; }, btnXY: id => { const b = UI.btns.find(q => q.id === id), r = cv.getBoundingClientRect(); return b ? [r.left + (b.x + b.w / 2) * SC, r.top + (b.y + b.h / 2) * SC] : null; },
