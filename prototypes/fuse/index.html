// Собрано из src/ (logic.js + levels.js + ui.html) командой `node src/build.js`. Руками править src/, не этот файл.
/* ===== ФИТИЛЬ: логика (без DOM). Мир пошаговый, детерминированный, по клеткам. =====
   Символы карты: # стена, . пол, _ провал, s камень, o масло, L лампа, K горящая лампа,
   G страж, g страж на масле, D дверь, P старт. */
const FUSE_CORE = (() => {
  const WALL = 0, FLOOR = 1, STONE = 2, DOOR = 3, LAMP = 4;        // тип клетки (не меняется)
  const PIT = 1, OIL = 2, BURN = 4;                                // состояние клетки (меняется)
  const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };

  function compile(lv) {
    const rows = lv.map, H = rows.length, W = Math.max(...rows.map(r => r.length)), n = W * H;
    const type = new Uint8Array(n), init = new Uint8Array(n), lampAt = new Int8Array(n).fill(-1), guardAt = new Int8Array(n).fill(-1);
    const lamps = [], guards = []; let start = -1, door = -1, lampLit0 = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ch = rows[y][x] || '#', c = y * W + x;
      if (ch === '#') type[c] = WALL;
      else if (ch === 's') type[c] = STONE;
      else if (ch === 'D') { type[c] = DOOR; door = c; }
      else if (ch === 'L' || ch === 'K') { type[c] = LAMP; lampAt[c] = lamps.length; if (ch === 'K') lampLit0 |= 1 << lamps.length; lamps.push(c); }
      else { type[c] = FLOOR;
        if (ch === '_') init[c] = PIT;
        if (ch === 'o' || ch === 'g') init[c] = OIL;
        if (ch === 'G' || ch === 'g') { guardAt[c] = guards.length; guards.push(c); }
        if (ch === 'P') start = c; }
    }
    const adj = [];
    for (let c = 0; c < n; c++) { const x = c % W, y = (c - x) / W, a = [];
      if (y > 0) a.push(c - W); if (y < H - 1) a.push(c + W); if (x > 0) a.push(c - 1); if (x < W - 1) a.push(c + 1); adj.push(a); }
    const reach = (c, r) => { const seen = new Set([c]); let fr = [c];        // свет: не дальше r шагов, стены не пропускают
      for (let k = 0; k < r; k++) { const nx = []; for (const a of fr) for (const b of adj[a]) if (type[b] !== WALL && !seen.has(b)) { seen.add(b); nx.push(b); } fr = nx; }
      return [...seen]; };
    const light1 = [], light2 = [];
    for (let c = 0; c < n; c++) { light1.push(type[c] === WALL ? [] : reach(c, 1)); light2.push(type[c] === WALL ? [] : reach(c, 2)); }
    return { W, H, n, N: lv.n, type, init, lampAt, guardAt, lamps, guards, start, door, lampLit0, adj, light1, light2 };
  }

  function computeLight(L, flame, d, lampLit) {
    const lit = new Uint8Array(L.n);
    for (const c of L.light1[flame]) lit[c] = 1;
    for (let i = 0; i < L.n; i++) if (d[i] & BURN) for (const c of L.light1[i]) lit[c] = 1;
    for (let k = 0; k < L.lamps.length; k++) if (lampLit >> k & 1) for (const c of L.light2[L.lamps[k]]) lit[c] = 1;
    return lit;
  }
  // светлое пятно неспящего стража: связный освещённый кусок, в котором он стоит
  function patchOf(L, lit, g) { const s = L.guards[g]; if (!lit[s]) return null; const seen = new Uint8Array(L.n); seen[s] = 1; const st = [s], out = [s];
    while (st.length) { const a = st.pop(); for (const b of L.adj[a]) if (lit[b] && !seen[b]) { seen[b] = 1; st.push(b); out.push(b); } } return out; }
  function seenCells(L, lit, guardAlive) { const m = new Uint8Array(L.n);
    for (let g = 0; g < L.guards.length; g++) if (guardAlive >> g & 1) { const p = patchOf(L, lit, g); if (p) for (const c of p) m[c] = 1; } return m; }

  function init(L) { const d = L.init.slice(), all = (1 << L.guards.length) - 1;
    return { t: 0, tail: [L.start], d, lampLit: L.lampLit0, guardAlive: all, lit: computeLight(L, L.start, d, L.lampLit0), over: false, won: false, reason: null }; }

  // куда можно шагнуть: [{cell, win}]
  function legal(L, S) { if (S.over) return []; const p = S.tail[S.tail.length - 1], out = [];
    for (const a of L.adj[p]) { const ty = L.type[a];
      if (ty === DOOR) { if (S.lit[a]) out.push({ cell: a, win: true }); continue; }
      if (ty === WALL || ty === LAMP) continue;
      const g = L.guardAt[a]; if (g >= 0 && (S.guardAlive >> g & 1)) continue;
      if (S.d[a] & (PIT | BURN)) continue;
      if (S.tail.includes(a)) continue;                              // огонёк или шнур
      out.push({ cell: a, win: false }); }
    return out; }

  // мир после хода: шаг 2 (огонёк), 3 (пожар, лампы), 4 (свет); newCell — куда шагнул игрок (или -1 для предпросмотра)
  function world(L, S, tail) { const d = S.d.slice(), n = L.n; let lampLit = S.lampLit, guardAlive = S.guardAlive;
    const prevBurn = []; for (let i = 0; i < n; i++) if (d[i] & BURN) prevBurn.push(i);
    if (tail.length > L.N + 1) { const left = tail.shift(); if (L.type[left] === FLOOR) d[left] = PIT; }      // пол и масло выгорают, камень цел
    const flame = tail[0];
    for (const i of prevBurn) d[i] = PIT;                                                                  // 3а
    const newBurn = [], ign = i => { if (d[i] === OIL) { d[i] = BURN; newBurn.push(i); const g = L.guardAt[i]; if (g >= 0) guardAlive &= ~(1 << g); } };
    ign(flame); for (const a of L.adj[flame]) ign(a); for (const b of prevBurn) for (const a of L.adj[b]) ign(a);   // 3б
    const lightLamp = i => { const k = L.lampAt[i]; if (k >= 0) lampLit |= 1 << k; };
    for (const a of L.adj[flame]) lightLamp(a); for (const b of newBurn) for (const a of L.adj[b]) lightLamp(a);   // 3в
    return { d, lampLit, guardAlive, tail, lit: computeLight(L, flame, d, lampLit), newBurn }; }

  function apply(L, S, cell) { const t = S.t + 1, tail = S.tail.concat(cell);
    if (cell === L.door) return { t, tail, d: S.d, lampLit: S.lampLit, guardAlive: S.guardAlive, lit: S.lit, over: true, won: true, reason: null };
    const w = world(L, S, tail), R = { t, tail: w.tail, d: w.d, lampLit: w.lampLit, guardAlive: w.guardAlive, lit: w.lit, over: false, won: false, reason: null };
    if (w.d[cell] & BURN) { R.over = true; R.reason = 'burned'; }
    else if (seenCells(L, w.lit, w.guardAlive)[cell]) { R.over = true; R.reason = 'seen'; }
    else if (legal(L, R).length === 0) { R.over = true; R.reason = 'stuck'; }
    return R; }

  // что будет после следующего хода (от шага игрока не зависит): огонёк, что загорится, свет, опасные клетки
  function preview(L, S) { const w = world(L, S, S.tail.concat(-1)), seen = seenCells(L, w.lit, w.guardAlive), burn = new Uint8Array(L.n);
    for (const c of w.newBurn) burn[c] = 1;
    return { flame: w.tail[0], lit: w.lit, seen, burn, lampLit: w.lampLit, guardAlive: w.guardAlive }; }

  const key = S => String.fromCharCode.apply(null, S.d) + '|' + S.lampLit + '|' + S.guardAlive + '|' + S.tail.join(',');
  const dirChar = (L, a, b) => b === a - L.W ? 'U' : b === a + L.W ? 'D' : b === a - 1 ? 'L' : 'R';
  const cellInDir = (L, a, ch) => { const [dx, dy] = DIRS[ch], x = a % L.W + dx, y = (a - a % L.W) / L.W + dy; return (x < 0 || y < 0 || x >= L.W || y >= L.H) ? -1 : y * L.W + x; };

  // решатель: полный перебор состояний в ширину → кратчайший план (строка UDLR) или null
  function solve(lv, opts) { opts = opts || {}; const L = compile(Object.assign({}, lv, { n: opts.n || lv.n })), maxStates = opts.maxStates || 5e6, t0 = Date.now();
    const S0 = init(L); let frontier = [{ S: S0, id: 0 }]; const seen = new Set([key(S0)]), parent = [-1], move = ['']; let states = 1, depth = 0, wins = 0;
    while (frontier.length) { const next = []; depth++;
      for (const { S, id } of frontier) { const p = S.tail[S.tail.length - 1];
        for (const m of legal(L, S)) { const ch = dirChar(L, p, m.cell);
          if (m.win) { let plan = ch, k = id; while (k > 0) { plan = move[k] + plan; k = parent[k]; } return { solvable: true, par: depth, plan, states, ms: Date.now() - t0 }; }
          const R = apply(L, S, m.cell); if (R.over) continue;
          const kk = key(R); if (seen.has(kk)) continue; seen.add(kk); parent.push(id); move.push(ch); next.push({ S: R, id: parent.length - 1 }); states++;
          if (states > maxStates) return { solvable: null, par: null, plan: null, states, ms: Date.now() - t0, overflow: true }; } }
      frontier = next; }
    return { solvable: false, par: null, plan: null, states, ms: Date.now() - t0 }; }

  return { WALL, FLOOR, STONE, DOOR, LAMP, PIT, OIL, BURN, DIRS, compile, init, legal, apply, preview, solve, key, dirChar, cellInDir, seenCells, patchOf, computeLight };
})();

(() => {
'use strict';
const C = FUSE_CORE, LEVELS = FUSE_LEVELS;
// Все числа прототипа. Радиусы света (огонёк 1, горящая клетка 1, лампа 2) зашиты в логике: compile() → light1/light2.
const CONFIG = { W: 390, H: 700, header: 56, panel: 72, cell: 48, cellMax: 60, stepMs: 120, failMs: 400, ghostMs: 1600, light: { flame: 1, burning: 1, lamp: 2 } };
const TXT = {
  ru: { undo: 'отмена', restart: 'заново', levels: 'уровни', behind: n => `огонёк отстаёт на ${n} ${n === 1 ? 'шаг' : n < 5 ? 'шага' : 'шагов'}`, move: 'ход', stuck: 'тупик', burned: 'сгорел', seen: 'замечен',
    closed: 'в темноте дверь закрыта', won: 'Дверь открыта!', moves: 'ходов', best: 'короче нельзя', next: 'дальше', again: 'ещё раз', all: 'Подвал пройден!', pick: 'Уровни', close: 'закрыть', lang: 'English' },
  en: { undo: 'undo', restart: 'restart', levels: 'levels', behind: n => `the flame is ${n} step${n === 1 ? '' : 's'} behind`, move: 'move', stuck: 'dead end', burned: 'burned', seen: 'spotted',
    closed: 'the door stays shut in the dark', won: 'The door is open!', moves: 'moves', best: 'shortest possible', next: 'next', again: 'again', all: 'Cellar cleared!', pick: 'Levels', close: 'close', lang: 'Русский' },
};
const store = { get(k, d) { try { const v = localStorage.getItem('fuse.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('fuse.' + k, JSON.stringify(v)); } catch (e) { } } };
const qs = new URLSearchParams(location.search);
let lang = qs.get('lang') || store.get('lang', (navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en'); if (!TXT[lang]) lang = 'ru';
const T = () => TXT[lang];

// ---------- состояние партии ----------
let cur = 0, L = null, S = null, hist = [], geo = null; const log = [];
let mode = 'play', anim = null, fail = null, ghost = null, nudge = null;      // состояние экрана: режим, анимация шага, вспышка провала, метка провала, толчок в стену
const player = () => S.tail[S.tail.length - 1], xy = c => ({ x: c % L.W, y: (c - c % L.W) / L.W });
function load(n) { cur = Math.max(0, Math.min(LEVELS.length - 1, (n | 0) - 1)); L = C.compile(LEVELS[cur]); S = C.init(L); hist = []; layout(); store.set('level', cur + 1); resetUi(); return state(); }
function legal() { const p = player(); return C.legal(L, S).map(m => C.dirChar(L, p, m.cell)); }
function logLine() { const lv = LEVELS[cur], head = `L${cur + 1} «${lv.name.ru}»: `;
  const line = S.won ? head + `победа, ходов ${S.t}/${lv.par}` : head + `провал (${TXT.ru[S.reason]}), ход ${S.t}/${lv.par}`; log.push(line); if (log.length > 500) log.shift(); return line; }
function step(dir) { if (S.over) return { ok: false, reason: 'over' }; const c = C.cellInDir(L, player(), dir), m = C.legal(L, S).find(q => q.cell === c); if (!m) return { ok: false, reason: 'illegal' };
  hist.push(S); S = C.apply(L, S, c); if (S.over) logLine(); return { ok: true, reason: S.won ? 'won' : S.reason }; }
function undo() { if (!hist.length) return false; S = hist.pop(); resetUi(); return true; }
function restart() { S = C.init(L); hist = []; resetUi(); return state(); }
function grid(a) { const o = []; for (let y = 0; y < L.H; y++) o.push(Array.from(a.subarray(y * L.W, (y + 1) * L.W))); return o; }
function state() { const cells = [];
  for (let y = 0; y < L.H; y++) { let r = ''; for (let x = 0; x < L.W; x++) { const c = y * L.W + x, ty = L.type[c], d = S.d[c];
    r += ty === C.WALL ? '#' : ty === C.DOOR ? 'D' : ty === C.LAMP ? ((S.lampLit >> L.lampAt[c] & 1) ? 'K' : 'L') : ty === C.STONE ? 's' : (d & C.PIT) ? '_' : (d & C.BURN) ? '*' : (d & C.OIL) ? 'o' : '.'; } cells.push(r); }

    burning: Array.from(S.d).map((d, c) => (d & C.BURN) ? xy(c) : null).filter(Boolean), lit: grid(S.lit), doorOpen: !!S.lit[L.door], over: S.over, won: S.won, reason: S.reason }; }
function preview() { const p = C.preview(L, S), list = a => Array.from(a).map((v, c) => v ? xy(c) : null).filter(Boolean);
  return { flame: xy(p.flame), ignites: list(p.burn), lit: grid(p.lit), seen: list(p.seen), burned: list(p.burn), lamps: L.lamps.map((c, k) => Object.assign(xy(c), { lit: !!(p.lampLit >> k & 1) })) }; }
function solve(n, opts) { return C.solve(LEVELS[(n | 0) - 1], opts); }

const SPR = { floor: [0, 0], wall: [1, 0], pit: [2, 0], stone: [3, 0], oil: [4, 0], burning: [0, 1], lamp_off: [1, 1], lamp_on: [2, 1], door_closed: [3, 1], door_open: [4, 1],
  guard_asleep: [0, 2], guard_awake: [1, 2], hero: [2, 2], flame: [3, 2], cord_h: [4, 2], cord_corner: [0, 3], spark: [1, 3], danger: [2, 3], light: [3, 3], hand: [4, 3] };   // клетки листа assets.svg (128×128)

  guard_asleep: '#56667a', guard_awake: '#b0703a', hero: '#3fa7a0', flame: '#ff8a3d', spark: '#ffd34d', danger: 'rgba(255,60,60,.35)', light: 'rgba(255,214,150,.22)', hand: '#f4d7b5' };  // запасная отрисовка, если лист не загрузился
const img = new Image(); let imgOk = false, atlas = null, atlasK = 1;
img.onload = () => { imgOk = true; buildAtlas(); }; img.src = 'assets.svg';
function buildAtlas() { if (!imgOk || !geo) return; const k = Math.max(0.5, Math.min(2.5, Math.ceil(geo.cs * scale * dpr / 128 * 4) / 4)); if (atlas && k === atlasK) return;

function spr(name, x, y, s, cropW) { const q = SPR[name], w = cropW || 1;

  else { const flat = ['floor', 'wall', 'pit', 'stone', 'oil', 'burning', 'danger', 'light'].includes(name), m = flat ? s * 0.06 : s * 0.24; ctx.fillStyle = FB[name] || '#888'; ctx.fillRect(x + m, y + m, s - 2 * m, s - 2 * m); } }
function fit() { dpr = Math.min(3, window.devicePixelRatio || 1); scale = Math.min(innerWidth / CONFIG.W, innerHeight / CONFIG.H);
  cv.style.width = CONFIG.W * scale + 'px'; cv.style.height = CONFIG.H * scale + 'px'; cv.width = Math.round(CONFIG.W * scale * dpr); cv.height = Math.round(CONFIG.H * scale * dpr); buildAtlas(); }
function layout() { const top = CONFIG.header + 44, bot = CONFIG.H - CONFIG.panel - 56, cs = Math.max(24, Math.min(CONFIG.cellMax, Math.floor((CONFIG.W - 24) / L.W), Math.floor((bot - top) / L.H)));
  geo = { cs, ox: Math.round((CONFIG.W - L.W * cs) / 2), oy: Math.round(top + (bot - top - L.H * cs) / 2), top, bot }; buildAtlas(); }
const center = c => ({ x: geo.ox + (c % L.W + 0.5) * geo.cs, y: geo.oy + ((c - c % L.W) / L.W + 0.5) * geo.cs });

function text(s, x, y, size, color, align, weight) { ctx.font = `${weight || 500} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); }

// ---------- интерфейс ----------
let face = 1, wonAt = 0, buttons = [], doneSet = new Set(store.get('done', []));

function resetUi() { mode = 'play'; anim = fail = ghost = nudge = null; }
function go(n) { load(n); face = 1; }
function tryStep(dir) { if (mode !== 'play' || fail || S.over) return; const p = player(), before = S, now = performance.now(), r = step(dir);
  if (!r.ok) { nudge = { t0: now, dir, door: C.cellInDir(L, p, dir) === L.door }; sfx('no'); return; }
  anim = { t0: now, fromP: p, fromF: before.tail[0] }; ghost = null; if (dir === 'L') face = -1; if (dir === 'R') face = 1;
  if (S.won) { doneSet.add(cur); store.set('done', [...doneSet]); wonAt = now; mode = 'won'; sfx('win'); console.log(log[log.length - 1]); }

  else if (S.lampLit !== before.lampLit) sfx('lamp'); else if (S.d.some((d, i) => (d & C.BURN) && !(before.d[i] & C.BURN))) sfx('fire'); else sfx('step'); }

function drawHeader() { const lv = LEVELS[cur], t = T();
  text(`${cur + 1}`, 18, 28, 26, '#f1e6d2', 'left', 800); text(`/ ${LEVELS.length}`, 18 + (cur >= 9 ? 34 : 19), 31, 13, '#6f8494', 'left', 600);
  text(lv.name[lang], CONFIG.W / 2, 28, 17, '#f1e6d2', 'center', 700); text(`${t.move} ${S.t}`, CONFIG.W - 18, 28, 14, '#8fa3b2', 'right', 600);
  // полоска задержки: огонёк — N узлов шнура — герой; горит столько узлов, сколько шнура уже размотано
  const n = L.N, y = CONFIG.header + 12, gap = 18, w = (n + 1) * gap, x0 = CONFIG.W / 2 - w / 2;

  spr('flame', x0 - 26, y - 14, 26, 0.84); spr('hero', x0 + w + 2, y - 14, 26);
  text(t.behind(n), CONFIG.W / 2, y + 19, 12, '#8fa3b2', 'center', 500); }

function drawField(now) { const { cs, ox, oy } = geo, pv = S.over ? null : C.preview(L, S), k = anim ? Math.min(1, (now - anim.t0) / CONFIG.stepMs) : 1, e = k * (2 - k);
  for (let c = 0; c < L.n; c++) { const x = ox + (c % L.W) * cs, y = oy + ((c - c % L.W) / L.W) * cs, ty = L.type[c], d = S.d[c];
    if (ty === C.WALL) { spr('wall', x, y, cs); continue; }
    spr(ty === C.STONE ? 'stone' : (d & C.PIT) ? 'pit' : (d & C.BURN) ? 'burning' : (d & C.OIL) ? 'oil' : 'floor', x, y, cs);
    if (S.lit[c]) { ctx.globalAlpha = 0.8 + 0.12 * Math.sin(now / 260 + c * 1.7); spr('light', x, y, cs); ctx.globalAlpha = 1; }
    if (ty === C.LAMP) spr((S.lampLit >> L.lampAt[c] & 1) ? 'lamp_on' : 'lamp_off', x, y, cs);
    if (ty === C.DOOR) { const sh = nudge && nudge.door && now - nudge.t0 < 260 ? Math.sin((now - nudge.t0) / 22) * 3 : 0; spr(S.lit[c] ? 'door_open' : 'door_closed', x + sh, y, cs); }

  // светлое пятно неспящего стража — обводка
  for (let g = 0; g < L.guards.length; g++) if (S.guardAlive >> g & 1) { const patch = C.patchOf(L, S.lit, g); if (!patch) continue; const inP = new Uint8Array(L.n); for (const c of patch) inP[c] = 1;
    ctx.save(); ctx.strokeStyle = '#ff6a3d'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.shadowColor = '#ff6a3d'; ctx.shadowBlur = 8; ctx.beginPath();

  if (anim && k < 1) { const a = center(anim.fromP), b = center(anim.fromF); hero.x = a.x + (hero.x - a.x) * e; hero.y = a.y + (hero.y - a.y) * e; if (!S.won) { flame.x = b.x + (flame.x - b.x) * e; flame.y = b.y + (flame.y - b.y) * e; } }

  if (label) { const q = center(label.cell), s = T()[label.reason]; ctx.globalAlpha = Math.max(0, Math.min(1, label.a * 1.6)); ctx.font = '800 15px system-ui,sans-serif'; const w = ctx.measureText(s).width + 20, bx = Math.max(6, Math.min(CONFIG.W - w - 6, q.x - w / 2)), by = Math.max(geo.top, q.y - cs * 0.95);

    if (!fail) { ctx.strokeStyle = '#ff6a3d'; ctx.lineWidth = 3; ctx.lineCap = 'round'; const r = cs * 0.2; ctx.beginPath(); ctx.moveTo(q.x - r, q.y - r); ctx.lineTo(q.x + r, q.y + r); ctx.moveTo(q.x + r, q.y - r); ctx.lineTo(q.x - r, q.y + r); ctx.stroke(); } ctx.globalAlpha = 1; }
  else if (nudge && nudge.door && now - nudge.t0 < 1400) { const q = center(L.door), s = T().closed; ctx.globalAlpha = Math.min(1, (1400 - (now - nudge.t0)) / 400); ctx.font = '700 13px system-ui,sans-serif'; const w = ctx.measureText(s).width + 18, bx = Math.max(6, Math.min(CONFIG.W - w - 6, q.x - w / 2)), by = Math.max(geo.top, q.y - cs * 0.95);
    ctx.fillStyle = 'rgba(8,14,20,.9)'; rr(bx, by, w, 24, 12); ctx.fill(); text(s, bx + w / 2, by + 12.5, 13, '#c9d6e0', 'center', 700); ctx.globalAlpha = 1; } }

function drawHint() { const h = LEVELS[cur].hint; if (!h) return; const lines = wrap(h[lang], CONFIG.W - 40, 13.5).slice(0, 3); lines.forEach((s, i) => text(s, CONFIG.W / 2, geo.bot + 14 + i * 17, 13.5, '#a9bac7', 'center', 500)); }
function button(x, y, w, h, label, fn, opt) { opt = opt || {}; rr(x, y, w, h, 14); ctx.fillStyle = opt.primary ? '#e7a94a' : opt.dim ? '#141d26' : '#1c2832'; ctx.fill(); ctx.strokeStyle = opt.primary ? '#ffd58a' : '#2f4050'; ctx.lineWidth = 1.5; ctx.stroke();
  text(label, x + w / 2, y + h / 2 + 0.5, opt.size || 15, opt.primary ? '#1b1206' : opt.dim ? '#5f7383' : '#e6eef4', 'center', 700); buttons.push({ x, y, w, h, fn }); }
function drawPanel() { const y = CONFIG.H - CONFIG.panel + 10, w = 112, g = 9, x0 = (CONFIG.W - 3 * w - 2 * g) / 2, t = T();
  button(x0, y, w, 50, t.undo, uiUndo, { dim: !hist.length }); button(x0 + w + g, y, w, 50, t.restart, uiRestart, { dim: !hist.length }); button(x0 + 2 * (w + g), y, w, 50, t.levels, () => { mode = 'levels'; }); }
function drawWon(now) { const a = Math.max(0, Math.min(1, (now - wonAt - 320) / 220)); if (a <= 0) return; const t = T(), lv = LEVELS[cur], last = cur === LEVELS.length - 1, y = geo.bot + 2 + (1 - a) * 24, h = CONFIG.H - geo.bot - 10;
  ctx.globalAlpha = a; rr(10, y, CONFIG.W - 20, h, 20); ctx.fillStyle = 'rgba(16,24,32,.97)'; ctx.fill(); ctx.strokeStyle = '#e7a94a'; ctx.lineWidth = 2; ctx.stroke();
  text(last ? t.all : t.won, CONFIG.W / 2, y + 27, 21, '#ffd58a', 'center', 800); text(`${t.moves}: ${S.t}` + (S.t === lv.par ? `  ·  ${t.best}` : ''), CONFIG.W / 2, y + 51, 13.5, '#a9bac7', 'center', 600);
  const by = y + 66, bh = h - 78; button(22, by, 104, bh, t.again, uiRestart); button(134, by, 104, bh, t.levels, () => { mode = 'levels'; }, last ? { primary: true } : {}); if (!last) button(246, by, 122, bh, t.next + '  →', () => go(cur + 2), { primary: true }); else button(246, by, 122, bh, t.undo, uiUndo); ctx.globalAlpha = 1; }
function drawLevels() { const t = T(); buttons = []; ctx.fillStyle = 'rgba(6,10,14,.93)'; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H); text(t.pick, CONFIG.W / 2, 44, 24, '#f1e6d2', 'center', 800);
  const w = 108, h = 82, g = 10, x0 = (CONFIG.W - 3 * w - 2 * g) / 2;
  LEVELS.forEach((lv, i) => { const x = x0 + (i % 3) * (w + g), y = 80 + Math.floor(i / 3) * (h + g), done = doneSet.has(i); rr(x, y, w, h, 14); ctx.fillStyle = done ? '#23382c' : '#1c2832'; ctx.fill(); ctx.strokeStyle = i === cur ? '#e7a94a' : done ? '#4f8a62' : '#2f4050'; ctx.lineWidth = i === cur ? 2.5 : 1.5; ctx.stroke();
    text(String(i + 1), x + 14, y + 26, 24, '#f1e6d2', 'left', 800); if (done) text('✓', x + w - 14, y + 24, 18, '#7fd39a', 'right', 800);
    const nm = wrap(lv.name[lang], w - 26, 11.5).slice(0, 2); nm.forEach((s, j) => text(s, x + 14, y + 52 + j * 14, 11.5, '#9fb0bd', 'left', 500)); buttons.push({ x, y, w, h, fn: () => go(i + 1) }); });
  const by = 80 + 5 * (h + g) + 12; button(x0, by, 160, 48, t.lang, () => { lang = lang === 'ru' ? 'en' : 'ru'; store.set('lang', lang); }); button(CONFIG.W - x0 - 160, by, 160, 48, t.close, () => { mode = S.won ? 'won' : 'play'; }, { primary: true }); }
function frame(now) { ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); ctx.fillStyle = '#0d151c'; ctx.fillRect(0, 0, CONFIG.W, CONFIG.H); buttons = [];
  drawHeader(); drawField(now); if (mode === 'won' && now - wonAt > 320) drawWon(now); else { drawHint(); drawPanel(); } if (mode === 'levels') drawLevels(); requestAnimationFrame(frame); }

// ---------- управление: тап по клетке рядом, свайп, стрелки/WASD ----------
let down = null; const local = ev => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) / scale, y: (ev.clientY - r.top) / scale }; };
const dirOf = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
cv.addEventListener('pointerdown', ev => { ev.preventDefault(); down = Object.assign(local(ev), { id: ev.pointerId }); });
cv.addEventListener('pointerup', ev => { ev.preventDefault(); if (!down) return; const p = local(ev), dx = p.x - down.x, dy = p.y - down.y, start = down; down = null;
  if (Math.hypot(dx, dy) > 26 && mode === 'play') return tryStep(dirOf(dx, dy));                                    // свайп
  for (let i = buttons.length - 1; i >= 0; i--) { const b = buttons[i]; if (start.x >= b.x && start.x <= b.x + b.w && start.y >= b.y && start.y <= b.y + b.h) return b.fn(); }
  if (mode !== 'play' || start.y < geo.top - 6 || start.y > geo.bot + 6) return; const h = center(player()), ax = start.x - h.x, ay = start.y - h.y; if (Math.hypot(ax, ay) < geo.cs * 0.35) return; tryStep(dirOf(ax, ay)); });   // тап: в сторону от героя
cv.addEventListener('pointercancel', () => { down = null; });
addEventListener('keydown', ev => { const k = ev.key.toLowerCase(), d = { arrowup: 'U', w: 'U', ц: 'U', arrowdown: 'D', s: 'D', ы: 'D', arrowleft: 'L', a: 'L', ф: 'L', arrowright: 'R', d: 'R', в: 'R' }[k];

addEventListener('resize', fit);

window.FUSE = { CONFIG, LEVELS, load, state, legal, step, undo, restart, preview, solve, log, core: C };
go(+qs.get('level') || store.get('level', 1)); fit(); requestAnimationFrame(frame);
})();
