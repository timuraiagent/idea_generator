<!--
NAME        | col,row | x,y     | anchor/notes
floor_a     | 0,0     | 0,0     | full cell; 2 px edge seam, 3 px inset bevel
floor_b     | 1,0     | 128,0   | full cell; same edges as floor_a
floor_c     | 2,0     | 256,0   | full cell; same edges as floor_a
wall_top    | 3,0     | 384,0   | full cell; uninterrupted perimeter
wall_front  | 4,0     | 512,0   | full cell; repeat horizontally; top 56 px crop safe
pit         | 5,0     | 640,0   | full cell; broken opening, floor at corners
stone       | 6,0     | 768,0   | transparent; raised octagon, centred
crack       | 7,0     | 896,0   | transparent; branches reach top, left and right
water       | 0,1     | 0,128   | transparent; rounded puddle, centred
oil         | 1,1     | 128,128 | transparent; lobed splat and three drops
ash         | 2,1     | 256,128 | transparent; soot and three charred remnants
wood        | 3,1     | 384,128 | 64,120; three uprights, two diagonal braces
spool       | 4,1     | 512,128 | 64,120; cord end curls to right
lamp_off    | 5,1     | 640,128 | 64,120; iron silhouette shared with lamp_on
lamp_on     | 6,1     | 768,128 | 64,120; luminous glass only, no baked glow
hand        | 7,1     | 896,128 | centred; index points down-left, cuff at 64,120
door_closed | 0,2     | 0,256   | 64,120; stone arch, iron bands and padlock
door_open   | 1,2     | 128,256 | 64,120; same arch, splayed leaves and three steps
hero_a      | 2,2     | 256,256 | 64,120; facing right, planted feet
hero_b      | 3,2     | 384,256 | 64,120; facing right, stride and cape swing
guard_sleep | 4,2     | 512,256 | 64,120; slumped, closed eyes, leaning halberd
guard_awake | 5,2     | 640,256 | 64,120; tall stance, raised halberd
EMPTY       | 6,2     | 768,256 | transparent, reserved
EMPTY       | 7,2     | 896,256 | transparent, reserved

All coordinates local to 128 x 128 cells. Flat albedo; light from upper left.
No cord, ambient darkness, glow or particles: the engine supplies these.
-->
