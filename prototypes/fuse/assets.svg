<?xml version="1.0" encoding="UTF-8"?>
<!--
Sprite atlas: 5 columns x 4 rows; cell = 128 x 128 px; origin = top-left.
All column,row values are zero-based. SVG size = 640 x 512.
name           -> column,row | x,y (cell top-left)
floor          -> 0,0        | 0,0
wall           -> 1,0        | 128,0
pit            -> 2,0        | 256,0
stone          -> 3,0        | 384,0
oil            -> 4,0        | 512,0
burning        -> 0,1        | 0,128
lamp_off       -> 1,1        | 128,128
lamp_on        -> 2,1        | 256,128
door_closed    -> 3,1        | 384,128
door_open      -> 4,1        | 512,128
guard_asleep   -> 0,2        | 0,256
guard_awake    -> 1,2        | 128,256
hero           -> 2,2        | 256,256
flame          -> 3,2        | 384,256
cord_h         -> 4,2        | 512,256
cord_corner    -> 0,3        | 0,384
spark          -> 1,3        | 128,384
danger         -> 2,3        | 256,384
light          -> 3,3        | 384,384
hand           -> 4,3        | 512,384
Crop with drawImage(image, x, y, 128, 128, dx, dy, size, size).
floor/oil/burning are terrain; other objects layer on terrain.
cord_h: left to right at y=64; cord_corner: left to bottom.
Rotate cords about (64,64). flame cord exits right at y=64.
light/danger are full-cell translucent overlays; no page background.
Object artwork stays inside ~8 px; cords/overlays intentionally touch edges.
-->
