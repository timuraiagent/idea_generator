let AC=null, master=null, noiseBuf=null, muted=lsGet('sticks3.muted',false);
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.5; master.connect(AC.destination); }
  catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur,vol,freq,q){
  if(!AC||muted) return;
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5|0,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t0=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  g.gain.setValueAtTime(Math.max(0.0002,vol),t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur+0.03);
}

function loadLevel(n){

/* ---------- правила ---------- */
// насколько ближайшая дырка не дошла до стрелки (0 — ровно под стрелкой)
function holeErr(w){ if(!w.holes) return Infinity; const step=TAU/w.holes; let e=((w.a%step)+step)%step; if(e>step/2) e-=step; return e; }
function holeErr2(w){ let e=((w.a2%TAU)+TAU)%TAU; if(e>Math.PI) e-=TAU; return e; }      // внутренний диск двойного колеса
const tolOf = w => G.lv.dial ? (w.dbl?0.3:0.24) : (w.dbl?CONFIG.TOL2:CONFIG.TOL);
const aligned = w => { const tl=tolOf(w); return w.dbl ? (Math.abs(holeErr(w))<=tl && Math.abs(holeErr2(w))<=tl) : Math.abs(holeErr(w))<=tl; };
const shutClosed = w => w.lock>=0 && w.shut>0.15;                       // заслонка закрыта, пока крутится колесо-ключ
const canJam = w => w.holes>0 && w.jam<=0 && w.on && w.spin>0.5 && !shutClosed(w) && aligned(w);

  if(!w.on || w.spin<0.5){ toast(t('tStopped')); return; }
  if(shutClosed(w)){ toast(t('tShut'),KEYC,3); G.fx.push({type:'shake',w:w.i,life:0.4,max:0.4}); G.hlKey={w:w.lock,t:1.6}; return; }
  if(G.sticks<=0){ toast(t('tNoSticks'),RED); return; }
  const type=takeStick();
  if(G.lv.time&&!G.clock){ G.clock=true; toast(t('tCat'),'#ffd166',2.4); }          // первая палка будит кота: пошёл таймер
  if(canJam(w) && !fits(w,type)){            // дырка под стрелкой, но палка слишком толстая

    const pt=tolOf(w)/3; w.perfect = Math.abs(holeErr(w))<=pt && (!w.dbl || Math.abs(holeErr2(w))<=pt);
    w.a-=holeErr(w); if(w.dbl) w.a2-=holeErr2(w);
    w.stick=type; w.jam=w.jamMax=stickLife(type); w.on=false; w.flipT=0; w.spin=0;
    for(const c of G.wheels) if(c.dbl && c.idrv===w.i){ const e=holeErr2(c); if(Math.abs(e)<0.45) c.a2-=e; }
    G.seq.push(w.i+1); SFX.jam();
    if(w.perfect){ G.perfects++; SFX.perfect(); G.fx.push({type:'txt', x:w.x, y:w.y-w.r-58, s:t('perfect1'), color:'#ffd166', size:22, life:1.3, max:1.3}); }
    G.fx.push({type:'txt', x:w.x-w.r-46, y:w.y-w.r-10, s:t('clack'), color:GREEN, size:24, life:0.9, max:0.9});
    G.fx.push({type:'ring', x:w.x, y:w.y, r:w.r, vr:160, life:0.45, max:0.45, color:GREEN});
  } else {                                   // мимо дырки — палка отскочила и сломалась
    G.misses++; SFX.miss();
    G.fx.push({type:'txt', x:w.x-w.r-46, y:w.y-w.r-10, s:t('ding'), color:RED, size:24, life:0.9, max:0.9});
    G.fx.push({type:'stick', x:w.x, y:w.y-w.r-18, vx:(Math.random()<0.5?-1:1)*(140+Math.random()*80), vy:-260, rot:0, vr:14, life:0.9, max:0.9, st:type});
    G.fx.push({type:'shake',w:w.i,life:0.3,max:0.3});
    if(G.missToasts<3){ G.missToasts++; toast(t('tMiss'),'#ff9d9d',3); }
  }
}
// что мешает мышонку впереди: работающие молоты и закрытые решётки
function blockers(mx){
  const out=[], goal=segGoal(G.mouse.seg);
  for(const w of G.wheels){
    if(w.ham!==undefined && w.ham>mx-26 && w.ham<goal && w.on && !isCalm(w)) out.push({kind:'ham',w});
    if(w.gate!==undefined && w.gate>mx-26 && w.gate<goal && w.open<0.9) out.push({kind:'gate',w});
  }
  return out.sort((a,b)=>(a.w.ham??a.w.gate)-(b.w.ham??b.w.gate));
}
function starsFor(){ const d=G.used-G.lv.par; return HINT[G.n]?1:(d<=0?3:(d===1?2:1)); }
let QUIET=false;   // для ботов-симуляторов: не писать в консоль и в сохранения
function logAttempt(result){
  if(QUIET) return;
  console.log('[sticks3] уровень', G.n+1, result, JSON.stringify({used:G.used, misses:G.misses, perfect:G.perfects, par:G.lv.par, seq:G.seq.join('→'),
    reach:G.reach+'/'+G.burrows.length, timeLeft:G.lv.time?+G.timeLeft.toFixed(1):null, near:G.near===null?null:+G.near.toFixed(2), tries:TRIES[G.n], hint:!!HINT[G.n], time:+G.time.toFixed(1)}));
}
function winLevel(){
  G.done=true; G.stars=starsFor();
  RESULTS[G.n]={used:G.used, misses:G.misses, par:G.lv.par, stars:G.stars, seq:G.seq.join('→'), tries:TRIES[G.n], hint:!!HINT[G.n]};
  if(!QUIET){ BEST[G.lv.id]=Math.max(BEST[G.lv.id]||0, G.stars); lsSet('sticks3.best',BEST); SFX.win(); }
  logAttempt('победа');
  for(let k=0;k<40;k++){ const a=Math.random()*TAU, v=100+Math.random()*220;
    G.fx.push({type:'conf', x:G.cheese, y:CONFIG.FLOOR-30, vx:Math.cos(a)*v, vy:Math.sin(a)*v-120, color:['#ffd166',GREEN,'#4fc3f7','#ffffff'][k%4], life:1.4, max:1.4, rot:Math.random()*TAU}); }
}
function failLevel(){ mode='fail'; G.doneT=0; if(!QUIET) SFX.fail(); logAttempt('неудача'); }

/* ---------- главный апдейт ---------- */
function update(dt){
  now+=dt;
  if(!G) return;
  updateFx(dt);
  if(mode==='done'||mode==='fail') G.doneT+=dt;
  if(mode!=='play') return;
  G.time+=dt;
  if(G.clock&&!G.done){ G.timeLeft-=dt; if(G.timeLeft<=0){ G.timeLeft=0; G.timeout=true; failLevel(); return; } }

  for(const w of G.wheels){                 // ведущие колёса идут в списке раньше ведомых
    if(w.jam>0){ w.jam-=dt; if(w.jam<=0){ w.jam=0; SFX.snap();
      if(w.perfect){ w.perfect=false; G.calm.push({until:G.time+1, set:G.wheels.filter(v=>v===w||!v.on).map(v=>v.i)}); }
      G.fx.push({type:'txt', x:w.x-w.r-46, y:w.y-w.r-10, s:t('crack'), color:WOOD, size:22, life:0.9, max:0.9});
      for(const s of [-1,1]) G.fx.push({type:'stick', x:w.x, y:w.y-w.r-10, vx:s*90, vy:-160, rot:0, vr:s*10, life:0.8, max:0.8, half:true, st:w.stick});
      if(!stalled(w) && (w.drv<0 || G.wheels[w.drv].on)){ w.on=true; w.spin=1; w.flipT=0; } } }
    const st=stalled(w), want = w.jam<=0 && !st && (w.drv<0 || G.wheels[w.drv].on);
    if(want!==w.on){ w.flipT+=dt; if(w.flipT>=((st||w.mesh)?0.06:CONFIG.BELT_DELAY)){ w.on=want; w.flipT=0;   // по зубьям — сразу, по ремню — с задержкой
        if(!want && w.gate!==undefined && G.time-G.lastGateToast>3){ G.lastGateToast=G.time; toast(t('tGate'),'#ff9d9d',3); } } }
    else w.flipT=0;
    w.spin+=((w.on?1:0)-w.spin)*Math.min(1,dt*9);
    if(w.lock>=0) w.shut=clamp(w.shut+(G.wheels[w.lock].on?1:-1)*dt*4,0,1);
    const p0=frac(w.a/TAU);
    w.a+=w.dir*TAU*w.rps*dt*w.spin; w.belt+=w.spin*dt*70;
    if(w.dbl && w.jam<=0) w.a2+=TAU*w.dbl*dt*(w.idrv>=0?G.wheels[w.idrv].spin:w.spin);
    if(w.ham!==undefined){
      const p1=frac(w.a/TAU);
      if(w.spin>0.6 && !isCalm(w) && (p0-0.5)*(p1-0.5)<0 && Math.abs(p1-p0)<0.4){ w.slamT=0.18; SFX.bang(w.i);
        for(let k=0;k<4;k++) G.fx.push({type:'dust', x:w.ham+(Math.random()-0.5)*50, y:CONFIG.FLOOR-4, vx:(Math.random()-0.5)*80, vy:-30-Math.random()*40, life:0.5, max:0.5}); }
      w.slamT=Math.max(0,w.slamT-dt);
    }
    if(w.gate!==undefined){
      const tgt=w.on?1:0, was=w.open;
      w.open=clamp(w.open+clamp(tgt-w.open,-dt*5,dt*2),0,1);
      if(was>0.05 && w.open<=0.05) SFX.gate();
    }
  }

  const m=G.mouse; m.t+=dt;
  G.calm=G.calm.filter(c=>c.until>G.time);
  G.cam+=(clamp(m.x-250,0,G.width-CONFIG.W)-G.cam)*Math.min(1,dt*3.5);
  if(!G.done){
    const blk=blockers(m.x), goal=segGoal(m.seg), last=m.seg>=G.burrows.length;
    if(m.state==='wait'){
      if(!blk.length){ m.clearT+=dt; if(m.clearT>=CONFIG.START_DELAY){ m.state='run'; m.face=1; SFX.squeak(); if(!G.ranOnce){ G.ranOnce=true; toast(t('tRun'),GREEN,1.6); } } }
      else m.clearT=0;
    } else if(m.state==='run'){
      if(blk.length){ const b=blk[0], bx=(b.kind==='ham'?b.w.ham:b.w.gate)+26, short=Math.max(0,(bx-m.x)/CONFIG.MOUSE_SPEED);
        G.near=Math.min(G.near===null?99:G.near,short);                 // сколько не хватило, чтобы проскочить
        m.state='back'; m.face=-1; SFX.scared(); toast(short<1.05?t('tAlmost').replace('%',short.toFixed(1)):t('tScared'),'#ff9d9d',2.6); }
      else { m.x+=CONFIG.MOUSE_SPEED*dt;
        if(m.x>=goal){ m.x=goal;
          if(last){ m.state='eat'; winLevel(); }
          else { m.seg++; G.reach=m.seg; m.state='wait'; m.clearT=0; SFX.hole();       // добежал до норки: тут безопасно
            G.fx.push({type:'ring', x:goal, y:CONFIG.FLOOR-16, r:12, vr:110, life:0.45, max:0.45, color:GREEN}); } } }
    } else if(m.state==='back'){
      const base=segBase(m.seg); m.x-=CONFIG.MOUSE_BACK*dt; if(m.x<=base){ m.x=base; m.state='wait'; m.face=1; m.clearT=0; }
    }
    // палок нет, ничего не заклинено и не меняется, мышонок ждёт — дальше ничего не произойдёт
    const settled=G.wheels.every(w=>w.flipT===0 && (w.gate===undefined || Math.abs(w.open-(w.on?1:0))<0.02));
    if(G.sticks<=0 && m.state==='wait' && blk.length && settled && !G.calm.length && !G.wheels.some(w=>w.jam>0)){ G.failT+=dt; if(G.failT>0.5) failLevel(); } else G.failT=0;
  } else { G.winT+=dt; if(G.winT>1.1){ mode='done'; G.doneT=0; } }
}
function updateFx(dt){
  for(const e of G.fx){
    e.life-=dt;
    if(e.type==='ring') e.r+=e.vr*dt;
    if(e.type==='txt') e.y-=28*dt;
    if(e.type==='conf'||e.type==='stick'){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=520*dt; e.rot+=(e.vr||6)*dt; }
    if(e.type==='dust'){ e.x+=e.vx*dt; e.y+=e.vy*dt; }
  }
  G.fx=G.fx.filter(e=>e.life>0);
  if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; }
  if(G.hlKey){ G.hlKey.t-=dt; if(G.hlKey.t<=0) G.hlKey=null; }
}

/* ---------- ввод ---------- */
function toWorld(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*CONFIG.W/r.width, y:(e.clientY-r.top)*CONFIG.H/r.height}; }
function toggleLang(){ LANG=LANG==='ru'?'en':'ru'; try{ localStorage.setItem('sticks3.lang',LANG); }catch(e){} document.documentElement.lang=LANG; }
function toggleMute(){ muted=!muted; lsSet('sticks3.muted',muted); }
function wheelAt(p,pad){
  let best=null, bd=1e9;
  for(const w of G.wheels){ const d=Math.hypot(p.x-w.x,p.y-w.y); if(d<=w.r+pad && d<bd){ bd=d; best=w; } }
  return best;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit();
  const p=toWorld(e), touchy=e.pointerType!=='mouse';
  mouse.x=p.x; mouse.y=p.y;
  for(let i=uiButtons.length-1;i>=0;i--){ const b=uiButtons[i]; if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){ b.act(); return; } }
  if(mode==='levels') return;
  if(mode==='start'){ startGame(); return; }
  if(mode==='intro'){ mode='play'; return; }
  if(mode==='help'){ if(helpPage===0) helpPage=1; else mode=helpReturn; return; }
  if(mode==='fail'){ if(G.doneT>0.25) restartLevel(); return; }      // провал дёшев: тап в любом месте — ещё раз
  if(mode!=='play'||G.done) return;
  const w=wheelAt({x:p.x+G.cam,y:p.y}, touchy?22:8);
  if(w) tapWheel(w);
});
cv.addEventListener('pointermove',e=>{ const p=toWorld(e); mouse.x=p.x; mouse.y=p.y; mouse.inside=e.pointerType==='mouse'; });
cv.addEventListener('pointerleave',()=>{ mouse.inside=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  audioInit();
  const k=e.code;
  if(k==='Space') e.preventDefault();
  if(e.repeat) return;
  if(k==='KeyL') toggleLang();
  if(mode==='play'&&(k==='Space'||k==='KeyX')){ swapHand(); return; }
  if(k==='KeyM') toggleMute();
  const ok=(k==='Space'||k==='Enter');
  if(mode==='levels'){ if(k==='Escape'||ok) mode=levelsReturn; }
  else if(mode==='start'){ if(ok) startGame(); else if(k==='KeyH') openHelp(); }
  else if(mode==='intro'){ if(ok) mode='play'; }
  else if(mode==='help'){ if(ok&&helpPage===0) helpPage=1; else if(ok||k==='KeyH'||k==='Escape') mode=helpReturn; }
  else if(mode==='done'){ if(ok||k==='KeyN') nextLevel(); else if(k==='KeyR'){ TRIES[G.n]=0; restartLevel(); } }
  else if(mode==='fail'){ if(ok||k==='KeyR') restartLevel(); }
  else if(mode==='final'){ if(ok) startGame(); }
  else if(mode==='play'){ if(k==='KeyR') restartLevel(); if(k==='KeyH'||k==='Slash') openHelp(); }
});

/* ---------- примитивы рисования ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function text(s,x,y,size,color,align,weight){ ctx.font=`${weight||'bold'} ${size}px ${FONT}`; ctx.fillStyle=color; ctx.textAlign=align||'center'; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); }
function wrapLines(str,maxW,size,weight){
  ctx.font=`${weight||'bold'} ${size}px ${FONT}`;
  const words=str.split(' '), lines=[]; let cur='';
  for(const w of words){ const test=cur?cur+' '+w:w; if(ctx.measureText(test).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=test; }
  if(cur) lines.push(cur); return lines;
}
function starShape(x,y,r){ ctx.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rad=k%2?r*0.45:r; ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad); } ctx.closePath(); }
function drawStar(x,y,r,on){ starShape(x,y,r); ctx.fillStyle=on?'#ffd166':'#2b2140'; ctx.fill(); ctx.strokeStyle=on?'#b8862a':'#4f4068'; ctx.lineWidth=2; ctx.stroke(); }
function drawStickIcon(x,y,h,alpha,type){ const st=STICKS[type||'N'], hh=type==='S'?h*0.8:h;
  ctx.globalAlpha=alpha; ctx.fillStyle=st.color; rr(x-st.w/2,y-hh,st.w,hh,Math.min(3,st.w/2)); ctx.fill(); ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=1.5; ctx.stroke(); ctx.globalAlpha=1; }

/* ---------- предметы мира ---------- */
function drawWheel(w,o){
  const {x,y,r}=w, solid=!w.holes, sh=o&&o.shake?Math.sin(now*70)*3*o.shake:0;
  ctx.save(); ctx.translate(x+sh,y);
  if(o&&o.hover){ ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=3; circ(0,0,r+(w.gear?13:6)); ctx.stroke(); }
  if(w.gear){ // зубья: шестерни сцеплены, одна встала — встали обе
    ctx.save(); ctx.rotate(w.a); ctx.fillStyle=solid?'#596174':'#b5842f'; ctx.strokeStyle=solid?'#3d4352':'#6f5120'; ctx.lineWidth=2;
    const n=Math.round(r/4.4); for(let k=0;k<n;k++){ ctx.save(); ctx.rotate(k*TAU/n); ctx.beginPath(); ctx.moveTo(-4.5,-r+2); ctx.lineTo(-3,-r-7); ctx.lineTo(3,-r-7); ctx.lineTo(4.5,-r+2); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.restore(); }
  ctx.fillStyle=solid?'#596174':'#b5842f'; circ(0,0,r); ctx.fill(); ctx.strokeStyle=solid?'#3d4352':'#6f5120'; ctx.lineWidth=4; ctx.stroke();
  const dial=G&&G.lv.dial&&w.holes===1&&w.rps>0, dc=DIALC;
  if(dial){ // число у дырки = через сколько секунд она придёт под стрелку
    const n=Math.round(1/w.rps), d=w.dir||1;
    for(let k=1;k<n;k++){ const a=-d*k*TAU/n, sx=Math.sin(a), cy=-Math.cos(a);
      ctx.strokeStyle=hexA(dc,0.9); ctx.lineWidth=2.5; line(sx*(r+3),cy*(r+3),sx*(r+9),cy*(r+9));
      text(String(k),sx*(r+20),cy*(r+20)+4.5,12.5,hexA(dc,0.95)); }
    ctx.save(); ctx.rotate(w.a); ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.moveTo(0,-r-8); ctx.lineTo(-5.5,-r+3); ctx.lineTo(5.5,-r+3); ctx.closePath(); ctx.fill(); ctx.restore();   // белый зубчик: где сейчас дырка
  }
  if(w.dbl){ // двойное колесо: внешнее кольцо и внутренний диск крутятся навстречу, у каждого своя дырка
    ctx.save(); ctx.rotate(w.a);
    ctx.fillStyle='#dbab52'; circ(0,0,r*0.94); ctx.fill();
    ctx.fillStyle='#6f5120'; for(let k=0;k<8;k++){ const a=k*TAU/8+0.4; circ(Math.sin(a)*r*0.8,-Math.cos(a)*r*0.8,2.4); ctx.fill(); }
    if(w.narrow){ ctx.fillStyle=NARROW; circ(0,-r*0.8,r*0.14); ctx.fill(); ctx.fillStyle='#120e19'; circ(0,-r*0.8,r*0.075); ctx.fill(); }
    else { ctx.fillStyle='#120e19'; circ(0,-r*0.8,r*0.13); ctx.fill(); ctx.strokeStyle='#6f5120'; ctx.lineWidth=2.5; ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle='#8a4a2a'; circ(0,0,r*0.63); ctx.fill();
    if(dial && w.idrv>=0 && Math.abs(w.dbl-w.rps)<1e-6){ ctx.save(); ctx.rotate(w.a2); ctx.fillStyle=INNERC; ctx.strokeStyle='#17131f'; ctx.lineWidth=1.5;   // медный зубчик диска на том же циферблате
      ctx.beginPath(); ctx.moveTo(0,-r-8); ctx.lineTo(-5.5,-r+3); ctx.lineTo(5.5,-r+3); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    ctx.save(); ctx.rotate(w.idrv>=0?w.a2:-w.a2);
    ctx.fillStyle='#d9845a'; circ(0,0,r*0.58); ctx.fill();
    ctx.strokeStyle='#b0633d'; ctx.lineWidth=r*0.07; line(-r*0.5,0,r*0.5,0); line(0,r*0.12,0,r*0.5);
    if(w.narrow){ ctx.fillStyle=NARROW; circ(0,-r*0.38,r*0.14); ctx.fill(); ctx.fillStyle='#120e19'; circ(0,-r*0.38,r*0.075); ctx.fill(); }
    else { ctx.fillStyle='#120e19'; circ(0,-r*0.38,r*0.13); ctx.fill(); ctx.strokeStyle='#8a4a2a'; ctx.lineWidth=2.5; ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle=w.idrv>=0?INNERC:'#3a3346'; circ(0,0,r*0.13); ctx.fill(); if(w.idrv>=0){ ctx.strokeStyle='#17131f'; ctx.lineWidth=2; ctx.stroke(); }
    ctx.restore(); return;
  }
  ctx.save(); ctx.rotate(w.a);
  ctx.fillStyle=solid?'#7b8498':'#dbab52'; circ(0,0,r*0.84); ctx.fill();
  ctx.fillStyle=solid?'#3d4352':'#6f5120';
  for(let k=0;k<8;k++){ const a=k*TAU/8+0.2; circ(Math.sin(a)*r*0.92,-Math.cos(a)*r*0.92,2.6); ctx.fill(); }
  ctx.strokeStyle=solid?'#5d6577':'#c2913a'; ctx.lineWidth=r*0.1;
  for(let k=0;k<3;k++){ const a=k*TAU/6+(solid?0:Math.PI/6*(w.holes===2?3:1)); line(Math.sin(a)*r*0.78,-Math.cos(a)*r*0.78,-Math.sin(a)*r*0.78,Math.cos(a)*r*0.78); }
  for(let k=0;k<w.holes;k++){ const a=k*TAU/w.holes, hx=Math.sin(a)*r*0.58, hy=-Math.cos(a)*r*0.58;
    if(w.narrow){ ctx.fillStyle=NARROW; circ(hx,hy,r*0.2); ctx.fill(); ctx.fillStyle='#120e19'; circ(hx,hy,r*0.1); ctx.fill(); }   // узкая дырка в синей втулке
    else { ctx.fillStyle='#120e19'; circ(hx,hy,r*0.2); ctx.fill(); ctx.strokeStyle='#6f5120'; ctx.lineWidth=2.5; ctx.stroke(); } }
  ctx.restore();
  const hub=G&&G.wheels&&G.wheels.some(c=>c.idrv===w.i);        // это колесо крутит чей-то внутренний диск: медная ось
  ctx.fillStyle=hub?INNERC:'#3a3346'; circ(0,0,r*(hub?0.2:0.17)); ctx.fill(); ctx.strokeStyle='#221c2b'; ctx.lineWidth=2; ctx.stroke();
  ctx.restore();
}
function drawInnerBelt(D,W){ // медный ремень: от оси мотора к внутреннему диску составного колеса
  const dx=W.x-D.x, dy=W.y-D.y, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len, off=4, moving=D.spin>0.08;
  for(const s of [-1,1]){
    const x1=D.x+nx*off*s, y1=D.y+ny*off*s, x2=W.x+nx*off*s, y2=W.y+ny*off*s;
    ctx.strokeStyle='#15111c'; ctx.lineWidth=6; line(x1,y1,x2,y2);
    ctx.strokeStyle=moving?'#a85f3a':'#4a4158'; ctx.lineWidth=3.5; line(x1,y1,x2,y2);
    ctx.strokeStyle=moving?'#ffc9a8':'#6b6280'; ctx.lineWidth=1.5; ctx.setLineDash([6,8]); ctx.lineDashOffset=-D.belt*s;
    line(x1,y1,x2,y2); ctx.setLineDash([]); ctx.lineDashOffset=0;
  }
}

    if(e.type==='conf'){ ctx.save(); ctx.globalAlpha=a; ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.fillStyle=e.color; ctx.fillRect(-4,-2.5,8,5); ctx.restore(); }
    if(e.type==='stick'){ const st=STICKS[e.st||'N']; ctx.save(); ctx.globalAlpha=a; ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.fillStyle=st.color; rr(-st.w/2,e.half?-11:-20,st.w,e.half?22:40,Math.min(3,st.w/2)); ctx.fill(); ctx.restore(); }
    if(e.type==='dust'){ ctx.fillStyle=`rgba(180,170,200,${a*0.45})`; circ(e.x,e.y,4+(1-a)*7); ctx.fill(); }
  }
  ctx.restore();
  if(G.toast){
    const a=clamp(G.toast.t/0.3,0,1)*clamp((G.toast.max-G.toast.t)/0.15,0,1);
    ctx.globalAlpha=a; ctx.font=`bold 18px ${FONT}`; const w=ctx.measureText(G.toast.s).width+36;
    const tx=Math.max(300+w/2,Math.min(G.lv.time?540:590,(G.lv.time?736:CONFIG.W-20)-w/2));
    ctx.fillStyle='rgba(13,10,18,.96)'; rr(tx-w/2,F+24,w,36,18); ctx.fill(); ctx.strokeStyle=G.toast.color; ctx.lineWidth=2; ctx.stroke();
    text(G.toast.s,tx,F+48,18,G.toast.color); ctx.globalAlpha=1;
  }
  cv.style.cursor=((hover&&hover.holes>0)||mouseOverButton())?'pointer':'default';
}
function mouseOverButton(){ return uiButtons.some(b=>mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h); }

/* ---------- HUD, кнопки, оверлеи ---------- */
function button(label,cx,cy,w,h,act,primary,size,fixed){
  if(isTouch && !fixed){ h=Math.max(h,68); w=Math.max(w,h); }
  const x=cx-w/2, y=cy-h/2, hov=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  ctx.fillStyle=primary?(hov?'#f0cf7e':'#e9c46a'):(hov?'#3a3050':'#2b2140'); rr(x,y,w,h,12); ctx.fill();
  if(!primary){ ctx.strokeStyle='#5b4d78'; ctx.lineWidth=2; ctx.stroke(); }
  text(label,cx,cy+(size||22)*0.36,size||22,primary?'#17131f':'#e8e6f0');
  uiButtons.push({x,y,w,h,act});
}
function drawTopBar(){
  ctx.fillStyle='#0f0b16'; ctx.fillRect(0,0,CONFIG.W,CONFIG.HUD_H);
  if(G&&mode!=='start'){
    const wi=Math.floor(G.n/5), s=`${t('level')} ${G.n+1} ${t('of')} ${LEVELS.length}`;   // сразу видно, сколько уровней всего
    text(s,16,29,16,WORLDS[wi].c,'left'); ctx.font=`bold 16px ${FONT}`; const w=ctx.measureText(s).width;
    text(L(G.lv.name),16+w+12,29,20,'#e8e6f0','left');
    ctx.font=`bold 20px ${FONT}`; const w2=ctx.measureText(L(G.lv.name)).width;
    const ws=`${t('world')} ${wi+1}: ${L(WORLDS[wi])}`; ctx.font=`normal 14px ${FONT}`;
    if(16+w+12+w2+18+ctx.measureText(ws).width < (SIDE_UI?CONFIG.W-16:CONFIG.W-280)) text(ws,16+w+12+w2+18,28,14,'#8f86a8','left','normal');
  } else text('idea_generator · '+(LANG==='ru'?'прототип механики · v3 «длинные машины»':'mechanic prototype · v3 “long machines”'),16,28,14,'#5b5372','left','normal');
  if(SIDE_UI) return;                     // на телефоне эти кнопки — крупные, сбоку от поля
  const bw=44, bh=34, y=5; let x=CONFIG.W-8-bw;
  const btns=[{l:'?', a:()=>{ if(mode==='help') mode=helpReturn; else openHelp(); }}, {l:muted?'🔇':'🔊', a:toggleMute}, {l:LANG==='ru'?'EN':'RU', a:toggleLang}, {l:'☰', a:openLevels}];
  if(mode==='play') btns.splice(1,0,{l:'↺', a:restartLevel});
  for(const b of btns){ button(b.l,x+bw/2,y+bh/2,bw,bh,b.a,false,18,true); x-=bw+8; }
}
// боковые кнопки (DOM): заново, помощь, уровни, звук, язык, полный экран
const sideBtns=[
  {id:'r', label:()=>'↺', act:()=>{ if(mode==='play') restartLevel(); }, off:()=>mode!=='play'},
  {id:'h', label:()=>'?', act:()=>{ if(mode==='help') mode=helpReturn; else openHelp(); }},
  {id:'l', label:()=>'☰', act:openLevels},
  {id:'m', label:()=>muted?'🔇':'🔊', act:toggleMute},
  {id:'g', label:()=>LANG==='ru'?'EN':'RU', act:toggleLang},
];
if(document.documentElement.requestFullscreen) sideBtns.push({id:'f', label:()=>'⛶', act:toggleFS});
for(const b of sideBtns){ const el=document.createElement('button'); el.type='button'; b.el=el; el.textContent=b.label();
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); audioInit(); b.act(); }); sideEl.appendChild(el); }
function syncSide(){ if(!SIDE_UI) return; for(const b of sideBtns){ const lab=b.label(); if(b.el.textContent!==lab) b.el.textContent=lab; const off=!!(b.off&&b.off()); if(b.el.disabled!==off) b.el.disabled=off; } }
function dim(){ ctx.fillStyle='rgba(10,8,15,.7)'; ctx.fillRect(0,CONFIG.HUD_H,CONFIG.W,CONFIG.H-CONFIG.HUD_H); }
function panel(x,y,w,h,color){ ctx.fillStyle='#211a2e'; rr(x,y,w,h,18); ctx.fill(); ctx.strokeStyle=color||'#e9c46a'; ctx.lineWidth=2; ctx.stroke(); }

function drawSteps(top){ // три картинки «как играть»
  const cxs=[170,480,790], tt=now;
  cxs.forEach((cx,i)=>{
    ctx.fillStyle='#1d1728'; rr(cx-142,top,284,212,14); ctx.fill(); ctx.strokeStyle='#2f2540'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#e9c46a'; circ(cx-118,top+24,15); ctx.fill(); text(String(i+1),cx-118,top+31,18,'#17131f');
    if(i===0){
      const w={x:cx,y:top+100,r:46,holes:1,a:tt*1.6,jam:0}, ok=Math.abs(holeErr(w))<=0.5;
      drawWheel(w,{}); drawBracket({...w,on:true,spin:1},{ok});
      if(ok){ text(t('now'),cx+92,top+60,20,GREEN,'center','900'); text('👆',cx+34,top+146,30,'#fff'); }
    } else if(i===1){
      const w={x:cx-50,y:top+100,r:42,holes:1,a:0,jam:6-(tt%6),jamMax:6,stick:'N'};
      drawWheel(w,{}); drawBracket(w,{ok:false});
      ctx.save(); ctx.translate(cx+62,top-398+34); ctx.scale(0.86,0.86); drawHammer(0,0,false,0,CONFIG.CEIL-52); ctx.restore();
    } else {
      const ph=(tt%2.4)/2.4, mx=cx-100+ph*150;
      drawMouse(mx,top+140,{face:1,run:true,t:tt});
      drawCheese(cx+92,top+140);
    }
    const cap=t('step'+(i+1));
    text(cap[0],cx,top+178,16,'#e8e6f0'); text(cap[1],cx,top+200,16,'#e8e6f0');
  });
}
function drawLevelRow(y){ // полоска миров: сколько уровней всего и сколько звёзд собрано; тап — к выбору уровня
  const nW=Math.ceil(LEVELS.length/5), cw=84, gap=6, x0=480-(nW*cw+(nW-1)*gap)/2;
  const all=LEVELS.reduce((a,_,i)=>a+bestOf(i),0);
  text(`${LEVELS.length} ${t('nLevels')} · ${nW} ${t('nWorlds')} · ★ ${all}/${LEVELS.length*3}`,480,y-14,16,'#cfcbe0');
  for(let wi=0;wi<nW;wi++){ const x=x0+wi*(cw+gap), a=wi*5, b=Math.min(LEVELS.length,a+5); let st=0; for(let i=a;i<b;i++) st+=bestOf(i);
    ctx.fillStyle=st?hexA(WORLDS[wi].c,0.22):'#241c31'; rr(x,y,cw,50,9); ctx.fill(); ctx.strokeStyle=WORLDS[wi].c; ctx.lineWidth=2; ctx.stroke();
    text(`${a+1}–${b}`,x+cw/2,y+22,17,'#e8e6f0','center','900'); text(`★ ${st}/${(b-a)*3}`,x+cw/2,y+41,12,st?'#ffd166':'#8f86a8','center','normal');
    uiButtons.push({x,y,w:cw,h:50,act:openLevels}); }
}
function drawStart(){
  ctx.fillStyle='#17131f'; ctx.fillRect(0,CONFIG.HUD_H,CONFIG.W,CONFIG.H-CONFIG.HUD_H);
  ctx.save(); ctx.shadowColor='#e9c46a'; ctx.shadowBlur=22; text(t('title'),480,108,54,'#f2e6c4','center','900'); ctx.restore();
  text(t('sub1'),480,146,18,'#cfcbe0','center','normal');
  text(t('sub2'),480,170,18,'#cfcbe0','center','normal');
  drawSteps(192);
  button(t('play'),400,isTouch?456:450,270,58,startGame,true,28);
  button('☰ '+t('levels'),672,isTouch?456:450,190,58,openLevels,false,22);
  drawLevelRow(isTouch?558:548);
}
function drawLevels(){ // выбор уровня крупными плитками: главы в две колонки
  dim(); panel(20,50,920,582);
  text(`${t('levels')} · ${LEVELS.length}`,480,88,26,'#e8e6f0','center','900');
  const nW=Math.ceil(LEVELS.length/5), perCol=Math.ceil(nW/2), tw=80, th=62, gx=8;
  for(let wi=0;wi<nW;wi++){
    const col=wi<perCol?0:1, row=col?wi-perCol:wi, x0=44+col*452, y0=106+row*103;
    text(`${wi+1}. ${L(WORLDS[wi])}`,x0,y0+12,15,WORLDS[wi].c,'left');
    for(let k=0;k<5;k++){ const i=wi*5+k; if(i>=LEVELS.length) break;
      const x=x0+k*(tw+gx), y=y0+20, best=bestOf(i), cur=G&&G.n===i;
      ctx.fillStyle=cur?'#3a3050':(best?hexA(WORLDS[wi].c,0.22):'#241c31'); rr(x,y,tw,th,10); ctx.fill();
      ctx.strokeStyle=cur?'#ffffff':WORLDS[wi].c; ctx.lineWidth=cur?3:2; ctx.stroke();
      text(String(i+1),x+tw/2,y+32,25,'#e8e6f0','center','900');
      for(let st=0;st<3;st++){ ctx.fillStyle=st<best?'#ffd166':'#3a3050'; starShape(x+tw/2-14+st*14,y+49,5.5); ctx.fill(); }
      uiButtons.push({x,y,w:tw,h:th,act:()=>goLevel(i)});
    }
  }
  button('← '+t('back'),842,80,170,50,()=>{ mode=levelsReturn; },false,20,true);
}
function drawIntro(){
  dim(); panel(160,216,640,334);
  text(`${t('level')} ${G.n+1} · ${L(WORLDS[Math.floor(G.n/5)])}`,480,258,18,WORLDS[Math.floor(G.n/5)].c);
  text(L(G.lv.name),480,304,42,'#e8e6f0','center','900');
  const tip=wrapLines(L(G.lv.tip),580,21);
  tip.slice(0,3).forEach((s,i)=>text(s,480,346+i*29,21,'#cfcbe0'));
  { const yy=346+Math.min(3,tip.length)*29+30, wq=G.queue.reduce((a,q)=>a+STICKS[q].w+12,0); let qx=480-wq/2+6;
    G.queue.forEach(q=>{ drawStickIcon(qx,yy,30,1,q); qx+=STICKS[q].w+12; }); }
  if(G.lv.time) text(`😼 ${G.lv.time} ${t('sec')} — ${t('catIntro')}`,480,462,16,'#ffd166');
  button(t('got'),480,506,240,52,()=>{ mode='play'; },true,24);
}
function drawDone(){
  dim(); panel(220,200,520,330);
  text(t('win'),480,254,36,'#ffd166','center','900');
  for(let i=0;i<3;i++){ const k=clamp((G.doneT-0.15-i*0.2)/0.25,0,1), r=30*(i<G.stars?(k<1?0.6+0.6*k:1):1); drawStar(400+i*80,318,r,i<G.stars&&k>0); }
  text(`${t('used')}: ${G.used} · ${t('canDo')} ${G.lv.par}`,480,382,21,'#e8e6f0');
  const msg=G.stars===3?t('perfect'):(G.stars===2?t('good'):t('ok')+G.lv.par);
  text(msg,480,414,17,G.stars===3?'#9fe8b0':'#ffd166','center','normal');
  button(t('again'),370,480,180,52,()=>{ TRIES[G.n]=0; restartLevel(); },false,20);
  button(G.n+1<LEVELS.length?t('next'):'🏁 '+t('next'),590,480,200,52,nextLevel,true,22);
}
function skipLevel(){ logAttempt('пропуск'); nextLevel(); }
function drawFail(){
  const nb=G.burrows.length, lines=[];
  if(nb) lines.push(G.reach?t('failReach').replace('%1',G.reach).replace('%2',nb):t('failReach0'));
  if(G.near!==null && G.near<1.55) lines.push(t('failNear').replace('%',Math.max(0.1,G.near).toFixed(1)));
  if(!lines.length) lines.push(t('failText'));
  if(HINT[G.n]) lines.push(t('hintText'));
  const canHint=!HINT[G.n] && TRIES[G.n]>=2 && G.lv.solution, canSkip=TRIES[G.n]>=3 && G.n+1<LEVELS.length, h=150+lines.length*26+((canHint||canSkip)?70:0);
  ctx.fillStyle='rgba(10,8,15,.45)'; ctx.fillRect(0,CONFIG.HUD_H,CONFIG.W,CONFIG.H-CONFIG.HUD_H);
  panel(220,150,520,h,'#ff9a3c');
  text(G.timeout?t('failTime'):t('failTitle'),480,198,30,'#e8e6f0','center','900');
  lines.forEach((s,i)=>text(s,480,236+i*26,18,i===0&&nb?'#ffd166':'#cfcbe0','center','normal'));
  text(isTouch?t('tapAgainT'):t('tapAgain'),480,250+lines.length*26+Math.sin(now*5)*2,20,'#9fe8b0','center','900');
  const by=150+h-48;
  if(canHint&&canSkip){ button(t('hintBtn'),360,by,200,52,useHint,false,20); button(t('skipBtn'),600,by,200,52,skipLevel,false,20); }
  else if(canHint) button(t('hintBtn'),480,by,220,52,useHint,false,20);
  else if(canSkip) button(t('skipBtn'),480,by,220,52,skipLevel,false,20);
}
function drawFinal(){
  dim(); panel(30,64,900,556);
  text(t('allDone'),480,112,32,'#e8e6f0','center','900');
  const total=RESULTS.reduce((s,r)=>s+(r?r.stars:0),0);
  text(`${t('stars')}: ${total} / ${LEVELS.length*3}`,480,148,21,'#ffd166');
  const rows=Math.ceil(LEVELS.length/3);
  const rh=Math.min(32,378/rows), fs=rh<26?12.5:14;
  LEVELS.forEach((lv,i)=>{ const r=RESULTS[i], c=Math.floor(i/rows), x=52+c*294, y=176+(i-c*rows)*rh;
    text(`${i+1}. ${L(lv.name)}`,x,y,fs,WORLDS[Math.floor(i/5)].c,'left');
    text(r?`${r.used}/${r.par}${r.hint?' 💡':''}`:'—',x+212,y,fs-1,'#8f86a8','center','normal');
    for(let s=0;s<3;s++) drawStar(x+238+s*13,y-4,rh<26?4.5:6,r&&s<r.stars); });
  button(t('restart'),480,584,280,50,startGame,true,22);
}
function drawHelp(){
  dim(); panel(14,52,932,580);
  text(t('help'),480,92,30,'#e8e6f0','center','900');
  const lines=t('helpLines');
  if(helpPage===0){
    drawSteps(110);
    text(t('goal'),480,352,19,'#ffd166');
    lines.slice(0,5).forEach((s,i)=>text(s,480,384+i*26,16,'#cfcbe0','center','normal'));
    button(t('more'),480,582,260,48,()=>{ helpPage=1; },true,22);
  } else {
    const per=6, from=5+(helpPage-1)*per, last=from+per>=lines.length;
    lines.slice(from,from+per).forEach((s,i)=>wrapLines(s,840,17,'normal').forEach((ln,k)=>text(ln,480,150+i*66+k*23,17,k?'#a79fba':'#e8e6f0','center','normal')));
    if(last) button(t('got'),480,582,240,48,()=>{ mode=helpReturn; },true,22);
    else button(t('more'),480,582,260,48,()=>{ helpPage++; },true,22);
  }
}

function render(){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  uiButtons=[];
  ctx.fillStyle='#17131f'; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  if(mode==='start'||((mode==='help'||mode==='levels')&&!G)||(mode==='levels'&&levelsReturn==='start')) drawStart();
  else drawWorld();
  if(mode==='intro') drawIntro();
  if(mode==='done') drawDone();
  if(mode==='fail') drawFail();
  if(mode==='final') drawFinal();
  if(mode==='levels'){ uiButtons=[]; drawLevels(); }
  if(mode==='help'){ uiButtons=[]; drawHelp(); }
  drawTopBar();
  if(mode==='start'&&!G) cv.style.cursor=mouseOverButton()?'pointer':'default';
}

/* ---------- цикл ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000)||0); last=ts;
  if(!portraitPause()) update(dt);         // телефон в портрете: игра на паузе, палки не горят
  render(); syncSide(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// для автотестов в headless-браузере
window.STK={ get G(){return G;}, set G(v){G=v;}, get mode(){return mode;}, set mode(v){mode=v;}, get quiet(){return QUIET;}, set quiet(v){QUIET=v;},
  loadLevel, goLevel, update, render, tapWheel, canJam, fits, blockers, swapHand, handSize, nextStick, setSel(i){ G.sel=i; }, isCalm, segBase, segGoal, holeErr, holeErr2, tolOf, LEVELS, LEVEL_LIB, ORDER, WORLDS, CONFIG, TRIES, HINT };
</script>
