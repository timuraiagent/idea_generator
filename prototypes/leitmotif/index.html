/* ---------- звук (WebAudio, без файлов) ---------- */
let AC=null, master=null, noiseBuf=null, muted=lsGet('leit.muted',false);
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination); }
  catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur,vol,freq,q){
  if(!AC||muted) return;
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5|0,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t0=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  g.gain.setValueAtTime(Math.max(0.0002,vol),t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur+0.03);
}

    switch(kind%6){
      case 0: tone(140,0.16,'sine',v*1.6,48); break;
      case 1: noise(0.07,v*1.3,1800,0.9); break;
      case 2: tone(260,0.12,'triangle',v,150); break;
      case 3: tone(880,0.06,'sine',v*0.7); break;
      case 4: tone(196,0.14,'triangle',v,110); break;
      case 5: noise(0.04,v,6500,1.5); break;
    }
  },
};

/* ---------- состояние ---------- */
let mode='start', G=null, now=0, helpReturn='play';
let RESULTS=[];                         // по уровням: {knocks, par, stars, chain, tries, hint}
let BEST=lsGet('leit.best',[]);
const TRIES=[], HINT=[];                // попытки и подсказка — в пределах сессии
const keys={up:false,down:false,left:false,right:false};
const mouse={x:-99,y:-99,inside:false};
let uiButtons=[];

function loadLevel(n){
  const lv=LEVELS[n];
  TRIES[n]=(TRIES[n]||0)+1;
  G = {
    n, lv, time:0, knocks:0, claps:0, drowned:0, chain:[], wave:0, open:false, openK:0, hold:0, done:false, failT:0,
    hero:{x:lv.hero[0], y:lv.hero[1], tx:null, ty:null, chase:-1, cd:0, deaf:0, clapT:0, lookX:0, lookY:-1, walk:0, moving:false},
    drummers: lv.drummers.map((d,i)=>({ ...d, i, clock:(d.ph||0)*d.T, x:d.a[0], y:d.a[1], stun:0, lastWave:-1,
      hitT:0, alt:false, color:DCOLORS[i%DCOLORS.length], pattern:d.pat||'x...x...', kind:i })),
    cages:[], lamps:LAMPS.map(()=>({t:0, flash:0, off:0})),
    sparks:[], fx:[], notes:[], glow:{}, toast:null, hl:null, lastMiss:-99, drownToasts:0, lastDeaf:-99,
    beatClock:0, step:0,
  };
  for(const d of G.drummers){
    if(d.caged) G.cages.push({x:d.a[0]-CONFIG.CAGE_W/2, y:d.a[1]-CONFIG.CAGE_H/2, w:CONFIG.CAGE_W, h:CONFIG.CAGE_H, d:d.i});
    const p=routePos(d); d.x=p.x; d.y=p.y;
  }
}
function goLevel(n){ loadLevel(n); mode='intro'; }
function startGame(){ RESULTS=[]; goLevel(0); }
function restartLevel(){ loadLevel(G.n); mode='play'; }
function nextLevel(){ if(G.n+1<LEVELS.length) goLevel(G.n+1); else mode='final'; }
function openHelp(){ helpReturn=mode; mode='help'; }
function useHint(){ HINT[G.n]=true; restartLevel(); }

/* маршрут-петля барабанщика: туда-сюда с периодом T; сбитый стоит — его фаза сдвигается */
function routePos(d){
  const p=(((d.clock/d.T)%1)+1)%1;
  const tri=p<0.5?p*2:2-p*2, cosu=(1-Math.cos(p*TAU))/2, u=0.7*tri+0.3*cosu;
  let x=d.a[0]+(d.b[0]-d.a[0])*u, y=d.a[1]+(d.b[1]-d.a[1])*u;
  if(d.a[0]===d.b[0]&&d.a[1]===d.b[1]) x+=Math.sin(p*TAU)*(d.caged?10:14);
  return {x,y};
}
function linkPos(k){ // куда ведёт ниточка
  if(typeof k==='string'){ const l=LAMPS[lampOf(k)]; return {x:l.x, y:l.y+18}; }
  const d=G.drummers[k]; return {x:d.x, y:d.y-4};
}
function linkColor(k){ return typeof k==='string' ? LAMPS[lampOf(k)].color : STRING_DRUM; }
function bez(A,B,s){ // ниточка провисает вниз
  const len=Math.hypot(B.x-A.x,B.y-A.y), C={x:(A.x+B.x)/2, y:(A.y+B.y)/2+18+len*0.08};
  const u=1-s; return {x:u*u*A.x+2*u*s*C.x+s*s*B.x, y:u*u*A.y+2*u*s*C.y+s*s*B.y, C};
}
function cascadeTree(i){ // что зажжёт / погасит сбой барабанщика i (для подсветки)
  const strings=new Set(), lamps=new Set(), offs=new Set(), seen=new Set([i]); const q=[[i,0]];
  while(q.length){
    const [j,dep]=q.shift(); if(dep>=CONFIG.CASCADE_MAX) continue;
    for(const k of G.drummers[j].links){
      strings.add(j+'>'+k);
      if(typeof k==='string') (isOff(k)?offs:lamps).add(lampOf(k));
      else if(!seen.has(k)){ seen.add(k); q.push([k,dep+1]); }
    }
  }
  return {strings,lamps,offs};
}
const onBeat = d => d.stun<=0 && d.pattern[G.step]==='x';   // сейчас он бьёт в барабан
const budgetLeft = () => G.lv.budget ? G.lv.budget-G.knocks : Infinity;

/* ---------- действия ---------- */
function doClap(d){
  const h=G.hero; if(h.cd>0) return false;
  h.clapT=0.35; G.claps++;
  SFX.clap();
  G.fx.push({type:'ring', x:h.x, y:h.y, r:14, vr:260, life:0.4, max:0.4, color:'#ffffff'});
  if(G.lv.drown && onBeat(d)){                  // хлопок в удар тонет в шуме
    h.cd=CONFIG.DEAF_CD; h.deaf=CONFIG.DEAF_CD; G.drowned++;
    SFX.drown();
    G.fx.push({type:'txt', x:d.x, y:d.y-62, s:t('tum')+'!', color:BEATC, size:26, life:0.9, max:0.9});
    G.fx.push({type:'ring', x:d.x, y:d.y+12, r:16, vr:200, life:0.5, max:0.5, color:BEATC});
    if(G.drownToasts<3){ G.drownToasts++; toast(t('toastDrown'),BEATC,2.8); }
    return true;
  }
  h.cd=CONFIG.CLAP_CD;
  if(d.stun>0){ toast(t('toastStunned'),'#c3a6ff',1.6); return true; }       // сбитый не играет — перебивать нечего
  if(budgetLeft()<=0){ toast(t('toastBudget'),'#ff9d9d'); return true; }
  G.fx.push({type:'txt', x:(h.x+d.x)/2, y:Math.min(h.y,d.y)-40, s:t('clap'), color:'#ffffff', size:22, life:0.9, max:0.9});
  G.knocks++; G.chain.push(d.i+1);
  G.wave++;
  stunDrummer(d, G.wave, 0);
  return true;
}
function stunDrummer(d,wave,depth){
  d.stun=CONFIG.STUN_TIME;
  SFX.stumble(depth===0?1:0.6);
  G.fx.push({type:'ring', x:d.x, y:d.y-4, r:18, vr:180, life:0.5, max:0.5, color:depth===0?'#ffffff':STRING_DRUM});
  if(d.lastWave===wave) return;             // одна передача на волну
  d.lastWave=wave;
  if(depth>=CONFIG.CASCADE_MAX) return;
  for(const k of d.links) G.sparks.push({from:d.i, to:k, s:0, wave, depth:depth+1});
}
function arrive(sp){
  G.glow[sp.from+'>'+sp.to]=0.7;
  if(typeof sp.to==='string'){ if(isOff(sp.to)) lampOff(lampOf(sp.to)); else lightLamp(lampOf(sp.to)); }
  else stunDrummer(G.drummers[sp.to], sp.wave, sp.depth);
}
function lightLamp(i){
  if(G.open) return;
  const l=G.lamps[i]; l.t=CONFIG.LAMP_TIME; l.flash=0.5;
  SFX.lamp(i);
}
function lampOff(i){
  if(G.open) return;
  const l=G.lamps[i]; const was=l.t>0; l.t=0; l.off=0.8;
  SFX.off();
  for(let k=0;k<10;k++) G.fx.push({type:'smoke', x:LAMPS[i].x+(Math.random()-0.5)*16, y:LAMPS[i].y, vx:(Math.random()-0.5)*30, vy:-30-Math.random()*30, life:0.9, max:0.9});
  if(was && !G.lv.budget) toast(t('toastMiss'),'#ff9d9d',2.5);
}
function openDoor(){
  G.open=true; SFX.open(); toast(t('toastOpen'),'#ffd166',3.5);
  for(let k=0;k<60;k++){
    const a=Math.random()*TAU, v=120+Math.random()*260;
    G.fx.push({type:'conf', x:480+(Math.random()-0.5)*120, y:110, vx:Math.cos(a)*v, vy:Math.sin(a)*v*0.6+60,
               color:[...LAMPS.map(l=>l.color),'#ffffff'][k%4], life:1.6, max:1.6, rot:Math.random()*TAU});
  }
}
function starsFor(){
  if(G.lv.part2){ if(HINT[G.n]) return 1; const tr=TRIES[G.n]; return tr<=1?3:(tr<=3?2:1); }
  const par=G.lv.par; return G.knocks<=par?3:(G.knocks<=par+1?2:1);
}
function logAttempt(result){
  console.log('[leitmotif] уровень', G.n+1, result, JSON.stringify({knocks:G.knocks, claps:G.claps, drowned:G.drowned,
    par:G.lv.par||G.lv.budget, tries:TRIES[G.n], hint:!!HINT[G.n], chain:G.chain.join('→'), time:+G.time.toFixed(1)}));
}
function completeLevel(){
  G.done=true; mode='done'; G.doneT=0;
  G.stars=starsFor();
  RESULTS[G.n]={knocks:G.knocks, par:G.lv.par||G.lv.budget, stars:G.stars, chain:G.chain.join('→'), tries:TRIES[G.n], hint:!!HINT[G.n], drowned:G.drowned};
  BEST[G.n]=Math.max(BEST[G.n]||0, G.stars); lsSet('leit.best',BEST);
  SFX.done(); logAttempt('победа');
}
function failLevel(){ mode='fail'; G.doneT=0; SFX.fail(); logAttempt('неудача'); }
function toast(s,color,dur){ G.toast={s, color:color||'#e8e6f0', t:dur||2.6, max:dur||2.6}; }
function clapNearest(){
  let best=null, bd=1e9;
  for(const d of G.drummers){ if(d.caged) continue; const dd=dist(d,G.hero); if(dd<=CONFIG.REACH&&dd<bd){bd=dd;best=d;} }
  if(!best){ toast(t('toastReach')); return; }
  if(G.hero.cd>0){ deafToast(); return; }
  doClap(best);
}
function deafToast(){ if(G.hero.deaf>0 && G.time-G.lastDeaf>1.5){ G.lastDeaf=G.time; toast(t('toastDeaf'),BEATC,1.2); } }
function drummerAt(p,r){
  let best=null, bd=r;
  for(const d of G.drummers){ const dd=Math.hypot(p.x-d.x,p.y-(d.y-4)); if(dd<bd){bd=dd;best=d;} }
  return best;
}
function cageAt(p){ return G.cages.find(c=>p.x>c.x&&p.x<c.x+c.w&&p.y>c.y&&p.y<c.y+c.h)||null; }
function cagedClick(d){ toast(t('toastCage'),'#c3a6ff'); G.hl={to:d.i, t:1.8}; }

/* ---------- движение героя ---------- */
function blocked(x,y){
  const R=CONFIG.HERO_R, r=CONFIG.ROOM, D=CONFIG.DOOR;
  if(x<r.x0+R||x>r.x1-R||y>r.y1-R) return true;
  if(y<r.y0+R && !(G.open && x>D.gap0+R && x<D.gap1-R && y>D.top+80)) return true;
  for(const c of G.cages) if(x>c.x-R&&x<c.x+c.w+R&&y>c.y-R&&y<c.y+c.h+R) return true;
  return false;
}
function segRect(ax,ay,bx,by,c,pad){ // Лианг–Барски: отрезок задевает расширенный прямоугольник?
  const x0=c.x-pad, y0=c.y-pad, x1=c.x+c.w+pad, y1=c.y+c.h+pad, dx=bx-ax, dy=by-ay;
  const p=[-dx,dx,-dy,dy], q=[ax-x0,x1-ax,ay-y0,y1-ay]; let t0=0,t1=1;
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return false; }
    else{ const r=q[i]/p[i]; if(p[i]<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } }
  }
  return true;
}
function waypoint(h,goal){ // обход клетки через ближайший угол
  const R=CONFIG.HERO_R;
  for(const c of G.cages){
    if(!segRect(h.x,h.y,goal.x,goal.y,c,R-1)) continue;
    const m=R+7, corners=[[c.x-m,c.y-m],[c.x+c.w+m,c.y-m],[c.x-m,c.y+c.h+m],[c.x+c.w+m,c.y+c.h+m]];
    let best=null, bs=1e9;
    for(const [cx,cy] of corners){
      if(Math.hypot(cx-h.x,cy-h.y)<3) continue;
      if(segRect(h.x,h.y,cx,cy,c,R-1)) continue;
      if(blocked(cx,cy)) continue;
      const s=Math.hypot(cx-h.x,cy-h.y)+Math.hypot(goal.x-cx,goal.y-cy);
      if(s<bs){bs=s;best={x:cx,y:cy};}
    }
    if(best) return best;
  }
  return goal;
}
function updateHero(dt){
  const h=G.hero;
  h.cd=Math.max(0,h.cd-dt); h.deaf=Math.max(0,h.deaf-dt); h.clapT=Math.max(0,h.clapT-dt);
  const ix=(keys.right?1:0)-(keys.left?1:0), iy=(keys.down?1:0)-(keys.up?1:0);
  let vx=0, vy=0, maxStep=Infinity;
  if(ix||iy){ h.tx=null; h.chase=-1; const l=Math.hypot(ix,iy); vx=ix/l; vy=iy/l; }
  else{
    let goal=null;
    if(h.chase>=0){
      const d=G.drummers[h.chase];
      if(dist(h,d)<=CONFIG.REACH-4){ h.lookX=Math.sign(d.x-h.x); if(h.cd<=0){ doClap(d); h.chase=-1; } } // ждём кулдаун, клик не теряется
      else goal={x:d.x, y:d.y};
    } else if(h.tx!==null){
      goal={x:h.tx, y:h.ty};
      if(Math.hypot(goal.x-h.x,goal.y-h.y)<3){ h.tx=null; goal=null; }
    }
    if(goal){
      const wp=waypoint(h,goal), dx=wp.x-h.x, dy=wp.y-h.y, l=Math.hypot(dx,dy);
      if(l>0.5){ vx=dx/l; vy=dy/l; maxStep=l; }
    }
  }
  if(vx||vy){
    const sp=Math.min(CONFIG.HERO_SPEED*dt, maxStep), ox=h.x, oy=h.y;
    if(!blocked(h.x+vx*sp,h.y)) h.x+=vx*sp;
    if(!blocked(h.x,h.y+vy*sp)) h.y+=vy*sp;
    h.lookX=vx; h.lookY=vy; h.moving=Math.hypot(h.x-ox,h.y-oy)>0.01; h.walk+=dt;
    if(!h.moving && h.tx!==null && h.chase<0){ h.tx=null; } // упёрся — стоп
  } else h.moving=false;
  if(G.open && h.y<CONFIG.ROOM.y0-6) completeLevel();
}

/* ---------- главный апдейт ---------- */
function update(dt){
  now+=dt;
  if(!G) return;
  updateFx(dt);
  if(mode==='done'||mode==='fail') G.doneT+=dt;
  if(mode!=='play') return;
  G.time+=dt;
  updateHero(dt);
  if(mode!=='play') return;

  for(const d of G.drummers){
    if(d.stun>0) d.stun=Math.max(0,d.stun-dt); else d.clock+=dt;
    const p=routePos(d); d.x=p.x; d.y=p.y;
    d.hitT=Math.max(0,d.hitT-dt);
  }
  // ритм: у каждого барабанщика своя партия на общей сетке, сбитый молчит
  G.beatClock+=dt;
  const step=Math.floor(G.beatClock/CONFIG.STEP)%8;
  if(step!==G.step){
    G.step=step;
    for(const d of G.drummers) if(d.stun<=0 && d.pattern[step]==='x'){
      d.hitT=CONFIG.STEP*0.9; d.alt=!d.alt;
      if(Math.random()<0.6) G.notes.push({x:d.x+(d.alt?22:-22), y:d.y-30, vx:(Math.random()-0.5)*20, vy:-40, life:1, color:d.color, ch:Math.random()<0.5?'♪':'♫'});
      const v=0.11*clamp(1-(dist(d,G.hero)-140)/360,0,1);
      if(v>0.004) SFX.beat(d.kind,v);
    }
  }
  for(const sp of G.sparks){ sp.s+=dt/CONFIG.SPARK_TIME; if(sp.s>=1&&!sp.done){ sp.done=true; arrive(sp); } }
  G.sparks=G.sparks.filter(sp=>!sp.done);
  for(const k in G.glow){ G.glow[k]-=dt; if(G.glow[k]<=0) delete G.glow[k]; }
  if(G.hl){ G.hl.t-=dt; if(G.hl.t<=0) G.hl=null; }

  if(!G.open){
    for(const l of G.lamps){
      if(l.t>0){ l.t-=dt; if(l.t<=0){ l.t=0;
        if(!G.lv.budget && G.time-G.lastMiss>4){ G.lastMiss=G.time; toast(t('toastMiss'),'#ff9d9d',3); SFX.miss(); } } }
    }
    const allLit=G.lamps.every(l=>l.t>0);
    G.hold=allLit?G.hold+dt:0;                 // все три должны погореть вместе HOLD секунд
    if(G.hold>=CONFIG.HOLD) openDoor();
    // часть 2: сбивать больше нельзя и ничего уже не изменится → неудача
    if(!G.open && G.lv.budget && G.knocks>=G.lv.budget && G.sparks.length===0 && !allLit){
      G.failT+=dt; if(G.failT>0.8) failLevel();
    } else G.failT=0;
  } else G.openK=Math.min(1,G.openK+dt*1.5);
  for(const l of G.lamps){ l.flash=Math.max(0,l.flash-dt); l.off=Math.max(0,l.off-dt); }
}
function updateFx(dt){
  for(const e of G.fx){
    e.life-=dt;
    if(e.type==='ring') e.r+=e.vr*dt;
    if(e.type==='txt') e.y-=30*dt;
    if(e.type==='conf'){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=380*dt; e.rot+=6*dt; }
    if(e.type==='smoke'){ e.x+=e.vx*dt; e.y+=e.vy*dt; }
  }
  G.fx=G.fx.filter(e=>e.life>0);
  for(const n of G.notes){ n.life-=dt*1.1; n.x+=n.vx*dt; n.y+=n.vy*dt; }
  G.notes=G.notes.filter(n=>n.life>0);
  if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; }
}

/* ---------- ввод ---------- */
function toWorld(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*CONFIG.W/r.width, y:(e.clientY-r.top)*CONFIG.H/r.height}; }
function toggleLang(){ LANG=LANG==='ru'?'en':'ru'; try{ localStorage.setItem('leit.lang',LANG); }catch(e){} document.documentElement.lang=LANG; }
function toggleMute(){ muted=!muted; lsSet('leit.muted',muted); }

cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit();
  const p=toWorld(e), touchy=e.pointerType!=='mouse';
  mouse.x=p.x; mouse.y=p.y;
  for(let i=uiButtons.length-1;i>=0;i--){ const b=uiButtons[i]; if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){ b.act(); return; } }
  if(mode==='start'){ startGame(); return; }
  if(mode==='intro'){ mode='play'; return; }
  if(mode==='help'){ mode=helpReturn; return; }
  if(mode!=='play') return;
  const d=drummerAt(p, touchy?46:32);
  if(d){
    if(touchy){ G.press={d, t0:now}; return; }   // тач: короткий тап — действие, удержание — подсветка цепочки
    drummerTap(d); return;
  }
  const c=cageAt(p); if(c){ cagedClick(G.drummers[c.d]); return; }
  if(p.y<CONFIG.ROOM.y0){
    if(Math.abs(p.x-CONFIG.DOOR.cx)<90){
      if(G.open){ G.hero.tx=CONFIG.DOOR.cx; G.hero.ty=CONFIG.ROOM.y0-30; G.hero.chase=-1; }
      else toast(t('toastLocked'),'#ffd166');
    }
    return;
  }
  G.hero.tx=p.x; G.hero.ty=p.y; G.hero.chase=-1;
});
function drummerTap(d){
  if(d.caged){ cagedClick(d); return; }
  const h=G.hero;
  if(dist(h,d)<=CONFIG.REACH){ if(h.cd>0) deafToast(); else doClap(d); h.chase=-1; h.tx=null; }  // рядом — хлопок сейчас (момент выбираешь ты)
  else { h.chase=d.i; h.tx=null; }                                                              // далеко — подбежать и хлопнуть
}
const PRESS_PREVIEW=0.3;
cv.addEventListener('pointerup',()=>{
  if(!G||!G.press) return;
  const pr=G.press; G.press=null;
  if(mode==='play' && now-pr.t0<PRESS_PREVIEW) drummerTap(pr.d);
});
cv.addEventListener('pointercancel',()=>{ if(G) G.press=null; });
cv.addEventListener('pointermove',e=>{ const p=toWorld(e); mouse.x=p.x; mouse.y=p.y; mouse.inside=e.pointerType==='mouse'; });
cv.addEventListener('pointerleave',()=>{ mouse.inside=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());

const KEYMAP={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
addEventListener('keydown',e=>{
  audioInit();
  const k=e.code;
  if(KEYMAP[k]){ keys[KEYMAP[k]]=true; e.preventDefault(); }
  if(k==='Space') e.preventDefault();
  if(e.repeat) return;
  if(k==='KeyL') toggleLang();
  if(k==='KeyM') toggleMute();
  const ok=(k==='Space'||k==='Enter');
  if(mode==='start'){ if(ok) startGame(); else if(k==='KeyH') openHelp(); }
  else if(mode==='intro'){ if(ok) mode='play'; }
  else if(mode==='help'){ if(ok||k==='KeyH'||k==='Escape') mode=helpReturn; }
  else if(mode==='done'){ if(ok||k==='KeyN') nextLevel(); else if(k==='KeyR') restartLevel(); }
  else if(mode==='fail'){ if(ok||k==='KeyR') restartLevel(); }
  else if(mode==='final'){ if(ok) startGame(); }
  else if(mode==='play'){
    if(k==='Space') clapNearest();
    if(k==='KeyR') restartLevel();
    if(k==='KeyH'||k==='Slash') openHelp();
  }
});

/* ---------- примитивы рисования ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function text(s,x,y,size,color,align,weight){ ctx.font=`${weight||'bold'} ${size}px ${FONT}`; ctx.fillStyle=color; ctx.textAlign=align||'center'; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); }
function wrapLines(str,maxW,size,weight){
  ctx.font=`${weight||'bold'} ${size}px ${FONT}`;
  const words=str.split(' '), lines=[]; let cur='';
  for(const w of words){ const test=cur?cur+' '+w:w; if(ctx.measureText(test).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=test; }
  if(cur) lines.push(cur); return lines;
}
function starShape(x,y,r){ ctx.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rad=k%2?r*0.45:r; ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad); } ctx.closePath(); }
function drawStar(x,y,r,on){ starShape(x,y,r); ctx.fillStyle=on?'#ffd166':'#2b2140'; ctx.fill(); ctx.strokeStyle=on?'#b8862a':'#4f4068'; ctx.lineWidth=2; ctx.stroke(); }
function drawCross(x,y,r,color,w){ ctx.strokeStyle=color; ctx.lineWidth=w||3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x-r,y-r); ctx.lineTo(x+r,y+r); ctx.moveTo(x+r,y-r); ctx.lineTo(x-r,y+r); ctx.stroke(); ctx.lineCap='butt'; }

function drawLamp(x,y,color,st){
  ctx.fillStyle='#6d6480'; ctx.fillRect(x-7,y+14,14,8);
  let lit=st.lit;
  if(lit && !st.open && st.left<1.3 && Math.floor(now*8)%2===0) lit=false; // мигает перед тем как погаснуть
  if(st.preview){ ctx.strokeStyle=color; ctx.lineWidth=3; ctx.setLineDash([5,4]); circ(x,y,26+2*Math.sin(now*8)); ctx.stroke(); ctx.setLineDash([]); }
  if(lit){
    ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=30; ctx.fillStyle=color; circ(x,y,17); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.7)'; circ(x-5,y-5,5); ctx.fill();
  } else {
    ctx.fillStyle=hexA(color,0.16); circ(x,y,17); ctx.fill();
    ctx.strokeStyle=hexA(color,0.6); ctx.lineWidth=2; ctx.stroke();
  }
  if(st.lit && !st.open){ // кольцо-таймер: сколько ещё гореть
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(x,y,24,-Math.PI/2,-Math.PI/2+TAU*clamp(st.frac,0,1)); ctx.stroke();
  }
  if(st.flash>0){ ctx.strokeStyle=hexA(color,st.flash*1.6); ctx.lineWidth=3; circ(x,y,24+(0.5-st.flash)*50); ctx.stroke(); }
  if(st.previewOff||st.off>0) drawCross(x,y,11,st.previewOff?'#ffffff':`rgba(255,255,255,${st.off})`,4);
}
function drawDoor(cx,top,openK,lampStates,k,hold){
  ctx.save(); ctx.translate(cx,top); if(k) ctx.scale(k,k);
  ctx.fillStyle='#4a3b60'; ctx.fillRect(-78,0,16,140); ctx.fillRect(62,0,16,140);

  } else { ctx.fillStyle='#120e19'; ctx.fillRect(-62,66,124,74); }
  const lw=62*(1-openK);
  if(lw>0.5){
    ctx.fillStyle='#7a5536'; ctx.fillRect(-62,66,lw,74); ctx.fillRect(62-lw,66,lw,74);
    ctx.strokeStyle='#5e4029'; ctx.lineWidth=2;
    for(let x=-62+14;x<-62+lw;x+=14){ ctx.beginPath(); ctx.moveTo(x,68); ctx.lineTo(x,138); ctx.stroke(); }

    ctx.fillStyle='#ffd166'; rr(-12,93,24,19,4); ctx.fill();
    ctx.fillStyle='#3a2d22'; circ(0,101,3); ctx.fill(); ctx.fillRect(-1.5,101,3,6);
    if(hold>0){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,100,24,-Math.PI/2,-Math.PI/2+TAU*clamp(hold,0,1)); ctx.stroke(); }
  }
  ctx.fillStyle='#33284a'; rr(-82,0,164,66,10); ctx.fill(); ctx.strokeStyle='#5a4a78'; ctx.lineWidth=2; ctx.stroke();
  LAMPS.forEach((l,i)=>drawLamp(l.x-480,34,l.color,lampStates[i]));

function drawStrip(x,y,pattern,step,big,scaffold){ // песенка: 8 тактов над головой
  const n=8, cw=big?10:7, gap=2, w=n*cw+(n-1)*gap, x0=x-w/2, yy=y-(big?66:60);
  ctx.fillStyle='rgba(13,10,18,.55)'; rr(x0-4,yy-4,w+8,cw+8,4); ctx.fill();
  for(let i=0;i<n;i++){
    const on=pattern[i]==='x', cur=i===step;
    ctx.fillStyle = on ? (cur?'#ffffff':BEATC) : (cur?'#5ee07a':'rgba(255,255,255,.14)');
    const hh=cur?cw+4:cw; rr(x0+i*(cw+gap), yy-(cur?2:0), cw, hh, 2); ctx.fill();
  }
  if(scaffold){ const on=pattern[step]==='x'; text(on?t('tum'):t('now'), x, yy-8, big?16:13, on?BEATC:'#5ee07a', 'center', '900'); }
}
function drawDrummer(x,y,o){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,27,22,7,0,0,TAU); ctx.fill();
  if(o.hitting && !o.stun){ ctx.fillStyle=hexA(BEATC,0.22); circ(0,14,30); ctx.fill(); }
  if(o.ring){ ctx.strokeStyle=o.ring; ctx.lineWidth=3; circ(0,0,36+3*Math.sin(now*7)); ctx.stroke(); }
  ctx.fillStyle=o.color; circ(0,-4,19); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.28)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#3a3050'; rr(-11,-39,22,16,3); ctx.fill();
  ctx.fillStyle='#ffd166'; ctx.fillRect(-11,-28,22,3);
  ctx.fillStyle=o.color; circ(0,-42,4.5); ctx.fill();
  if(o.stun){
    ctx.strokeStyle='#2a2238'; ctx.lineWidth=2.2;
    for(const ex of [-7,7]){ ctx.beginPath(); ctx.moveTo(ex-3.5,-11.5); ctx.lineTo(ex+3.5,-4.5); ctx.moveTo(ex+3.5,-11.5); ctx.lineTo(ex-3.5,-4.5); ctx.stroke(); }
    ctx.fillStyle='#2a2238'; ctx.beginPath(); ctx.ellipse(0,4,3.5,4.5,0,0,TAU); ctx.fill();
  } else {
    ctx.fillStyle='#fff'; for(const ex of [-7,7]){ ctx.beginPath(); ctx.ellipse(ex,-8,4.6,5.4,0,0,TAU); ctx.fill(); }
    ctx.fillStyle='#2a2238'; for(const ex of [-7,7]){ circ(ex+(o.lookX||0)*1.6,-7,2.4); ctx.fill(); }
    ctx.strokeStyle='#2a2238'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,1,5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }
  // барабан; на боку — что он делает напрямую: точка — зажигает, крестик — гасит
  ctx.fillStyle='#ece4d0'; rr(-17,9,34,15,4); ctx.fill();
  ctx.fillStyle='#fff8ea'; ctx.beginPath(); ctx.ellipse(0,9,17,5.5,0,0,TAU); ctx.fill(); ctx.strokeStyle='#8a7f9e'; ctx.lineWidth=1.5; ctx.stroke();
  const marks=[...(o.lamps||[]).map(c=>({c,off:false})),...(o.offs||[]).map(c=>({c,off:true}))];
  marks.forEach((m,k)=>{ const mx=(k-(marks.length-1)/2)*10; if(m.off) drawCross(mx,17,3.2,m.c,2.4); else { ctx.fillStyle=m.c; circ(mx,17,3.8); ctx.fill(); } });
  ctx.strokeStyle='#7a5230'; ctx.lineWidth=3; ctx.lineCap='round';
  if(o.stun){
    ctx.beginPath(); ctx.moveTo(-26,24); ctx.lineTo(-12,28); ctx.moveTo(14,30); ctx.lineTo(27,22); ctx.stroke();
  } else {
    for(const s of [-1,1]){ // палочки: поднята — снаружи вверху, удар — по барабану
      const active=(s<0)===!!o.alt, down=active&&o.hit>0, tx=down?s*8:s*25, ty=down?8:-6;
      ctx.beginPath(); ctx.moveTo(s*17,10); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.fillStyle='#7a5230'; circ(tx,ty,2.8); ctx.fill();
    }
  }
  ctx.lineCap='butt';
  if(o.stun){ // звёздочки и «?!»
    for(let k=0;k<3;k++){ const a=now*4+k*TAU/3; ctx.fillStyle='#ffd166'; starShape(Math.cos(a)*18,-48+Math.sin(a)*5,5); ctx.fill(); }
    ctx.fillStyle='#ffffff'; rr(14,-70,30,22,8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(18,-50); ctx.lineTo(14,-42); ctx.lineTo(25,-49); ctx.fill();
    text('?!',29,-53,16,'#8a2be2');
  }
  ctx.restore();
  if(!o.stun && o.pattern && o.showStrip) drawStrip(x,y,o.pattern,o.step,o.big,o.scaffold);
  if(o.hintN){ let xx=x, yy=y-(o.showStrip?96:70)+Math.sin(now*5)*3; if(yy<CONFIG.ROOM.y0+14){ xx=x+44; yy=y-30; } // не залезать на стену
    ctx.fillStyle='#b26bff'; circ(xx,yy,15); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); text(String(o.hintN),xx,yy+6,17,'#ffffff'); }
}
function drawHero(x,y,o){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,20,18,6,0,0,TAU); ctx.fill();
  ctx.translate(0,o.moving?Math.sin(o.walk*16)*1.6:0);
  ctx.fillStyle=o.deaf>0?'#8fc79a':'#5ee07a'; circ(0,-2,17); ctx.fill(); ctx.strokeStyle='#2f9a4b'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle='#2f9a4b'; ctx.beginPath(); ctx.arc(0,-4,17,Math.PI*1.1,Math.PI*1.9); ctx.closePath(); ctx.fill();
  const lx=clamp(o.lookX||0,-1,1)*2, ly=clamp(o.lookY||0,-1,1)*1.5;
  ctx.fillStyle='#fff'; for(const ex of [-6,6]){ ctx.beginPath(); ctx.ellipse(ex,-3,4.5,5.4,0,0,TAU); ctx.fill(); }
  ctx.fillStyle='#17131f'; for(const ex of [-6,6]){ circ(ex+lx,-2+ly,2.4); ctx.fill(); }
  if(o.deaf>0){ // уши заложило
    ctx.strokeStyle=hexA(BEATC,0.9); ctx.lineWidth=2.5;
    for(const s of [-1,1]) for(let k=0;k<2;k++){ ctx.beginPath(); ctx.arc(s*20,-2,5+k*6+Math.sin(now*20)*1.5,s<0?Math.PI*0.65:-Math.PI*0.35,s<0?Math.PI*1.35:Math.PI*0.35); ctx.stroke(); }
  }
  if(o.clap>0){
    const k=o.clap/0.35;
    ctx.fillStyle='#ffd9b0'; circ(-4,11,5.5); ctx.fill(); circ(4,11,5.5); ctx.fill();
    ctx.strokeStyle=`rgba(255,255,255,${k})`; ctx.lineWidth=2.5;
    for(let i=0;i<8;i++){ const a=i*TAU/8; ctx.beginPath(); ctx.moveTo(Math.cos(a)*14,11+Math.sin(a)*14); ctx.lineTo(Math.cos(a)*(24+(1-k)*10),11+Math.sin(a)*(24+(1-k)*10)); ctx.stroke(); }
  }
  ctx.restore();
}
function drawCage(c){
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(c.x,c.y,c.w,c.h);
  ctx.strokeStyle='#8a7f9e'; ctx.lineWidth=4; ctx.strokeRect(c.x,c.y,c.w,c.h);
  ctx.fillStyle='#b2a9c1';
  for(let x=c.x;x<=c.x+c.w+0.1;x+=c.w/6){ circ(x,c.y,4); ctx.fill(); circ(x,c.y+c.h,4); ctx.fill(); }
  for(let y=c.y+c.h/5;y<c.y+c.h-1;y+=c.h/5){ circ(c.x,y,4); ctx.fill(); circ(c.x+c.w,y,4); ctx.fill(); }
  ctx.save(); ctx.translate(c.x+c.w/2,c.y+c.h);
  ctx.strokeStyle='#ffd166'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,-2,6,Math.PI,0); ctx.stroke();
  ctx.fillStyle='#ffd166'; rr(-9,-3,18,14,3); ctx.fill();
  ctx.restore();
}
function drawString(A,B,color,hot,arrow,off){
  const C=bez(A,B,0.5).C;
  ctx.strokeStyle=hot?color:hexA(color,off?0.7:0.5); ctx.lineWidth=hot?4.5:(off?3:2.5);
  if(off) ctx.setLineDash([9,7]);
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(C.x,C.y,B.x,B.y); ctx.stroke();
  ctx.setLineDash([]);
  if(off){ // крестик посередине: эта ниточка ГАСИТ
    const p=bez(A,B,0.5); ctx.fillStyle='#17131f'; circ(p.x,p.y,10); ctx.fill(); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
    drawCross(p.x,p.y,4.5,color,2.6);
  }
  if(arrow){ // стрелка: куда бежит сбой
    const p=bez(A,B,0.55), q=bez(A,B,0.6), a=Math.atan2(q.y-p.y,q.x-p.x);
    ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(a); ctx.fillStyle=hot?color:hexA(color,0.8);
    ctx.beginPath(); ctx.moveTo(9,0); ctx.lineTo(-7,-7); ctx.lineTo(-7,7); ctx.closePath(); ctx.fill(); ctx.restore();
  }
}

/* ---------- рендер мира ---------- */
function lampStates(tree){
  return G.lamps.map((l,i)=>({ lit:G.open||l.t>0, open:G.open, frac:l.t/CONFIG.LAMP_TIME, left:l.t, flash:l.flash, off:l.off,
    preview:tree&&tree.lamps.has(i), previewOff:tree&&tree.offs.has(i) }));
}
function drawWorld(){
  const W=CONFIG.W, H=CONFIG.H, R=CONFIG.ROOM;
  ctx.fillStyle='#241c31'; ctx.fillRect(0,CONFIG.HUD_H,W,R.y0-CONFIG.HUD_H);
  ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=1;
  for(let y=CONFIG.HUD_H+24,row=0;y<R.y0;y+=24,row++){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    for(let x=(row%2)*30;x<W;x+=60){ ctx.beginPath(); ctx.moveTo(x,y-24); ctx.lineTo(x,y); ctx.stroke(); } }
  ctx.fillStyle='#1a1424'; ctx.fillRect(0,R.y0,W,H-R.y0);
  ctx.fillStyle='#1e1729';
  for(let y=R.y0;y<H;y+=48) for(let x=((y-R.y0)/48%2)*48;x<W;x+=96) ctx.fillRect(x,y,48,48);
  ctx.fillStyle='#120e19'; ctx.fillRect(0,R.y0-4,W,8); ctx.fillRect(0,R.y1+4,W,H-R.y1); ctx.fillRect(0,R.y0,R.x0-4,H); ctx.fillRect(R.x1+4,R.y0,W,H);

  // табличка-подсказка слева, счёт справа
  ctx.fillStyle='#2b2140'; rr(20,54,370,128,12); ctx.fill(); ctx.strokeStyle='#433759'; ctx.lineWidth=2; ctx.stroke();
  text(t('goal'),205,80,16,'#ffd166');
  const tip=wrapLines(L(G.lv.tip),344,17);
  tip.slice(0,3).forEach((s,i)=>text(s,205,108+i*24,17,'#e8e6f0'));
  ctx.fillStyle='#2b2140'; rr(570,54,370,128,12); ctx.fill(); ctx.strokeStyle='#433759'; ctx.lineWidth=2; ctx.stroke();
  if(G.lv.budget){
    text(t('budget')+':',755,88,19,'#e8e6f0');
    const n=G.lv.budget, left=budgetLeft();
    for(let i=0;i<n;i++){ const x=755+(i-(n-1)/2)*44, used=i>=left; ctx.globalAlpha=used?0.28:1; text('🥁',x,128,30,'#fff'); ctx.globalAlpha=1; if(used) drawCross(x,118,12,'#ff5d5d',4); }
    text(`${t('attempt')} ${TRIES[G.n]||1}`+(HINT[G.n]?' · 💡':''),755,166,15,'#8f86a8','center','normal');
  } else {
    text('👏 '+t('claps')+': '+G.knocks,755,96,26,'#e8e6f0');
    text(t('canDo')+' '+G.lv.par,755,124,17,'#8f86a8');
    const proj=G.knocks<=G.lv.par?3:(G.knocks<=G.lv.par+1?2:1);
    for(let i=0;i<3;i++) drawStar(715+i*40,157,13,i<proj);
  }

  // подсветка: что зажжёт / погасит барабанщик под мышью
  let hover=null;

  if(mode==='play'&&G.press&&now-G.press.t0>=PRESS_PREVIEW) hover=G.press.d;
  const tree=hover?cascadeTree(hover.i):null;

  drawDoor(CONFIG.DOOR.cx,CONFIG.DOOR.top,G.openK,lampStates(tree),1,G.hold/CONFIG.HOLD);
  for(const c of G.cages) drawCage(c);

  // ниточки
  const hotSpark=new Set(G.sparks.map(s=>s.from+'>'+s.to));
  for(const d of G.drummers){
    const A={x:d.x, y:d.y-4};
    for(const k of d.links){
      const key=d.i+'>'+k;
      const hot=hotSpark.has(key)||G.glow[key]>0||(tree&&tree.strings.has(key))||(G.hl&&G.hl.to===k);
      drawString(A,linkPos(k),linkColor(k),hot,typeof k!=='string',isOff(k));

  ctx.strokeStyle=inReach?'rgba(94,224,122,.6)':'rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);

  // барабанщики и герой — по глубине

    pattern:d.pattern, step:G.step, showStrip:G.lv.drown, big:inReach===d||hover===d, scaffold:G.lv.scaffold&&inReach===d,
    hintN:sol&&sol.includes(d.i)?sol.indexOf(d.i)+1:0,
    ring:(hover===d)?'#ffffff':(inReach===d?'rgba(94,224,122,.9)':(G.hero.chase===d.i?'rgba(255,255,255,.6)':null)) })}));
  ents.push({y:h.y, f:()=>drawHero(h.x,h.y,{lookX:h.lookX, lookY:h.lookY, clap:h.clapT, moving:h.moving, walk:h.walk, deaf:h.deaf})});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());

  // искры на ниточках
  for(const sp of G.sparks){
    const A={x:G.drummers[sp.from].x, y:G.drummers[sp.from].y-4}, B=linkPos(sp.to), col=linkColor(sp.to);
    for(let g=3;g>=0;g--){
      const p=bez(A,B,clamp(sp.s-g*0.05,0,1));
      ctx.fillStyle=g?hexA(col,0.25*(4-g)/4):col; circ(p.x,p.y,g?7-g:10); ctx.fill();
    }
    const p=bez(A,B,clamp(sp.s,0,1)); ctx.fillStyle=isOff(sp.to)?'#17131f':'#fff'; circ(p.x,p.y,4.5); ctx.fill();
  }
  for(const n of G.notes){ ctx.globalAlpha=clamp(n.life,0,1); text(n.ch,n.x,n.y,20,n.color); ctx.globalAlpha=1; }
  for(const e of G.fx){
    const a=clamp(e.life/e.max,0,1);
    if(e.type==='ring'){ ctx.strokeStyle=e.color; ctx.globalAlpha=a; ctx.lineWidth=3; circ(e.x,e.y,e.r); ctx.stroke(); ctx.globalAlpha=1; }
    if(e.type==='txt'){ ctx.globalAlpha=a; ctx.lineWidth=4; ctx.strokeStyle='#17131f'; ctx.font=`900 ${e.size}px ${FONT}`; ctx.textAlign='center'; ctx.strokeText(e.s,e.x,e.y); text(e.s,e.x,e.y,e.size,e.color,'center','900'); ctx.globalAlpha=1; }
    if(e.type==='conf'){ ctx.save(); ctx.globalAlpha=a; ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.fillStyle=e.color; ctx.fillRect(-4,-2.5,8,5); ctx.restore(); }
    if(e.type==='smoke'){ ctx.fillStyle=`rgba(180,170,200,${a*0.5})`; circ(e.x,e.y,5+(1-a)*8); ctx.fill(); }
  }

  // обучение на первом уровне: рука «кликни!»
  if(G.lv.hand && G.knocks===0 && mode==='play'){
    const d=G.drummers[0], b=Math.sin(now*6)*6;
    text('👆',d.x,d.y+82+b,40,'#fff');
    text(isTouch?t('tapHint'):t('clickHint'),d.x,d.y+118+b,22,'#ffd166');
  }
  // дверь открыта — стрелка от героя к двери
  if(G.open && mode==='play'){
    const tx=CONFIG.DOOR.cx, ty=CONFIG.ROOM.y0-20, a=Math.atan2(ty-h.y,tx-h.x), b=(Math.sin(now*7)+1)*5;
    ctx.save(); ctx.translate(h.x+Math.cos(a)*(42+b),h.y+Math.sin(a)*(42+b)); ctx.rotate(a);
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-6,-14); ctx.lineTo(-6,-6); ctx.lineTo(-18,-6); ctx.lineTo(-18,6); ctx.lineTo(-6,6); ctx.lineTo(-6,14); ctx.closePath(); ctx.fill();
    ctx.restore();
    text(t('goDoor'),CONFIG.DOOR.cx,CONFIG.ROOM.y0+30+Math.sin(now*5)*3,22,'#ffd166');
  }
  if(G.toast){
    const a=clamp(G.toast.t/0.3,0,1)*clamp((G.toast.max-G.toast.t)/0.15,0,1);
    ctx.globalAlpha=a; ctx.font=`bold 19px ${FONT}`; const w=ctx.measureText(G.toast.s).width+36;
    const ty=G.open?262:206;
    ctx.fillStyle='rgba(13,10,18,.9)'; rr(480-w/2,ty,w,38,19); ctx.fill();
    ctx.strokeStyle=G.toast.color; ctx.lineWidth=2; ctx.stroke();
    text(G.toast.s,480,ty+26,19,G.toast.color); ctx.globalAlpha=1;
  }
  if(mode==='play'){
    text(isTouch?t('controlsTouch'):t('controls'),30,CONFIG.ROOM.y1-8,13,'#5b5372','left','normal');
    if(!isTouch) text(t('hover'),CONFIG.ROOM.x1-8,CONFIG.ROOM.y1-8,13,'#5b5372','right','normal');
  }
  cv.style.cursor=(hover||mouseOverButton())?'pointer':'default';
}
function mouseOverButton(){ return uiButtons.some(b=>mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h); }

/* ---------- HUD, кнопки, оверлеи ---------- */
function button(label,cx,cy,w,h,act,primary,size){
  const x=cx-w/2, y=cy-h/2, hov=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  ctx.fillStyle=primary?(hov?'#c896ff':'#b26bff'):(hov?'#3a3050':'#2b2140'); rr(x,y,w,h,12); ctx.fill();
  if(!primary){ ctx.strokeStyle='#5b4d78'; ctx.lineWidth=2; ctx.stroke(); }
  text(label,cx,cy+(size||22)*0.36,size||22,primary?'#17131f':'#e8e6f0');
  uiButtons.push({x,y,w,h,act});
}
function levelDot(i,x,y,r,cur){ // кружок уровня: номер, цвет части, звёзды
  const lv=LEVELS[i], best=BEST[i]||0;
  ctx.fillStyle=cur?'#b26bff':(best?(lv.part2?'#c77b2c':'#3d3157'):'#241c31'); circ(x,y,r); ctx.fill();
  ctx.strokeStyle=lv.part2?'#ff9a3c':'#7a62a8'; ctx.lineWidth=2; ctx.stroke();
  text(String(i+1),x,y+r*0.38,r*1.05,'#e8e6f0');
  uiButtons.push({x:x-r,y:y-r,w:2*r,h:2*r,act:()=>goLevel(i)});
  return best;
}
function drawTopBar(){
  ctx.fillStyle='#0f0b16'; ctx.fillRect(0,0,CONFIG.W,CONFIG.HUD_H);
  if(G&&mode!=='start'){
    const s=`${G.n+1}/${LEVELS.length}`;
    text(s,16,29,16,'#8f86a8','left'); ctx.font=`bold 16px ${FONT}`;
    const w=ctx.measureText(s).width;
    text(L(G.lv.name),16+w+10,29,20,G.lv.part2?'#ffb066':'#e8e6f0','left');
    ctx.font=`bold 20px ${FONT}`; const w2=ctx.measureText(L(G.lv.name)).width;
    for(let i=0;i<LEVELS.length;i++){ const x=16+w+10+w2+20+i*19+(LEVELS[i].part2?8:0); levelDot(i,x,22,8,i===G.n); }
  } else text('idea_generator · '+(LANG==='ru'?'прототип механики':'mechanic prototype'),16,28,14,'#5b5372','left','normal');
  const bw=44, bh=34, y=5; let x=CONFIG.W-8-bw;
  const btns=[{l:'?', a:()=>{ if(mode==='help') mode=helpReturn; else openHelp(); }}, {l:muted?'🔇':'🔊', a:toggleMute}, {l:LANG==='ru'?'EN':'RU', a:toggleLang}];
  if(mode==='play') btns.splice(1,0,{l:'↺', a:restartLevel});
  for(const b of btns){ button(b.l,x+bw/2,y+bh/2,bw,bh,b.a,false,18); x-=bw+8; }
}
function dim(){ ctx.fillStyle='rgba(10,8,15,.66)'; ctx.fillRect(0,CONFIG.HUD_H,CONFIG.W,CONFIG.H-CONFIG.HUD_H); }
function panel(x,y,w,h,color){ ctx.fillStyle='#211a2e'; rr(x,y,w,h,18); ctx.fill(); ctx.strokeStyle=color||'#b26bff'; ctx.lineWidth=2; ctx.stroke(); }

function drawSteps(top){ // три картинки «как играть» (стартовый экран и помощь)
  const cxs=[170,480,790], tt=now;
  cxs.forEach((cx,i)=>{
    ctx.fillStyle='#1d1728'; rr(cx-142,top,284,212,14); ctx.fill(); ctx.strokeStyle='#2f2540'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#b26bff'; circ(cx-118,top+24,15); ctx.fill(); text(String(i+1),cx-118,top+31,18,'#17131f');
    if(i===0){
      const ph=(tt%1.4)/1.4, clap=ph<0.25?0.35*(1-ph/0.25):0;
      drawHero(cx-42,top+108,{lookX:1,lookY:0,clap});
      drawDrummer(cx+42,top+98,{color:DCOLORS[0],stun:ph<0.6&&ph>0.05,hit:0,alt:false,lamps:['#ff5d5d','#ffd166']});
      if(clap>0) text(t('clap'),cx,top+50,20,'#ffffff','center','900');
      text('👆',cx+70,top+150+Math.sin(tt*6)*4,30,'#fff');
    } else if(i===1){
      const st=Math.floor(tt/CONFIG.STEP)%8, pat='xxxx....', on=pat[st]==='x';
      drawDrummer(cx,top+120,{color:DCOLORS[2],stun:false,hit:on?1:0,alt:st%2===0,lamps:['#4fc3f7'],pattern:pat,step:st,showStrip:true,big:true,scaffold:true,hitting:on});
    } else {
      const ph=(tt%3.5)/3.5, openK=clamp((ph-0.62)/0.12,0,1), hold=clamp((ph-0.46)/0.16,0,1);
      drawDoor(cx,top+28,openK,LAMPS.map((l,j)=>({lit:ph>0.1+j*0.12,open:true,frac:1,left:9,flash:0})),0.95,openK>0?0:hold);
    }
    const cap=t('step'+(i+1));
    text(cap[0],cx,top+178,16,'#e8e6f0'); text(cap[1],cx,top+200,16,'#e8e6f0');
  });
}
function drawLevelRow(y){
  const n1=LEVELS.filter(l=>!l.part2).length, sp=38, gapP=26, total=(LEVELS.length-1)*sp+gapP, x0=480-total/2;
  text(t('part1'),x0+(n1-1)*sp/2,y-24,14,'#b2a9c1');
  text(t('part2'),x0+n1*sp+gapP+(LEVELS.length-n1-1)*sp/2,y-24,14,'#ffb066');
  LEVELS.forEach((lv,i)=>{
    const x=x0+i*sp+(lv.part2?gapP:0), best=levelDot(i,x,y,15,false);
    for(let s=0;s<3;s++){ ctx.fillStyle=s<best?'#ffd166':'#3a3050'; starShape(x-9+s*9,y+24,4.2); ctx.fill(); }
  });
}
function drawStart(){
  ctx.fillStyle='#17131f'; ctx.fillRect(0,CONFIG.HUD_H,CONFIG.W,CONFIG.H-CONFIG.HUD_H);
  ctx.save(); ctx.shadowColor='#b26bff'; ctx.shadowBlur=24; text(t('title'),480,108,58,'#e8e6f0','center','900'); ctx.restore();
  text(t('sub1'),480,146,18,'#cfcbe0','center','normal');
  text(t('sub2'),480,170,18,'#cfcbe0','center','normal');
  drawSteps(192);
  button(t('play'),480,446,280,58,startGame,true,28);
  drawLevelRow(536);
}
function drawIntro(){
  const p2=G.lv.part2;
  dim(); panel(160,236,640,300,p2?'#ff9a3c':null);
  text(`${t('level')} ${G.n+1}`+(p2?` · ${t('part2')}`:''),480,280,18,p2?'#ffb066':'#8f86a8');
  text(L(G.lv.name),480,326,42,'#e8e6f0','center','900');
  const tip=wrapLines(L(G.lv.tip),580,21);
  tip.slice(0,3).forEach((s,i)=>text(s,480,370+i*29,21,'#cfcbe0'));
  text(t('goal'),480,370+Math.min(3,tip.length)*29+6,17,'#ffd166');
  button(t('got'),480,500,240,52,()=>{ mode='play'; },true,24);
}
function drawDone(){
  dim(); panel(220,200,520,330);
  text(t('hooray'),480,252,32,'#e8e6f0','center','900');
  for(let i=0;i<3;i++){
    const k=clamp((G.doneT-0.15-i*0.2)/0.25,0,1), r=30*(i<G.stars?(k<1?0.6+0.6*k:1):1);
    drawStar(400+i*80,318,r,i<G.stars&&k>0);
  }
  let msg;
  if(G.lv.part2){
    text(`${t('claps')}: ${G.knocks} · ${t('attempt')} ${TRIES[G.n]}`,480,382,21,'#e8e6f0');
    msg=HINT[G.n]?t('withHint'):(TRIES[G.n]<=1?t('firstTry'):(TRIES[G.n]<=3?t('fewTries'):t('manyTries')));
  } else {
    text(`${t('claps')}: ${G.knocks} · ${t('canDo')} ${G.lv.par}`,480,382,21,'#e8e6f0');
    msg=G.stars===3?t('perfect'):(G.stars===2?t('good'):t('ok')+G.lv.par);
  }
  text(msg,480,414,17,G.stars===3?'#9fe8b0':'#ffd166','center','normal');
  button(t('again'),370,480,180,52,()=>{ TRIES[G.n]=0; restartLevel(); },false,20);
  button(G.n+1<LEVELS.length?t('next'):'🏁 '+t('next'),590,480,200,52,nextLevel,true,22);
}
function drawFail(){
  dim(); panel(220,210,520,300,'#ff9a3c');
  text(t('failTitle'),480,262,34,'#e8e6f0','center','900');
  wrapLines(t('failText'),440,19,'normal').forEach((s,i)=>text(s,480,306+i*26,19,'#cfcbe0','center','normal'));
  if(HINT[G.n]) text(t('hintText'),480,372,16,'#ffd166','center','normal');
  const canHint=!HINT[G.n] && TRIES[G.n]>=2 && G.lv.solution;
  if(canHint){ button(t('hintBtn'),360,446,190,52,useHint,false,20); button(t('again'),600,446,200,52,restartLevel,true,22); }
  else button(t('again'),480,446,240,52,restartLevel,true,22);
}
function drawFinal(){
  dim(); panel(120,64,720,560);
  text(t('allDone'),480,112,32,'#e8e6f0','center','900');
  const total=RESULTS.reduce((s,r)=>s+(r?r.stars:0),0);
  text(`${t('stars')}: ${total} / ${LEVELS.length*3}`,480,148,21,'#ffd166');
  const col=(i)=>i<7?0:1;
  LEVELS.forEach((lv,i)=>{
    const r=RESULTS[i], c=col(i), row=c?i-7:i, x=150+c*350, y=196+row*56;
    text(`${i+1}. ${L(lv.name)}`,x,y,17,lv.part2?'#ffb066':'#e8e6f0','left');
    const info=r?(lv.part2?`${t('attempt')} ${r.tries}${r.hint?' · 💡':''}`:`${r.knocks} (${t('min')} ${r.par})`):'—';
    text(info,x,y+22,14,'#8f86a8','left','normal');
    for(let s=0;s<3;s++) drawStar(x+250+s*24,y-6,9,r&&s<r.stars);
  });
  button(t('restart'),480,586,280,52,startGame,true,22);
}
function drawHelp(){
  dim(); panel(14,52,932,580);
  text(t('help'),480,92,30,'#e8e6f0','center','900');
  drawSteps(110);
  text(t('goal'),480,352,19,'#ffd166');
  t('helpLines').forEach((s,i)=>text(s,480,384+i*27,16,'#cfcbe0','center','normal'));
  text(isTouch?t('controlsTouch'):t('controls'),480,500,15,'#8f86a8','center','normal');
  if(!isTouch) text(t('hover'),480,522,15,'#8f86a8','center','normal');
  button(t('got'),480,580,240,50,()=>{ mode=helpReturn; },true,22);
}

function render(){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  uiButtons=[];
  ctx.fillStyle='#17131f'; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  if(mode==='start'||(mode==='help'&&!G)) drawStart();
  else drawWorld();
  if(mode==='intro') drawIntro();
  if(mode==='done') drawDone();
  if(mode==='fail') drawFail();
  if(mode==='final') drawFinal();
  if(mode==='help'){ uiButtons=[]; drawHelp(); }
  drawTopBar();
  if(mode==='start'&&!G) cv.style.cursor=mouseOverButton()?'pointer':'default';
}

/* ---------- цикл ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000)||0); last=ts;
  update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// для автотестов в headless-браузере
window.LEIT={ get G(){return G;}, get mode(){return mode;}, set mode(v){mode=v;}, loadLevel, goLevel, update, render, completeLevel, doClap, onBeat, LEVELS, CONFIG, TRIES, HINT, RESULTS:()=>RESULTS };
</script>
</body>
