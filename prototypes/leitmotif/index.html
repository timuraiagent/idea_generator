   Три лампочки горят СРАЗУ → дверь открыта.
   Вопрос прототипа: читают ли игроки ниточки (пара и порядок хлопков) —

/* ---------- утилиты ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v===null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ---------- холст под экран ---------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let SCALE=1;
function fit(){
  const dpr=Math.min(2, window.devicePixelRatio||1);
  const s=Math.min(innerWidth/CONFIG.W, innerHeight/CONFIG.H);
  cv.style.width=Math.floor(CONFIG.W*s)+'px'; cv.style.height=Math.floor(CONFIG.H*s)+'px';
  cv.width=Math.max(1,Math.floor(CONFIG.W*s*dpr)); cv.height=Math.max(1,Math.floor(CONFIG.H*s*dpr));
  SCALE=cv.width/CONFIG.W;
}
addEventListener('resize',fit); fit();

/* ---------- звук (WebAudio, без файлов) ---------- */
let AC=null, master=null, noiseBuf=null, muted=lsGet('leit.muted',false);
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination); }
  catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||muted) return;
  const t0=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur,vol,freq,q){
  if(!AC||muted) return;
  if(!noiseBuf){ noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5|0,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t0=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  g.gain.setValueAtTime(Math.max(0.0002,vol),t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0+dur+0.03);
}
const SFX = {
  clap(){ noise(0.12,0.9,1400,0.8); noise(0.06,0.5,2600,1.2); },
  stumble(v){ tone(330,0.28,'triangle',0.22*(v||1),110); },
  lamp(i){ tone(LAMPS[i].note,0.55,'sine',0.3); tone(LAMPS[i].note*2,0.3,'sine',0.07); },
  open(){ [523.25,659.25,783.99,1046.5].forEach((f,k)=>tone(f,0.7,'triangle',0.22,null,k*0.09)); },
  done(){ [783.99,1046.5,1318.5,1567.98].forEach((f,k)=>tone(f,0.45,'sine',0.22,null,k*0.11)); },
  miss(){ tone(392,0.25,'sine',0.12,330); },
  beat(kind,v){ // у каждого барабанщика своя «партия» — вместе получается песенка
    switch(kind%6){
      case 0: tone(140,0.16,'sine',v*1.6,48); break;
      case 1: noise(0.07,v*1.3,1800,0.9); break;
      case 2: tone(260,0.12,'triangle',v,150); break;
      case 3: tone(880,0.06,'sine',v*0.7); break;
      case 4: tone(196,0.14,'triangle',v,110); break;
      case 5: noise(0.04,v,6500,1.5); break;
    }
  },
};

/* ---------- состояние ---------- */
let mode='start', G=null, now=0, helpReturn='play';
let RESULTS=[]; // по уровням: {claps, par, stars, chain}
let BEST=lsGet('leit.best',[]);
const keys={up:false,down:false,left:false,right:false};
const mouse={x:-99,y:-99,inside:false};
let uiButtons=[];

function loadLevel(n){
  const lv=LEVELS[n];
  G = {
    n, lv, time:0, claps:0, chain:[], wave:0, open:false, openK:0, done:false,
    hero:{x:lv.hero[0], y:lv.hero[1], tx:null, ty:null, chase:-1, cd:0, clapT:0, lookX:0, lookY:-1, walk:0, moving:false},
    drummers: lv.drummers.map((d,i)=>({ ...d, i, clock:d.ph*d.T, x:d.a[0], y:d.a[1], stun:0, lastWave:-1,
      hitT:0, alt:false, color:DCOLORS[i%DCOLORS.length], pattern:PATTERNS[i%PATTERNS.length], kind:i })),
    cages:[], lamps:LAMPS.map(()=>({t:0, flash:0})),
    sparks:[], fx:[], notes:[], glow:{}, toast:null, hl:null, lastMiss:-99,
    beatClock:0, step:-1,
  };
  for(const d of G.drummers){
    if(d.caged) G.cages.push({x:d.a[0]-CONFIG.CAGE_W/2, y:d.a[1]-CONFIG.CAGE_H/2, w:CONFIG.CAGE_W, h:CONFIG.CAGE_H, d:d.i});
    const p=routePos(d); d.x=p.x; d.y=p.y;
  }
}
function startGame(){ RESULTS=[]; loadLevel(0); mode='intro'; }
function restartLevel(){ loadLevel(G.n); mode='play'; }
function nextLevel(){ if(G.n+1<LEVELS.length){ loadLevel(G.n+1); mode='intro'; } else mode='final'; }
function openHelp(){ helpReturn=mode; mode='help'; }

/* маршрут-петля барабанщика: туда-сюда с периодом T (это и есть его «лейтмотив») */
function routePos(d){
  const p=(((d.clock/d.T)%1)+1)%1;
  const tri=p<0.5?p*2:2-p*2, cosu=(1-Math.cos(p*TAU))/2, u=0.7*tri+0.3*cosu;
  let x=d.a[0]+(d.b[0]-d.a[0])*u, y=d.a[1]+(d.b[1]-d.a[1])*u;
  if(d.a[0]===d.b[0]&&d.a[1]===d.b[1]) x+=Math.sin(p*TAU)*(d.caged?10:14);
  return {x,y};
}
function linkPos(k){ // куда ведёт ниточка
  if(typeof k==='string'){ const l=LAMPS[LIDX[k]]; return {x:l.x, y:l.y+18}; }
  const d=G.drummers[k]; return {x:d.x, y:d.y-4};
}
function linkColor(k){ return typeof k==='string' ? LAMPS[LIDX[k]].color : STRING_DRUM; }
function bez(A,B,s){ // ниточка провисает вниз
  const len=Math.hypot(B.x-A.x,B.y-A.y), C={x:(A.x+B.x)/2, y:(A.y+B.y)/2+18+len*0.08};
  const u=1-s; return {x:u*u*A.x+2*u*s*C.x+s*s*B.x, y:u*u*A.y+2*u*s*C.y+s*s*B.y, C};
}
function cascadeTree(i){ // что зажжёт хлопок по барабанщику i (для подсветки)
  const strings=new Set(), lamps=new Set(), seen=new Set([i]); const q=[[i,0]];
  while(q.length){
    const [j,dep]=q.shift(); if(dep>=CONFIG.CASCADE_MAX) continue;
    for(const k of G.drummers[j].links){
      strings.add(j+'>'+k);
      if(typeof k==='string') lamps.add(LIDX[k]);
      else if(!seen.has(k)){ seen.add(k); q.push([k,dep+1]); }
    }
  }
  return {strings,lamps};
}

/* ---------- действия ---------- */
function doClap(d){
  const h=G.hero; if(h.cd>0) return;
  h.cd=CONFIG.CLAP_CD; h.clapT=0.35;
  G.claps++; G.chain.push(d.i+1); G.wave++;
  SFX.clap();
  G.fx.push({type:'ring', x:h.x, y:h.y, r:14, vr:260, life:0.4, max:0.4, color:'#ffffff'});
  G.fx.push({type:'txt', x:(h.x+d.x)/2, y:Math.min(h.y,d.y)-40, s:t('clap'), color:'#ffffff', size:22, life:0.9, max:0.9});
  stunDrummer(d, G.wave, 0);
}
function stunDrummer(d,wave,depth){
  d.stun=CONFIG.STUN_TIME;
  SFX.stumble(depth===0?1:0.6);
  G.fx.push({type:'ring', x:d.x, y:d.y-4, r:18, vr:180, life:0.5, max:0.5, color:depth===0?'#ffffff':STRING_DRUM});
  if(d.lastWave===wave) return;             // одна передача на волну
  d.lastWave=wave;
  if(depth>=CONFIG.CASCADE_MAX) return;
  for(const k of d.links) G.sparks.push({from:d.i, to:k, s:0, wave, depth:depth+1});
}
function arrive(sp){
  G.glow[sp.from+'>'+sp.to]=0.7;
  if(typeof sp.to==='string') lightLamp(LIDX[sp.to]);
  else stunDrummer(G.drummers[sp.to], sp.wave, sp.depth);
}
function lightLamp(i){
  if(G.open) return;
  const l=G.lamps[i]; l.t=CONFIG.LAMP_TIME; l.flash=0.5;
  SFX.lamp(i);
}
function openDoor(){
  G.open=true; SFX.open(); toast(t('toastOpen'),'#ffd166',3.5);
  for(let k=0;k<60;k++){
    const a=Math.random()*TAU, v=120+Math.random()*260;
    G.fx.push({type:'conf', x:480+(Math.random()-0.5)*120, y:110, vx:Math.cos(a)*v, vy:Math.sin(a)*v*0.6+60,
               color:[...LAMPS.map(l=>l.color),'#ffffff'][k%4], life:1.6, max:1.6, rot:Math.random()*TAU});
  }
}
function completeLevel(){
  G.done=true; mode='done'; G.doneT=0;
  const par=G.lv.par, stars=G.claps<=par?3:(G.claps<=par+1?2:1);
  G.stars=stars;
  RESULTS[G.n]={claps:G.claps, par, stars, chain:G.chain.join('→')};
  BEST[G.n]=Math.max(BEST[G.n]||0, stars); lsSet('leit.best',BEST);
  SFX.done();
  console.log('[leitmotif] уровень', G.n+1, JSON.stringify({claps:G.claps, par, stars, chain:G.chain.join('→'), time:+G.time.toFixed(1)}));
}
function toast(s,color,dur){ G.toast={s, color:color||'#e8e6f0', t:dur||2.6, max:dur||2.6}; }
function clapNearest(){
  let best=null, bd=1e9;
  for(const d of G.drummers){ if(d.caged) continue; const dd=dist(d,G.hero); if(dd<=CONFIG.REACH&&dd<bd){bd=dd;best=d;} }
  if(best) doClap(best); else toast(t('toastReach'));
}
function drummerAt(p,r){
  let best=null, bd=r;
  for(const d of G.drummers){ const dd=Math.hypot(p.x-d.x,p.y-(d.y-4)); if(dd<bd){bd=dd;best=d;} }
  return best;
}
function cageAt(p){ return G.cages.find(c=>p.x>c.x&&p.x<c.x+c.w&&p.y>c.y&&p.y<c.y+c.h)||null; }
function cagedClick(d){
  toast(t('toastCage'),'#c3a6ff');
  G.hl={to:d.i, t:1.8};
}

/* ---------- движение героя ---------- */
function blocked(x,y){
  const R=CONFIG.HERO_R, r=CONFIG.ROOM, D=CONFIG.DOOR;
  if(x<r.x0+R||x>r.x1-R||y>r.y1-R) return true;
  if(y<r.y0+R && !(G.open && x>D.gap0+R && x<D.gap1-R && y>D.top+80)) return true;
  for(const c of G.cages) if(x>c.x-R&&x<c.x+c.w+R&&y>c.y-R&&y<c.y+c.h+R) return true;
  return false;
}
function segRect(ax,ay,bx,by,c,pad){ // Лианг–Барски: отрезок задевает расширенный прямоугольник?
  const x0=c.x-pad, y0=c.y-pad, x1=c.x+c.w+pad, y1=c.y+c.h+pad, dx=bx-ax, dy=by-ay;
  const p=[-dx,dx,-dy,dy], q=[ax-x0,x1-ax,ay-y0,y1-ay]; let t0=0,t1=1;
  for(let i=0;i<4;i++){
    if(p[i]===0){ if(q[i]<0) return false; }
    else{ const r=q[i]/p[i]; if(p[i]<0){ if(r>t1) return false; if(r>t0) t0=r; } else { if(r<t0) return false; if(r<t1) t1=r; } }
  }
  return true;
}
function waypoint(h,goal){ // обход клетки через ближайший угол
  const R=CONFIG.HERO_R;
  for(const c of G.cages){
    if(!segRect(h.x,h.y,goal.x,goal.y,c,R-1)) continue;
    const m=R+7, corners=[[c.x-m,c.y-m],[c.x+c.w+m,c.y-m],[c.x-m,c.y+c.h+m],[c.x+c.w+m,c.y+c.h+m]];
    let best=null, bs=1e9;
    for(const [cx,cy] of corners){
      if(Math.hypot(cx-h.x,cy-h.y)<3) continue;
      if(segRect(h.x,h.y,cx,cy,c,R-1)) continue;
      const s=Math.hypot(cx-h.x,cy-h.y)+Math.hypot(goal.x-cx,goal.y-cy);
      if(s<bs){bs=s;best={x:cx,y:cy};}
    }
    if(best) return best;
  }
  return goal;
}
function updateHero(dt){
  const h=G.hero;
  h.cd=Math.max(0,h.cd-dt); h.clapT=Math.max(0,h.clapT-dt);
  const ix=(keys.right?1:0)-(keys.left?1:0), iy=(keys.down?1:0)-(keys.up?1:0);
  let vx=0, vy=0, maxStep=Infinity;
  if(ix||iy){ h.tx=null; h.chase=-1; const l=Math.hypot(ix,iy); vx=ix/l; vy=iy/l; }
  else{
    let goal=null;
    if(h.chase>=0){
      const d=G.drummers[h.chase];
      if(dist(h,d)<=CONFIG.REACH-4){ h.lookX=Math.sign(d.x-h.x); if(h.cd<=0){ doClap(d); h.chase=-1; } } // ждём кулдаун, клик не теряется
      else goal={x:d.x, y:d.y};
    } else if(h.tx!==null){
      goal={x:h.tx, y:h.ty};
      if(Math.hypot(goal.x-h.x,goal.y-h.y)<3){ h.tx=null; goal=null; }
    }
    if(goal){
      const wp=waypoint(h,goal), dx=wp.x-h.x, dy=wp.y-h.y, l=Math.hypot(dx,dy);
      if(l>0.5){ vx=dx/l; vy=dy/l; maxStep=l; }
    }
  }
  if(vx||vy){
    const sp=Math.min(CONFIG.HERO_SPEED*dt, maxStep), ox=h.x, oy=h.y;
    if(!blocked(h.x+vx*sp,h.y)) h.x+=vx*sp;
    if(!blocked(h.x,h.y+vy*sp)) h.y+=vy*sp;
    h.lookX=vx; h.lookY=vy; h.moving=Math.hypot(h.x-ox,h.y-oy)>0.01; h.walk+=dt;
    if(!h.moving && h.tx!==null && h.chase<0){ h.tx=null; } // упёрся — стоп
  } else h.moving=false;
  if(G.open && h.y<CONFIG.ROOM.y0-6) completeLevel();
}

/* ---------- главный апдейт ---------- */
function update(dt){
  now+=dt;
  if(!G) return;
  updateFx(dt);
  if(mode==='done') G.doneT+=dt;
  if(mode!=='play') return;
  G.time+=dt;
  updateHero(dt);
  if(mode!=='play') return;

  for(const d of G.drummers){
    if(d.stun>0) d.stun=Math.max(0,d.stun-dt); else d.clock+=dt;
    const p=routePos(d); d.x=p.x; d.y=p.y;
    d.hitT=Math.max(0,d.hitT-dt);
  }
  // ритм: у каждого барабанщика своя партия, сбитый молчит
  G.beatClock+=dt;
  const step=Math.floor(G.beatClock/CONFIG.STEP)%8;
  if(step!==G.step){
    G.step=step;
    for(const d of G.drummers) if(d.stun<=0 && d.pattern[step]==='x'){
      d.hitT=0.16; d.alt=!d.alt;
      if(Math.random()<0.7) G.notes.push({x:d.x+(d.alt?14:-14), y:d.y-30, vx:(Math.random()-0.5)*20, vy:-40, life:1, color:d.color, ch:Math.random()<0.5?'♪':'♫'});
      const v=0.11*clamp(1-(dist(d,G.hero)-140)/360,0,1);
      if(v>0.004) SFX.beat(d.kind,v);
    }
  }
  for(const sp of G.sparks){ sp.s+=dt/CONFIG.SPARK_TIME; if(sp.s>=1&&!sp.done){ sp.done=true; arrive(sp); } }
  G.sparks=G.sparks.filter(sp=>!sp.done);
  for(const k in G.glow){ G.glow[k]-=dt; if(G.glow[k]<=0) delete G.glow[k]; }
  if(G.hl){ G.hl.t-=dt; if(G.hl.t<=0) G.hl=null; }

  if(!G.open){
    for(const l of G.lamps){
      if(l.t>0){ l.t-=dt; if(l.t<=0){ l.t=0;
        if(G.time-G.lastMiss>4){ G.lastMiss=G.time; toast(t('toastMiss'),'#ff9d9d',3); SFX.miss(); } } }
    }
    if(G.lamps.every(l=>l.t>0)) openDoor();
  } else G.openK=Math.min(1,G.openK+dt*1.5);
  for(const l of G.lamps) l.flash=Math.max(0,l.flash-dt);
}
function updateFx(dt){
  for(const e of G.fx){
    e.life-=dt;
    if(e.type==='ring') e.r+=e.vr*dt;
    if(e.type==='txt') e.y-=30*dt;
    if(e.type==='conf'){ e.x+=e.vx*dt; e.y+=e.vy*dt; e.vy+=380*dt; e.rot+=6*dt; }
  }
  G.fx=G.fx.filter(e=>e.life>0);
  for(const n of G.notes){ n.life-=dt*1.1; n.x+=n.vx*dt; n.y+=n.vy*dt; }
  G.notes=G.notes.filter(n=>n.life>0);
  if(G.toast){ G.toast.t-=dt; if(G.toast.t<=0) G.toast=null; }
}

function toWorld(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*CONFIG.W/r.width, y:(e.clientY-r.top)*CONFIG.H/r.height}; }
function toggleLang(){ LANG=LANG==='ru'?'en':'ru'; try{ localStorage.setItem('leit.lang',LANG); }catch(e){} document.documentElement.lang=LANG; }

cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit();
  const p=toWorld(e), touchy=e.pointerType!=='mouse';
  mouse.x=p.x; mouse.y=p.y;
  for(let i=uiButtons.length-1;i>=0;i--){ const b=uiButtons[i]; if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){ b.act(); return; } }
  if(mode==='start'){ startGame(); return; }
  if(mode==='intro'){ mode='play'; return; }

  if(mode!=='play') return;

  if(d){ if(d.caged) cagedClick(d); else { G.hero.chase=d.i; G.hero.tx=null; } return; }
  const c=cageAt(p); if(c){ cagedClick(G.drummers[c.d]); return; }
  if(p.y<CONFIG.ROOM.y0){

      else toast(t('toastLocked'),'#ffd166');
    }
    return;
  }
  G.hero.tx=p.x; G.hero.ty=p.y; G.hero.chase=-1;
});

const KEYMAP={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
addEventListener('keydown',e=>{
  audioInit();
  const k=e.code;
  if(KEYMAP[k]){ keys[KEYMAP[k]]=true; e.preventDefault(); }
  if(k==='Space') e.preventDefault();
  if(e.repeat) return;
  if(k==='KeyL') toggleLang();
  if(k==='KeyM') toggleMute();
  const ok=(k==='Space'||k==='Enter');
  if(mode==='start'){ if(ok) startGame(); else if(k==='KeyH') openHelp(); }
  else if(mode==='intro'){ if(ok) mode='play'; }
  else if(mode==='help'){ if(ok||k==='KeyH'||k==='Escape') mode=helpReturn; }
  else if(mode==='done'){ if(ok||k==='KeyN') nextLevel(); else if(k==='KeyR') restartLevel(); }
  else if(mode==='final'){ if(ok) startGame(); }
  else if(mode==='play'){
    if(k==='Space') clapNearest();
    if(k==='KeyR') restartLevel();
    if(k==='KeyH'||k==='Slash') openHelp();
  }
});

/* ---------- примитивы рисования ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circ(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); }
function text(s,x,y,size,color,align,weight){ ctx.font=`${weight||'bold'} ${size}px ${FONT}`; ctx.fillStyle=color; ctx.textAlign=align||'center'; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); }
function wrapLines(str,maxW,size,weight){
  ctx.font=`${weight||'bold'} ${size}px ${FONT}`;
  const words=str.split(' '), lines=[]; let cur='';
  for(const w of words){ const test=cur?cur+' '+w:w; if(ctx.measureText(test).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=test; }
  if(cur) lines.push(cur); return lines;
}
function starShape(x,y,r){ ctx.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rad=k%2?r*0.45:r; ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad); } ctx.closePath(); }
function drawStar(x,y,r,on){ starShape(x,y,r); ctx.fillStyle=on?'#ffd166':'#2b2140'; ctx.fill(); ctx.strokeStyle=on?'#b8862a':'#4f4068'; ctx.lineWidth=2; ctx.stroke(); }

function drawLamp(x,y,color,st){
  ctx.fillStyle='#6d6480'; ctx.fillRect(x-7,y+14,14,8);
  let lit=st.lit;
  if(lit && !st.open && st.left<1.3 && Math.floor(now*8)%2===0) lit=false; // мигает перед тем как погаснуть
  if(st.preview){ ctx.strokeStyle=color; ctx.lineWidth=3; ctx.setLineDash([5,4]); circ(x,y,26+2*Math.sin(now*8)); ctx.stroke(); ctx.setLineDash([]); }
  if(lit){
    ctx.save(); ctx.shadowColor=color; ctx.shadowBlur=30; ctx.fillStyle=color; circ(x,y,17); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.7)'; circ(x-5,y-5,5); ctx.fill();
  } else {
    ctx.fillStyle=hexA(color,0.16); circ(x,y,17); ctx.fill();
    ctx.strokeStyle=hexA(color,0.6); ctx.lineWidth=2; ctx.stroke();
  }
  if(st.lit && !st.open){ // кольцо-таймер: сколько ещё гореть
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(x,y,24,-Math.PI/2,-Math.PI/2+TAU*clamp(st.frac,0,1)); ctx.stroke();
  }
  if(st.flash>0){ ctx.strokeStyle=hexA(color,st.flash*1.6); ctx.lineWidth=3; circ(x,y,24+(0.5-st.flash)*50); ctx.stroke(); }
}
function drawDoor(cx,top,openK,lampStates,k){
  ctx.save(); ctx.translate(cx,top); if(k) ctx.scale(k,k);
  ctx.fillStyle='#4a3b60'; ctx.fillRect(-78,0,16,140); ctx.fillRect(62,0,16,140);
  if(openK>0){
    const g=ctx.createLinearGradient(0,66,0,140);
    g.addColorStop(0,`rgba(255,243,196,${0.95*openK})`); g.addColorStop(1,`rgba(255,209,102,${0.55*openK})`);
    ctx.fillStyle='#120e19'; ctx.fillRect(-62,66,124,74); ctx.fillStyle=g; ctx.fillRect(-62,66,124,74);
  } else { ctx.fillStyle='#120e19'; ctx.fillRect(-62,66,124,74); }
  const lw=62*(1-openK);
  if(lw>0.5){
    ctx.fillStyle='#7a5536'; ctx.fillRect(-62,66,lw,74); ctx.fillRect(62-lw,66,lw,74);
    ctx.strokeStyle='#5e4029'; ctx.lineWidth=2;
    for(let x=-62+14;x<-62+lw;x+=14){ ctx.beginPath(); ctx.moveTo(x,68); ctx.lineTo(x,138); ctx.stroke(); }
    for(let x=62-14;x>62-lw;x-=14){ ctx.beginPath(); ctx.moveTo(x,68); ctx.lineTo(x,138); ctx.stroke(); }
  }
  if(openK<0.05){ // замок

    ctx.fillStyle='#ffd166'; rr(-12,93,24,19,4); ctx.fill();
    ctx.fillStyle='#3a2d22'; circ(0,101,3); ctx.fill(); ctx.fillRect(-1.5,101,3,6);
  }

  LAMPS.forEach((l,i)=>drawLamp(l.x-480,34,l.color,lampStates[i]));

function drawDrummer(x,y,o){

  (o.lamps||[]).forEach((c,k,arr)=>{ ctx.fillStyle=c; circ((k-(arr.length-1)/2)*10,17,3.8); ctx.fill(); });

function drawHero(x,y,o){

function drawCage(c){

}

function lampStates(preview){

}
function drawWorld(){
  const W=CONFIG.W, H=CONFIG.H, R=CONFIG.ROOM;
  ctx.fillStyle='#241c31'; ctx.fillRect(0,CONFIG.HUD_H,W,R.y0-CONFIG.HUD_H);
  ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=1;
  for(let y=CONFIG.HUD_H+24,row=0;y<R.y0;y+=24,row++){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    for(let x=(row%2)*30;x<W;x+=60){ ctx.beginPath(); ctx.moveTo(x,y-24); ctx.lineTo(x,y); ctx.stroke(); } }
  ctx.fillStyle='#1a1424'; ctx.fillRect(0,R.y0,W,H-R.y0);
  ctx.fillStyle='#1e1729';
  for(let y=R.y0;y<H;y+=48) for(let x=((y-R.y0)/48%2)*48;x<W;x+=96) ctx.fillRect(x,y,48,48);
  ctx.fillStyle='#120e19'; ctx.fillRect(0,R.y0-4,W,8); ctx.fillRect(0,R.y1+4,W,H-R.y1); ctx.fillRect(0,R.y0,R.x0-4,H); ctx.fillRect(R.x1+4,R.y0,W,H);

  // табличка-подсказка слева, счёт хлопков справа
  ctx.fillStyle='#2b2140'; rr(20,54,370,128,12); ctx.fill(); ctx.strokeStyle='#433759'; ctx.lineWidth=2; ctx.stroke();
  text(t('goal'),205,80,16,'#ffd166');
  const tip=wrapLines(L(G.lv.tip),340,18);
  tip.slice(0,3).forEach((s,i)=>text(s,205,110+i*25,18,'#e8e6f0'));
  ctx.fillStyle='#2b2140'; rr(570,54,370,128,12); ctx.fill(); ctx.strokeStyle='#433759'; ctx.lineWidth=2; ctx.stroke();
  text('👏 '+t('claps')+': '+G.claps,755,96,26,'#e8e6f0');
  text(t('canDo')+' '+G.lv.par,755,124,17,'#8f86a8');
  const proj=G.claps<=G.lv.par?3:(G.claps<=G.lv.par+1?2:1);
  for(let i=0;i<3;i++) drawStar(715+i*40,157,13,i<proj);

  // подсветка: что зажжёт барабанщик под мышью
  let hover=null;
  if(mode==='play'&&mouse.inside){ const d=drummerAt(mouse,32); if(d) hover=d; }
  const tree=hover?cascadeTree(hover.i):null;

  drawDoor(CONFIG.DOOR.cx,CONFIG.DOOR.top,G.openK,lampStates(tree&&tree.lamps));
  for(const c of G.cages) drawCage(c);

  // ниточки
  const hotSpark=new Set(G.sparks.map(s=>s.from+'>'+s.to));
  for(const d of G.drummers){
    const A={x:d.x, y:d.y-4};
    for(const k of d.links){
      const key=d.i+'>'+k;
      const hot=hotSpark.has(key)||G.glow[key]>0||(tree&&tree.strings.has(key))||(G.hl&&G.hl.to===k);
      drawString(A,linkPos(k),linkColor(k),hot,typeof k!=='string');
    }
  }

  // досягаемость героя
  const h=G.hero;
  let inReach=null, bd=1e9;
  for(const d of G.drummers){ if(d.caged) continue; const dd=dist(d,h); if(dd<=CONFIG.REACH&&dd<bd){bd=dd;inReach=d;} }
  ctx.strokeStyle=inReach?'rgba(94,224,122,.6)':'rgba(255,255,255,.14)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
  circ(h.x,h.y,CONFIG.REACH); ctx.stroke(); ctx.setLineDash([]);

  // барабанщики и герой — по глубине
  const ents=G.drummers.map(d=>({y:d.y, f:()=>drawDrummer(d.x,d.y,{
    color:d.color, stun:d.stun>0, hit:d.hitT, alt:d.alt, lookX:Math.sign(h.x-d.x),
    lamps:d.links.filter(k=>typeof k==='string').map(k=>LAMPS[LIDX[k]].color),
    ring:(hover===d)?'#ffffff':(inReach===d?'rgba(94,224,122,.9)':(G.hero.chase===d.i?'rgba(255,255,255,.6)':null)) })}));
  ents.push({y:h.y, f:()=>drawHero(h.x,h.y,{lookX:h.lookX, lookY:h.lookY, clap:h.clapT, moving:h.moving, walk:h.walk})});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());

  // искры на ниточках
  for(const sp of G.sparks){
    const A={x:G.drummers[sp.from].x, y:G.drummers[sp.from].y-4}, B=linkPos(sp.to), col=linkColor(sp.to);
    for(let g=3;g>=0;g--){
      const p=bez(A,B,clamp(sp.s-g*0.05,0,1));
      ctx.fillStyle=g?hexA(col,0.25*(4-g)/4):col; circ(p.x,p.y,g?7-g:10); ctx.fill();
    }
    const p=bez(A,B,clamp(sp.s,0,1)); ctx.fillStyle='#fff'; circ(p.x,p.y,4.5); ctx.fill();
  }
  for(const n of G.notes){ ctx.globalAlpha=clamp(n.life,0,1); text(n.ch,n.x,n.y,20,n.color); ctx.globalAlpha=1; }
  for(const e of G.fx){
    const a=clamp(e.life/e.max,0,1);
    if(e.type==='ring'){ ctx.strokeStyle=e.color; ctx.globalAlpha=a; ctx.lineWidth=3; circ(e.x,e.y,e.r); ctx.stroke(); ctx.globalAlpha=1; }
    if(e.type==='txt'){ ctx.globalAlpha=a; ctx.lineWidth=4; ctx.strokeStyle='#17131f'; ctx.font=`900 ${e.size}px ${FONT}`; ctx.textAlign='center'; ctx.strokeText(e.s,e.x,e.y); text(e.s,e.x,e.y,e.size,e.color,'center','900'); ctx.globalAlpha=1; }
    if(e.type==='conf'){ ctx.save(); ctx.globalAlpha=a; ctx.translate(e.x,e.y); ctx.rotate(e.rot); ctx.fillStyle=e.color; ctx.fillRect(-4,-2.5,8,5); ctx.restore(); }
  }

  // обучение на первом уровне: рука «кликни!»
  if(G.lv.hand && G.claps===0 && mode==='play'){
    const d=G.drummers[0], b=Math.sin(now*6)*6;
    text('👆',d.x,d.y+82+b,40,'#fff');
    text(isTouch?t('tapHint'):t('clickHint'),d.x,d.y+118+b,22,'#ffd166');
  }
  // дверь открыта — стрелка от героя к двери
  if(G.open && mode==='play'){
    const tx=CONFIG.DOOR.cx, ty=CONFIG.ROOM.y0-20, a=Math.atan2(ty-h.y,tx-h.x), b=(Math.sin(now*7)+1)*5;
    ctx.save(); ctx.translate(h.x+Math.cos(a)*(42+b),h.y+Math.sin(a)*(42+b)); ctx.rotate(a);
    ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-6,-14); ctx.lineTo(-6,-6); ctx.lineTo(-18,-6); ctx.lineTo(-18,6); ctx.lineTo(-6,6); ctx.lineTo(-6,14); ctx.closePath(); ctx.fill();
    ctx.restore();
    text(t('goDoor'),CONFIG.DOOR.cx,CONFIG.ROOM.y0+30+Math.sin(now*5)*3,22,'#ffd166');
  }
  if(G.toast){
    const a=clamp(G.toast.t/0.3,0,1)*clamp((G.toast.max-G.toast.t)/0.15,0,1);
    ctx.globalAlpha=a; ctx.font=`bold 19px ${FONT}`; const w=ctx.measureText(G.toast.s).width+36;
    ctx.fillStyle='rgba(13,10,18,.88)'; rr(480-w/2,G.open?262:206,w,38,19); ctx.fill();
    ctx.strokeStyle=G.toast.color; ctx.lineWidth=2; ctx.stroke();
    text(G.toast.s,480,(G.open?262:206)+26,19,G.toast.color); ctx.globalAlpha=1;
  }
  if(mode==='play'){
    text(isTouch?t('controlsTouch'):t('controls'),30,CONFIG.ROOM.y1-8,13,'#5b5372','left','normal');
    if(!isTouch) text(t('hover'),CONFIG.ROOM.x1-8,CONFIG.ROOM.y1-8,13,'#5b5372','right','normal');
  }
  cv.style.cursor=(hover||mouseOverButton())?'pointer':'default';
}
function mouseOverButton(){ return uiButtons.some(b=>mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h); }

/* ---------- HUD, кнопки, оверлеи ---------- */
function button(label,cx,cy,w,h,act,primary,size){
  const x=cx-w/2, y=cy-h/2, hov=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  ctx.fillStyle=primary?(hov?'#c896ff':'#b26bff'):(hov?'#3a3050':'#2b2140'); rr(x,y,w,h,12); ctx.fill();
  if(!primary){ ctx.strokeStyle='#5b4d78'; ctx.lineWidth=2; ctx.stroke(); }
  text(label,cx,cy+(size||22)*0.36,size||22,primary?'#17131f':'#e8e6f0');
  uiButtons.push({x,y,w,h,act});
}
function drawTopBar(){
  ctx.fillStyle='#0f0b16'; ctx.fillRect(0,0,CONFIG.W,CONFIG.HUD_H);
  if(G&&mode!=='start'){
    const s=`${t('level')} ${G.n+1} ${t('of')} ${LEVELS.length}`;
    text(s,16,29,16,'#8f86a8','left'); ctx.font=`bold 16px ${FONT}`;
    const w=ctx.measureText(s).width;
    text(L(G.lv.name),16+w+12,29,20,'#e8e6f0','left');
    ctx.font=`bold 20px ${FONT}`; const w2=ctx.measureText(L(G.lv.name)).width;
    for(let i=0;i<LEVELS.length;i++){ const x=16+w+12+w2+22+i*18;
      ctx.fillStyle=i===G.n?'#b26bff':(RESULTS[i]?'#ffd166':'#2f2540'); circ(x,22,6); ctx.fill(); }
  } else text('idea_generator · '+(LANG==='ru'?'прототип механики':'mechanic prototype'),16,28,14,'#5b5372','left','normal');
  const bw=44, bh=34, y=5; let x=CONFIG.W-8-bw;
  const btns=[{l:'?', a:()=>{ if(mode==='help') mode=helpReturn; else openHelp(); }}, {l:muted?'🔇':'🔊', a:toggleMute}, {l:LANG==='ru'?'EN':'RU', a:toggleLang}];
  if(mode==='play') btns.splice(1,0,{l:'↺', a:restartLevel});
  for(const b of btns){ button(b.l,x+bw/2,y+bh/2,bw,bh,b.a,false,18); x-=bw+8; }
}
function dim(){ ctx.fillStyle='rgba(10,8,15,.66)'; ctx.fillRect(0,CONFIG.HUD_H,CONFIG.W,CONFIG.H-CONFIG.HUD_H); }
function panel(x,y,w,h){ ctx.fillStyle='#211a2e'; rr(x,y,w,h,18); ctx.fill(); ctx.strokeStyle='#b26bff'; ctx.lineWidth=2; ctx.stroke(); }

function drawSteps(top){ // три картинки «как играть» (стартовый экран и помощь)
  const cxs=[170,480,790], tt=now;
  cxs.forEach((cx,i)=>{
    ctx.fillStyle='#1d1728'; rr(cx-142,top,284,212,14); ctx.fill(); ctx.strokeStyle='#2f2540'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#b26bff'; circ(cx-118,top+24,15); ctx.fill(); text(String(i+1),cx-118,top+31,18,'#17131f');
    if(i===0){
      const ph=(tt%1.4)/1.4, clap=ph<0.25?0.35*(1-ph/0.25):0;
      drawHero(cx-42,top+108,{lookX:1,lookY:0,clap});
      drawDrummer(cx+42,top+98,{color:DCOLORS[0],stun:ph<0.6&&ph>0.05,hit:0,alt:false,lamps:['#ff5d5d','#ffd166']});
      if(clap>0) text(t('clap'),cx,top+50,20,'#ffffff','center','900');
      text('👆',cx+70,top+150+Math.sin(tt*6)*4,30,'#fff');
    } else if(i===1){
      const ph=(tt%2)/2, A={x:cx-70,y:top+118}, B={x:cx+76,y:top+70};
      const s=clamp(ph/0.5,0,1), lit=ph>0.5;
      drawString(A,B,'#ff5d5d',true,false);
      drawLamp(B.x,B.y-18,'#ff5d5d',{lit,open:false,frac:1-(ph-0.5)/0.5*0.5,left:9,flash:0});
      drawDrummer(A.x,A.y,{color:DCOLORS[1],stun:true,lamps:['#ff5d5d']});
      if(!lit){ const p=bez(A,B,s); ctx.fillStyle=hexA('#ff5d5d',0.5); circ(p.x,p.y,11); ctx.fill(); ctx.fillStyle='#fff'; circ(p.x,p.y,5); ctx.fill(); }
    } else {
      const ph=(tt%3.5)/3.5, openK=clamp((ph-0.5)/0.12,0,1); // лампочки по одной → дверь открылась
      drawDoor(cx,top+28,openK,LAMPS.map((l,j)=>({lit:ph>0.1+j*0.13,open:true,frac:1,left:9,flash:0})),0.95);
    }
    const cap=t('step'+(i+1));
    text(cap[0],cx,top+178,16,'#e8e6f0'); text(cap[1],cx,top+200,16,'#e8e6f0');
  });
}
function drawStart(){
  ctx.fillStyle='#17131f'; ctx.fillRect(0,CONFIG.HUD_H,CONFIG.W,CONFIG.H-CONFIG.HUD_H);
  ctx.save(); ctx.shadowColor='#b26bff'; ctx.shadowBlur=24; text(t('title'),480,118,62,'#e8e6f0','center','900'); ctx.restore();
  text(t('sub1'),480,160,19,'#cfcbe0','center','normal');
  text(t('sub2'),480,186,19,'#cfcbe0','center','normal');
  drawSteps(222);
  button(t('play'),480,522,300,68,startGame,true,30);
  text(LANG==='ru'?'6 коротких уровней · в каждом одна новая штука':'6 short levels · one new idea in each',480,584,15,'#8f86a8','center','normal');
}
function drawIntro(){
  dim(); panel(160,236,640,300);
  text(`${t('level')} ${G.n+1}`,480,280,18,'#8f86a8');
  text(L(G.lv.name),480,326,42,'#e8e6f0','center','900');
  const tip=wrapLines(L(G.lv.tip),580,22);
  tip.slice(0,3).forEach((s,i)=>text(s,480,372+i*30,22,'#cfcbe0'));
  text(t('goal'),480,372+Math.min(3,tip.length)*30+6,17,'#ffd166');
  button(t('got'),480,496,240,54,()=>{ mode='play'; },true,24);
}
function drawDone(){
  dim(); panel(220,200,520,330);
  text(t('hooray'),480,252,32,'#e8e6f0','center','900');
  for(let i=0;i<3;i++){
    const k=clamp((G.doneT-0.15-i*0.2)/0.25,0,1), r=30*(i<G.stars?(k<1?0.6+0.6*k:1):1);
    drawStar(400+i*80,318,r,i<G.stars&&k>0);
  }
  text(`${t('claps')}: ${G.claps} · ${t('canDo')} ${G.lv.par}`,480,382,21,'#e8e6f0');
  const msg=G.stars===3?t('perfect'):(G.stars===2?t('good'):t('ok')+G.lv.par);
  text(msg,480,414,17,G.stars===3?'#9fe8b0':'#ffd166','center','normal');
  button(t('again'),370,480,180,52,restartLevel,false,20);
  button(G.n+1<LEVELS.length?t('next'):'🏁 '+t('next'),590,480,200,52,nextLevel,true,22);
}
function drawFinal(){
  dim(); panel(200,70,560,540);
  text(t('allDone'),480,122,34,'#e8e6f0','center','900');
  const total=RESULTS.reduce((s,r)=>s+(r?r.stars:0),0);
  text(`${t('stars')}: ${total} / ${LEVELS.length*3}`,480,160,22,'#ffd166');
  text(t('lvlCol'),250,204,15,'#8f86a8','left'); text(t('clapCol'),560,204,15,'#8f86a8','center');
  LEVELS.forEach((lv,i)=>{
    const r=RESULTS[i], y=240+i*44;
    text(`${i+1}. ${L(lv.name)}`,250,y,19,'#e8e6f0','left');
    text(r?`${r.claps} (${t('min')} ${r.par})`:'—',560,y,18,'#cfcbe0');
    for(let s=0;s<3;s++) drawStar(650+s*28,y-7,10,r&&s<r.stars);
  });
  button(t('restart'),480,558,280,56,startGame,true,24);
}
function drawHelp(){
  dim(); panel(14,60,932,568);
  text(t('help'),480,104,32,'#e8e6f0','center','900');
  drawSteps(126);
  text(t('goal'),480,376,20,'#ffd166');
  text(isTouch?t('controlsTouch'):t('controls'),480,412,17,'#cfcbe0','center','normal');
  if(!isTouch) text(t('hover'),480,438,17,'#cfcbe0','center','normal');
  text(LANG==='ru'?'Барабанщик в клетке недосягаем — до него дойдёт только искра по ниточке.':'A caged drummer is out of reach — only a spark along a string gets to him.',480,470,17,'#cfcbe0','center','normal');
  text(LANG==='ru'?'Меньше хлопков — больше звёзд ★':'Fewer claps — more stars ★',480,500,17,'#cfcbe0','center','normal');
  button(t('got'),480,566,240,54,()=>{ mode=helpReturn; },true,24);
}

function render(){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  uiButtons=[];
  ctx.fillStyle='#17131f'; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  if(mode==='start'||(mode==='help'&&!G)){ drawStart(); }
  else drawWorld();
  if(mode==='intro') drawIntro();
  if(mode==='done') drawDone();
  if(mode==='final') drawFinal();
  if(mode==='help'){ if(!G){ uiButtons=[]; } drawHelp(); }
  drawTopBar();
  if(mode==='start'&&!G) cv.style.cursor=mouseOverButton()?'pointer':'default';
}

/* ---------- цикл ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000)||0); last=ts;
  update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// для автотестов в headless-браузере
window.LEIT={ get G(){return G;}, get mode(){return mode;}, set mode(v){mode=v;}, loadLevel, update, render, completeLevel, doClap, LEVELS, CONFIG, RESULTS:()=>RESULTS };
</script>
</body>
