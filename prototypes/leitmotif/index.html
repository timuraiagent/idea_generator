<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Лейтмотив — рождает ли фазовая сеть порядок ударов, или побеждает спам?</title>
<style>
  html,body{margin:0;padding:0;background:#0d0a12;height:100%;display:flex;align-items:center;justify-content:center;}
  canvas{border:1px solid #2a2338;border-radius:6px;max-width:100vw;height:auto;touch-action:none;}
  #tui{position:fixed;right:12px;bottom:12px;display:none;flex-direction:column;gap:10px;z-index:5;}
  #tui.show{display:flex;}
  #tui button{min-width:110px;padding:16px 18px;font-size:16px;border-radius:14px;background:rgba(178,107,255,.22);color:#e8e6f0;border:1px solid #b26bff;}
  #tui button.on{background:rgba(178,107,255,.55);}
</style>
</head>
<body>
<canvas id="cv" width="960" height="640"></canvas>
<div id="tui"></div>
<script>
'use strict';
/* ============================================================
   ЛЕЙТМОТИВ — прототип механики «перебить × лейтмотив» (v1)
   Вопрос прототипа: рождает ли видимая фазовая сеть решения про
   ПОРЯДОК и ПАРЫ ударов — или побеждает спам ударов по всем петлям?
   Спека: mechanics/leitmotif/spec.md. Ассеты: assets.svg (Codex).
   ============================================================ */

const CONFIG = {
  W: 960, H: 640,
  PLAYER_SPEED: 140, STRIKE_R: 70,
  PATROLS: [
    {id:'P1', label:'ОХРАНА-1', labelEn:'GUARD 1', ax:250, ay:320, route:{x:250, y0:180, y1:460}, T:10},
    {id:'P2', label:'ОХРАНА-2', labelEn:'GUARD 2', ax:450, ay:320, route:{x:450, y0:160, y1:480}, T:13},
    {id:'P3', label:'ОХРАНА-3', labelEn:'GUARD 3', ax:690, ay:320, route:{x0:615, x1:765, y:320}, T:11},
  ],
  GATES: [
    {id:'A', label:'ВОРОТА A', labelEn:'GATE A', x:140, T:14},
    {id:'B', label:'ВОРОТА B', labelEn:'GATE B', x:580, T:16},
    {id:'C', label:'ВОРОТА C', labelEn:'GATE C', x:800, T:12},
  ],
  GATE_GAP:{y0:260, y1:380}, OPEN_FRAC:[0.5, 0.33, 0.25],
  VISION: 100, ALARM_SEEN: 6,
  WIN_DUR:[5, 3, 1.8],
  BIT_FRAC: 0.25, TACT_FRAC: 0.125,
  DMIN: 0.2, DMAX: 0.35,
  CASCADE_DELAY: 0.4, CASCADE_DEPTH: 2, CASCADE_DECAY: 0.6,
  REPAIR_AFTER: 10, H_MAX: 2, PATROL_SPEEDUP: 0.85,
  ALARM_HIT: 10, ALARM_C1: 5, ALARM_C2: 3, ALARM_SYNC: -8,
  OVERLAP_NEED: 1.5,
  PARTY: 180,
};

const EDGES = [[0,3],[0,4],[1,4],[1,5],[2,5]];
const GATES_IDX = [3,4,5];

const SPRITES = { player:[0,0], patrol:[128,0], anchor_patrol:[256,0], anchor_gate:[384,0],
                  pulse:[0,128], gate_icon:[128,128], patrol_icon:[256,128] };

// ---------- утилиты ----------
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const wrapPhase=(p,T)=>((p%T)+T)%T;
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- состояние ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let mode='start', G=null; // mode: start | play | end

function newGame(){
  const loops=[];
  for(const p of CONFIG.PATROLS)
    loops.push({type:'patrol', id:p.id, label:p.label, labelEn:p.labelEn, ax:p.ax, ay:p.ay, route:p.route, T:p.T,
                phi:wrapPhase(rnd(-0.1,0.1)*p.T, p.T), h:0, jamT:0, repairIn:null});
  for(const g of CONFIG.GATES)
    loops.push({type:'gate', id:g.id, label:g.label, labelEn:g.labelEn, gx:g.x, ax:g.x, ay:225, T:g.T,
                phi:wrapPhase(rnd(-0.1,0.1)*g.T, g.T), h:0, jamT:0, repairIn:null});
  return {
    player:{x:70, y:320},
    loops, cascadeQ:[],
    alarm:0, peakAlarm:0,
    overlapT:0, unlocked:false,
    strikes:0, cascades:0, chain:[], unlockChain:'',
    t:CONFIG.PARTY_TIME, win:false,
    effects:[], lastBits:loops.map(()=>-1),
  };
}

// эффективный период: патруль жёстче = быстрее; ворота жёстче = меньше открытая доля
const Teff = l => l.type==='patrol' ? l.T*Math.pow(CONFIG.PATROL_SPEEDUP,l.h) : l.T;

// ---------- фаза/петли ----------
const patPos = l => {
  const T=Teff(l);
  const u = l.phi < T/2 ? l.phi/(T/2) : 2 - l.phi/(T/2);
  if(l.route.x!==undefined) return {x:l.route.x, y:l.route.y0 + u*(l.route.y1-l.route.y0)};
  return {x:l.route.x0 + u*(l.route.x1-l.route.x0), y:l.route.y};
};
const gateOpen = l => G.unlocked || l.jamT>0 || wrapPhase(l.phi,l.T) < l.T*CONFIG.OPEN_FRAC[l.h];
const nearestBitDist = l => {
  const T=Teff(l), b=T*CONFIG.BIT_FRAC, m=wrapPhase(l.phi,T)%b;
  return Math.min(m, b-m);
};

function disrupt(li, depth){
  const l=G.loops[li], T=Teff(l);
  l.jamT=CONFIG.WIN_DUR[Math.min(depth,2)];     // патруль: замер; ворота: заклинило открытыми
  if(depth===0){
    if(l.type==='gate'){ l.phi=0; }             // переанкор: цикл пойдёт от момента сбоя
    else{
      const b=T*CONFIG.BIT_FRAC, m=wrapPhase(l.phi,T)%b, d=Math.min(m,b-m);
      const sign=m>b/2?1:-1;
      const D=clamp(d, CONFIG.DMIN*T, CONFIG.DMAX*T);
      l.phi=wrapPhase(l.phi+sign*D, T);         // сдвиг фазы маршрута
    }
    G.strikes++; G.chain.push(l.label);
  } else G.cascades++;
  const gain=depth===0?CONFIG.ALARM_HIT:depth===1?CONFIG.ALARM_C1:CONFIG.ALARM_C2;
  G.alarm=clamp(G.alarm+gain,0,100);
  G.peakAlarm=Math.max(G.peakAlarm,G.alarm);
  G.alarmFx={v:'+'+gain,t:1.2,c:'#ff5d5d'};     // явная связь: удар → полоса тревоги
  l.repairIn=CONFIG.REPAIR_AFTER;
  ring(l.ax,l.ay, depth===0?'#b26bff':'#8a2be2');
  if(depth<CONFIG.CASCADE_DEPTH)
    for(const [from,to] of EDGES)
      if(from===li) G.cascadeQ.push({to, depth:depth+1, wait:CONFIG.CASCADE_DELAY});
}
function resync(l){ // подпевание: пересвод к сетке, тревога вниз, окно закрыто
  const T=Teff(l), b=T*CONFIG.BIT_FRAC;
  l.phi=wrapPhase(Math.round(wrapPhase(l.phi,T)/b)*b, T);
  l.jamT=0; l.repairIn=null;
  G.alarm=clamp(G.alarm+CONFIG.ALARM_SYNC,0,100);
  G.alarmFx={v:CONFIG.ALARM_SYNC+'',t:1.2,c:'#7ad0ff'};
  ring(l.ax,l.ay,'#7ad0ff');
}
function strike(l){
  const li=G.loops.indexOf(l);
  if(nearestBitDist(l)<=Teff(l)*CONFIG.TACT_FRAC){ // «в такт» — слабый: без сдвига и каскада
    l.jamT=CONFIG.WIN_DUR[0]/2; l.repairIn=CONFIG.REPAIR_AFTER;
    G.strikes++; G.alarm=clamp(G.alarm+CONFIG.ALARM_HIT,0,100); G.peakAlarm=Math.max(G.peakAlarm,G.alarm);
    ring(l.ax,l.ay,'#55506a'); return;
  }
  disrupt(li,0);
}

// ---------- эффекты/ввод ----------
function ring(x,y,color){ G.effects.push({type:'ring',x,y,r:22,color,life:.9}); }
function txt(x,y,s,color){ G.effects.push({type:'txt',x,y,s,color,life:1.4}); }
function anchorAt(p){ return G.loops.find(l=>Math.hypot(p.x-l.ax,p.y-l.ay)<CONFIG.STRIKE_R)||null; }

const keys={}; let mouse={x:0,y:0};
let tutPage=0, tutResume=false;
function openTutorial(resume){tutResume=resume;tutPage=0;mode='tut';}
function advanceTutorial(){
  tutPage++;
  if(tutPage>3){ if(tutResume&&G){mode='play';} else {G=newGame();mode='play';} }
}
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(mode==='start'){
    if(e.key==='Enter'||e.key===' '){G=newGame();mode='play';e.preventDefault();}
    else if(e.code==='KeyT')openTutorial(false);
  }
  else if(mode==='tut'){ if(e.key==='Enter'||e.key===' '){advanceTutorial();e.preventDefault();} }
  else if(mode==='end'&&e.code==='KeyR'){G=newGame();mode='play';}
  else if(mode==='play'){
    if(e.code==='KeyR')G=newGame();
    if(e.code==='KeyH')openTutorial(true);
  }
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),s=CONFIG.W/r.width;mouse.x=(e.clientX-r.left)*s;mouse.y=(e.clientY-r.top)*s;});
cv.addEventListener('mousedown',e=>{
  if(mode!=='play')return;
  const l=anchorAt(mouse);
  if(!l)return;
  if(e.button===0)strike(l);
  if(e.button===2)resync(l);
  e.preventDefault();
});
cv.addEventListener('contextmenu',e=>e.preventDefault());

// ---------- тач: джойстик слева, тап по анкеру = удар, кнопки справа ----------
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
let joy=null, resyncMode=false;
function tp(t){const r=cv.getBoundingClientRect(),s=CONFIG.W/r.width;return{x:(t.clientX-r.left)*s,y:(t.clientY-r.top)*s};}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=tp(t);
    if(mode==='start'){openTutorial(false);continue;}
    if(mode==='tut'){advanceTutorial();continue;}
    if(mode==='end')continue;
    if(p.x<CONFIG.W*0.45&&!joy){joy={id:t.identifier,ox:p.x,oy:p.y,dx:0,dy:0};continue;}
    const l=anchorAt(p);
    if(l)resyncMode?resync(l):strike(l);
  }
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!joy)return;
  for(const t of e.changedTouches)if(t.identifier===joy.id){
    const p=tp(t);let dx=p.x-joy.ox,dy=p.y-joy.oy;const l=Math.hypot(dx,dy);
    if(l>50){dx=dx/l*50;dy=dy/l*50;}
    joy.dx=dx/50;joy.dy=dy/50;
  }
},{passive:false});
cv.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)if(joy&&t.identifier===joy.id)joy=null;
},{passive:false});
function mkBtn(label,down,up,toggle){
  const b=document.createElement('button');b.textContent=label;
  b.addEventListener('touchstart',e=>{e.preventDefault();b.classList.add('on');down();},{passive:false});
  b.addEventListener('touchend',e=>{e.preventDefault();if(!toggle)b.classList.remove('on');if(up)up();},{passive:false});
  document.getElementById('tui').appendChild(b);return b;
}
if(isTouch){
  document.getElementById('tui').classList.add('show');
  const rb=mkBtn('Подпевать (режим)',()=>{resyncMode=!resyncMode;rb.classList.toggle('on',resyncMode);},null,true);
  mkBtn('Как играть',()=>openTutorial(true));
  mkBtn('Заново',()=>{G=newGame();mode='play';});
}

// ---------- главный апдейт ----------
let last=0;
function update(dt){
  if(mode!=='play')return;
  const P=G.player;
  G.t-=dt;
  if(G.t<=0){G.t=0;mode='end';G.win=false;return;}

  // игрок
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let iy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy){ix+=joy.dx;iy+=joy.dy;}
  if(ix||iy){
    const l=Math.hypot(ix,iy);
    tryMove(P, ix/l*CONFIG.PLAYER_SPEED*dt, iy/l*CONFIG.PLAYER_SPEED*dt);
  }
  if(G.unlocked&&P.x>920&&P.y>CONFIG.GATE_GAP.y0&&P.y<CONFIG.GATE_GAP.y1){mode='end';G.win=true;return;}

  // фазы текут; биты → пульсы
  G.loops.forEach((l,i)=>{
    l.phi=wrapPhase(l.phi+dt, Teff(l));
    const bi=Math.floor(wrapPhase(l.phi,Teff(l))/(Teff(l)*CONFIG.BIT_FRAC));
    if(bi!==G.lastBits[i]){G.lastBits[i]=bi;ring(l.ax,l.ay,'#e8e6f0');}
  });

  // каскадная очередь
  for(const q of G.cascadeQ){ q.wait-=dt; if(q.wait<=0&&!q.done){q.done=true;disrupt(q.to,q.depth);} }
  G.cascadeQ=G.cascadeQ.filter(q=>!q.done);

  // окна и самопочинка
  for(const l of G.loops){
    if(l.jamT>0)l.jamT-=dt;
    if(l.repairIn!==null){
      l.repairIn-=dt;
      if(l.repairIn<=0){
        const T=Teff(l), b=T*CONFIG.BIT_FRAC;
        l.phi=wrapPhase(Math.round(wrapPhase(l.phi,T)/b)*b, T);
        l.h=Math.min(CONFIG.H_MAX,l.h+1);
        l.phi=wrapPhase(l.phi, Teff(l)); // после смены h период изменился
        l.repairIn=null; l.jamT=0;
        ring(l.ax,l.ay,'#ffd166');
        txt(l.ax,l.ay-30,l.id+' жёстче','#ffd166');
      }
    }
  }

  // зрение патрулей → тревога
  let seen=false;
  for(const l of G.loops)if(l.type==='patrol'&&l.jamT<=0){
    const pos=patPos(l);
    if(dist(pos,P)<CONFIG.VISION&&sameRoom(pos.x,P.x))seen=true;
  }
  if(seen)G.alarm=clamp(G.alarm+CONFIG.ALARM_SEEN*dt,0,100);
  G.peakAlarm=Math.max(G.peakAlarm,G.alarm);

  // тревога 100 → полный пересвод
  if(G.alarm>=100){
    for(const l of G.loops){
      const T=Teff(l), b=T*CONFIG.BIT_FRAC;
      l.phi=wrapPhase(Math.round(wrapPhase(l.phi,T)/b)*b, T);
      l.jamT=0; l.h=Math.min(CONFIG.H_MAX,l.h+1); l.repairIn=null;
      l.phi=wrapPhase(l.phi, Teff(l));
    }
    G.cascadeQ.length=0; G.alarm=60;
    txt(CONFIG.W/2,200,'ПОЛНЫЙ ПЕРЕСВОД — все петли жёстче','#ff5d5d');
  }

  // перекрытие трёх ворот → разблокировка
  if(!G.unlocked){
    const allOpen=GATES_IDX.every(i=>G.loops[i].jamT>0);
    G.overlapT=allOpen?G.overlapT+dt:0;
    if(G.overlapT>=CONFIG.OVERLAP_NEED){
      G.unlocked=true;
      G.unlockChain=G.chain.slice(-5).join(' → ');
      txt(CONFIG.W/2,170,'ВЫХОД РАЗБЛОКИРОВАН — беги!','#7ad0ff');
    }
  }

  // эффекты
  for(const e of G.effects){e.life-=dt;if(e.type==='ring')e.r+=110*dt;}
  G.effects=G.effects.filter(e=>e.life>0);
  if(G.alarmFx){G.alarmFx.t-=dt;if(G.alarmFx.t<=0)G.alarmFx=null;}
}

function sameRoom(x1,x2){
  const r=x=>x<140?0:(x<580?1:(x<800?2:3));
  return r(x1)===r(x2);
}
function tryMove(P,dx,dy){
  P.x+=dx;
  for(const gi of GATES_IDX){
    const gx=G.loops[gi].gx, c1=P.x-dx, c2=P.x;
    if((c1<gx&&c2>=gx)||(c1>gx&&c2<=gx)){
      const inGap=P.y>CONFIG.GATE_GAP.y0&&P.y<CONFIG.GATE_GAP.y1;
      if(!(inGap&&gateOpen(G.loops[gi])))P.x=dx>0?gx-8:gx+8;
    }
  }
  P.x=clamp(P.x,10,CONFIG.W-10);
  P.y=clamp(P.y+dy,10,CONFIG.H-10);
}

// ---------- спрайты ----------
const sheet=new Image(); let sheetOK=false;
sheet.onload=()=>sheetOK=true; sheet.src='assets.svg';
function drawSprite(cell,x,y,angle,scale){
  scale=scale||0.42;
  ctx.save();ctx.translate(x,y);if(angle)ctx.rotate(angle);
  if(sheetOK)ctx.drawImage(sheet,cell[0],cell[1],128,128,-64*scale,-64*scale,128*scale,128*scale);
  else{ctx.fillStyle='#e8e6f0';ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fill();}
  ctx.restore();
}

// ---------- рендер ----------
function render(){
  ctx.fillStyle='#17131f'; ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  ctx.fillStyle='#221b2e';
  for(let x=30;x<CONFIG.W;x+=60)for(let y=90;y<CONFIG.H;y+=60)ctx.fillRect(x,y,2,2);
  if(mode==='tut'){renderTut();return;}
  if(!G){renderStart();return;}

  const gy0=CONFIG.GATE_GAP.y0, gy1=CONFIG.GATE_GAP.y1;

  // зоны
  ctx.fillStyle='#1b1626';ctx.fillRect(0,90,140,CONFIG.H-90);
  ctx.globalAlpha=G.unlocked?0.2:0.06;ctx.fillStyle='#7ad0ff';
  ctx.fillRect(920,gy0,40,gy1-gy0);ctx.globalAlpha=1;

  // стены с воротами
  for(const gi of GATES_IDX){
    const l=G.loops[gi], x=l.gx, open=gateOpen(l);
    ctx.fillStyle='#3a3050';
    ctx.fillRect(x-4,90,8,gy0-90); ctx.fillRect(x-4,gy1,8,CONFIG.H-gy1);
    if(open){ctx.fillStyle='rgba(122,208,255,0.3)';ctx.fillRect(x-6,gy0,12,gy1-gy0);
      if(l.jamT>0){ctx.fillStyle='#7ad0ff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
        ctx.fillText('окно '+l.jamT.toFixed(1)+'с',x,x===140?gy0-14:gy1+24);ctx.textAlign='left';}}
    else{ctx.fillStyle='rgba(255,93,93,0.75)';ctx.fillRect(x-4,gy0,8,gy1-gy0);}
    // большая буква на самих воротах
    ctx.fillStyle='rgba(232,230,240,0.45)';ctx.font='bold 34px sans-serif';ctx.textAlign='center';
    ctx.fillText(l.id,x,(gy0+gy1)/2+12);ctx.textAlign='left';
  }

  // анкеры: подсветка до первого удара + крупнее
  if(G.strikes===0&&mode==='play'){const p=0.5+0.5*Math.sin(last/1000*4);
    for(const l of G.loops){ctx.strokeStyle=`rgba(178,107,255,${0.25+0.3*p})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(l.ax,l.ay,56+7*p,0,TAU);ctx.stroke();}ctx.lineWidth=1;}
  for(const l of G.loops)
    drawSprite(l.type==='patrol'?SPRITES.anchor_patrol:SPRITES.anchor_gate,l.ax,l.ay,0,0.7);
  // подписи анкеров в мире — прямо у ромбиков
  ctx.textAlign='center';
  for(const l of G.loops){
    ctx.fillStyle='#e8e6f0';ctx.font='bold 15px sans-serif';ctx.fillText(l.label,l.ax,l.ay+(l.type==='patrol'?44:42));
    ctx.fillStyle='#8f86a8';ctx.font='11px sans-serif';ctx.fillText(l.labelEn,l.ax,l.ay+(l.type==='patrol'?59:57));
  }
  ctx.textAlign='left';

  // патрули
  for(const l of G.loops)if(l.type==='patrol'){
    const pos=patPos(l);
    if(l.jamT<=0){ // круг зрения виден ВСЕГДА, яркее — когда ты внутри
      const inside=sameRoom(pos.x,G.player.x)&&dist(pos,G.player)<CONFIG.VISION;
      ctx.fillStyle=inside?'rgba(255,209,102,0.16)':'rgba(255,209,102,0.07)';
      ctx.beginPath();ctx.arc(pos.x,pos.y,CONFIG.VISION,0,TAU);ctx.fill();
      ctx.strokeStyle=inside?'rgba(255,209,102,0.5)':'rgba(255,209,102,0.25)';
      ctx.beginPath();ctx.arc(pos.x,pos.y,CONFIG.VISION,0,TAU);ctx.stroke();
    }
    drawSprite(SPRITES.patrol,pos.x,pos.y,0,0.42);
    if(l.jamT>0){ctx.strokeStyle='#8a2be2';ctx.lineWidth=3;ctx.beginPath();ctx.arc(pos.x,pos.y,22,0,TAU);ctx.stroke();ctx.lineWidth=1;
      ctx.fillStyle='#b26bff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';
      ctx.fillText(l.label+' · ЗАМЕР',pos.x,pos.y-28);ctx.textAlign='left';}
  }

  // игрок
  drawSprite(SPRITES.player,G.player.x,G.player.y,-Math.PI/2,0.46);

  // наведение на анкер
  const hover=anchorAt(mouse);
  if(hover&&mode==='play'){
    ctx.strokeStyle='rgba(232,230,240,0.5)';ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(hover.ax,hover.ay,CONFIG.STRIKE_R,0,TAU);ctx.stroke();ctx.setLineDash([]);
    const d=nearestBitDist(hover), inTact=d<=Teff(hover)*CONFIG.TACT_FRAC;
    ctx.fillStyle=inTact?'#8f86a8':'#b26bff';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(inTact?'в такт — слабый удар':'перебить (сдвиг ~'+(clamp(d,CONFIG.DMIN*Teff(hover),CONFIG.DMAX*Teff(hover))/Teff(hover)).toFixed(2)+'T)',mouse.x,mouse.y-14);
    ctx.textAlign='left';
  }

  // эффекты
  for(const e of G.effects){
    if(e.type==='ring'){ctx.strokeStyle=e.color;ctx.globalAlpha=Math.min(1,e.life*1.6);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,TAU);ctx.stroke();ctx.lineWidth=1;ctx.globalAlpha=1;}
    if(e.type==='txt'){ctx.fillStyle=e.color;ctx.globalAlpha=Math.min(1,e.life);ctx.font='bold 14px sans-serif';
      ctx.textAlign='center';ctx.fillText(e.s,e.x,e.y);ctx.textAlign='left';ctx.globalAlpha=1;}
  }

  renderHUD();
  if(G.alarm>70){ctx.fillStyle=`rgba(255,93,93,${(G.alarm-70)/30*0.12})`;ctx.fillRect(0,0,CONFIG.W,CONFIG.H);}
  if(mode==='end')renderEnd();
}

// ---------- ОБУЧАЛКА: 4 страницы с диаграммами ----------
function drawMiniDial(x,y,r,phase,handColor){
  ctx.strokeStyle='#3a3050';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.lineWidth=1;
  for(let k=0;k<4;k++){const a=k*TAU/4-Math.PI/2;
    ctx.fillStyle='#e8e6f0';ctx.fillRect(x+Math.cos(a)*(r-8)-7,y+Math.sin(a)*(r-8)-7,14,14);}
  const a=phase-Math.PI/2;
  ctx.strokeStyle=handColor||'#b26bff';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*(r-14),y+Math.sin(a)*(r-14));ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle='#b26bff';ctx.beginPath();ctx.arc(x,y,7,0,TAU);ctx.fill();
}
function drawMiniGate(x,y,open,label){
  ctx.fillStyle='#3a3050';
  ctx.fillRect(x-8,y-80,16,60); ctx.fillRect(x-8,y+20,16,60);
  if(open){ctx.fillStyle='rgba(122,208,255,0.55)';ctx.fillRect(x-10,y-20,20,40);}
  else{ctx.fillStyle='rgba(255,93,93,0.7)';ctx.fillRect(x-8,y-20,16,40);}
  ctx.fillStyle='#cfcbe0';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
  ctx.fillText(label,x,y+95);ctx.textAlign='left';
}
function caption(ru1,ru2,en){
  ctx.textAlign='center';
  ctx.fillStyle='#cfcbe0';ctx.font='bold 21px sans-serif';ctx.fillText(ru1,CONFIG.W/2,498);
  ctx.fillStyle='#8f86a8';ctx.font='bold 18px sans-serif';ctx.fillText(ru2,CONFIG.W/2,530);
  ctx.fillStyle='#6f6885';ctx.font='16px sans-serif';ctx.fillText(en,CONFIG.W/2,562);
  ctx.textAlign='left';
}
function renderTut(){
  const t=last/1000;
  const titles=['Мир тикает / The world ticks','Ударь не в такт / Strike off-beat',
                'Сбой катится по графу / It cascades','Сведи окна — беги! / Overlap and run'];
  ctx.textAlign='center';ctx.fillStyle='#e8e6f0';ctx.font='bold 30px sans-serif';
  ctx.fillText(titles[tutPage],CONFIG.W/2,70);
  for(let i=0;i<4;i++){ctx.fillStyle=i===tutPage?'#b26bff':'#332b45';
    ctx.beginPath();ctx.arc(CONFIG.W-40-(3-i)*22,34,6,0,TAU);ctx.fill();}
  ctx.textAlign='left';

  if(tutPage===0){
    drawMiniDial(480,270,130,t*1.2);
    ctx.fillStyle='#e8e6f0';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
    ctx.fillText('БИТ / BIT',665,155);
    ctx.fillText('ПЕТЛЯ / LOOP',480,435);
    ctx.textAlign='left';
    caption('Стрелка бежит по кругу — это ПЕТЛЯ: патруль или ворота.',
            'Белые точки — БИТЫ, «такт» петли.',
            'The hand runs around the dial — a LOOP (patrol or gate). White dots are BITS, its beat.');
  }
  else if(tutPage===1){
    drawMiniDial(230,270,95,t*1.2);
    ctx.fillStyle='#b26bff';
    ctx.save();ctx.translate(230,470);ctx.rotate(Math.PI/4);ctx.fillRect(-16,-16,32,32);ctx.restore();
    const pr=22+8*Math.sin(t*5);
    ctx.strokeStyle='#e8e6f0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(230,470,pr,0,TAU);ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle='#e8e6f0';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText('ТАП / TAP!',230,432);ctx.textAlign='left';
    ctx.strokeStyle='#b26bff';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(300,400);ctx.lineTo(560,330);ctx.stroke();
    ctx.beginPath();ctx.moveTo(560,330);ctx.lineTo(540,318);ctx.lineTo(545,345);ctx.closePath();ctx.fillStyle='#b26bff';ctx.fill();ctx.lineWidth=1;
    drawMiniGate(660,330,true,'A');
    ctx.fillStyle='#7ad0ff';ctx.font='bold 17px sans-serif';ctx.textAlign='center';
    ctx.fillText('окно / window 5s',660,235);ctx.textAlign='left';
    caption('Тапни по анкеру НЕ на белой точке — петля споткнётся, откроется окно.',
            'Точно на точке = слабый удар. Любой сбой поднимает ТРЕВОГУ.',
            'Tap an anchor OFF its white dot — the loop stumbles, a window opens. On-beat = weak hit; disruption raises the ALARM.');
  }
  else if(tutPage===2){
    const cards=[{n:'ОХРАНА-1',x:190,y:240},{n:'ОХРАНА-2',x:480,y:240},{n:'ОХРАНА-3',x:770,y:240},
                 {n:'ВОРОТА A',x:300,y:420},{n:'ВОРОТА B',x:480,y:420},{n:'ВОРОТА C',x:660,y:420}];
    const edges=[[0,3],[0,4],[1,4],[1,5],[2,5]];
    ctx.strokeStyle='rgba(178,107,255,0.8)';ctx.lineWidth=3;
    for(const [a,b] of edges){
      ctx.beginPath();ctx.moveTo(cards[a].x,cards[a].y+36);ctx.lineTo(cards[b].x,cards[b].y-36);ctx.stroke();
    }
    ctx.lineWidth=1;
    cards.forEach((c,i)=>{
      ctx.fillStyle='#1d1728';ctx.fillRect(c.x-62,c.y-32,124,64);
      ctx.strokeStyle=i<3?'#b26bff':'#7ad0ff';ctx.strokeRect(c.x-62,c.y-32,124,64);
      ctx.fillStyle='#e8e6f0';ctx.font='bold 18px sans-serif';ctx.textAlign='center';
      ctx.fillText(c.n,c.x,c.y+6);ctx.textAlign='left';
    });
    caption('ЦЕЛЬ — окна у ТРЁХ ВОРОТ. Бей ОХРАНУ: каскад откроет ворота за тебя.',
            'Удар по ОХРАНЕ-1 → A и B, удар по ОХРАНЕ-2 → B и C. Сведи их вместе!',
            'GOAL: windows on all three GATES. Strike GUARDS — the cascade opens gates for you: GUARD 1 → A+B, GUARD 2 → B+C.');
  }
  else{
    ctx.fillStyle='#3a3050';ctx.fillRect(60,280,30,80);
    drawMiniGate(300,320,true,'A');drawMiniGate(480,320,true,'B');drawMiniGate(660,320,true,'C');
    ctx.fillStyle='#e8e6f0';ctx.beginPath();ctx.arc(140,320,18,0,TAU);ctx.fill();
    ctx.strokeStyle='#b26bff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(170,320);ctx.lineTo(250,320);ctx.stroke();
    ctx.beginPath();ctx.moveTo(250,320);ctx.lineTo(228,306);ctx.lineTo(228,334);ctx.closePath();ctx.fillStyle='#b26bff';ctx.fill();ctx.lineWidth=1;
    ctx.fillStyle='rgba(122,208,255,0.35)';ctx.fillRect(840,240,100,160);
    ctx.fillStyle='#7ad0ff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText('ВЫХОД / EXIT',890,430);
    ctx.fillText('перекрытие 1.5с → ЗАЛИПЛИ',480,180);
    ctx.fillText('overlap 1.5s → STUCK OPEN',480,212);
    ctx.textAlign='left';
    caption('Окна всех ТРЁХ ворот пересеклись на 1.5с — залипли. Беги вправо!',
            'Тревога 100 = всё жёстче: гаси ПОДПЕВАНИЕМ (ПКМ / кнопка).',
            'When all three windows overlap for 1.5s gates stick open — run right! ALARM 100 hardens everything; calm it with RESYNC (RMB / button).');
  }
  ctx.textAlign='center';
  const p=0.6+0.4*Math.sin(t*4);
  if(tutPage<3){ctx.fillStyle=`rgba(232,230,240,${p})`;ctx.font='bold 20px sans-serif';
    ctx.fillText('тап / Enter — дальше · next ▸',CONFIG.W/2,608);}
  else{ctx.fillStyle=`rgba(178,107,255,${p})`;ctx.font='bold 24px sans-serif';
    ctx.fillText('▶ ПОНЯЛ, ИГРАТЬ / GOT IT, PLAY',CONFIG.W/2,606);}
  if(tutResume){ctx.fillStyle='#5b5372';ctx.font='13px sans-serif';ctx.fillText('(игра на паузе · game paused)',CONFIG.W/2,632);}
  ctx.textAlign='left';
}

function renderHUD(){
  const cw=150, gapx=(CONFIG.W-6*cw)/5;
  G.loops.forEach((l,i)=>{
    const x=(cw+gapx)*i, y=8, T=Teff(l);
    ctx.fillStyle='#1d1728';ctx.fillRect(x,y,cw,84);
    ctx.strokeStyle='#2a2338';ctx.strokeRect(x+.5,y+.5,cw,84);
    // имя петли по-человечески
    ctx.textAlign='center';
    ctx.fillStyle='#e8e6f0';ctx.font='bold 14px sans-serif';ctx.fillText(l.label,x+cw/2,y+16);
    ctx.fillStyle='#6f6885';ctx.font='10px sans-serif';ctx.fillText(l.labelEn,x+cw/2,y+28);
    ctx.textAlign='left';
    const cx=x+34,cy=y+52,r=30;
    ctx.strokeStyle='#3a3050';ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();
    for(let k=0;k<4;k++){const a=k*TAU/4-Math.PI/2;
      ctx.fillStyle='#e8e6f0';ctx.fillRect(cx+Math.cos(a)*(r-8)-3.5,cy+Math.sin(a)*(r-8)-3.5,7,7);}
    const ph=wrapPhase(l.phi,T)/T*TAU;
    ctx.strokeStyle=l.jamT>0?'#7ad0ff':'#b26bff';ctx.lineWidth=3.5;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ph-Math.PI/2)*(r-5),cy+Math.sin(ph-Math.PI/2)*(r-5));ctx.stroke();ctx.lineWidth=1;
    for(let k=0;k<CONFIG.H_MAX;k++){ctx.fillStyle=k<l.h?'#ffd166':'#332b45';ctx.fillRect(x+72+k*11,y+38,8,8);}
    drawSprite(l.type==='gate'?SPRITES.gate_icon:SPRITES.patrol_icon,x+86,y+62,0,0.3);
    ctx.font='bold 13px sans-serif';ctx.fillStyle='#8f86a8';
    ctx.fillText(l.type==='gate'?(gateOpen(l)?'ОТКРЫТО':'закрыто'):(l.jamT>0?'ЗАМЕР':'обход'),x+68,y+40);
    if(l.jamT>0){ctx.fillStyle='#7ad0ff';ctx.fillText('окно '+l.jamT.toFixed(1)+'с',x+68,y+56);}
    if(l.repairIn!==null){ctx.fillStyle='#ffd166';ctx.fillText('жёстче '+l.repairIn.toFixed(0)+'с',x+68,y+72);}
  });
  ctx.strokeStyle='rgba(178,107,255,0.35)';
  for(const [a,b] of EDGES){
    ctx.beginPath();ctx.moveTo((cw+gapx)*a+cw,50);ctx.lineTo((cw+gapx)*b,50);ctx.stroke();
  }
  // ЖИВАЯ ПОДСКАЗКА (RU + EN)
  let h1,h2;
  if(G.unlocked){h1='БЕГИ ВПРАВО К ВЫХОДУ!';h2='RUN RIGHT TO THE EXIT!';}
  else if(G.strikes===0){h1='УДАРЬ по любому ромбику — НЕ по белой точке';h2='TAP any diamond anchor — NOT on a white dot';}
  else if(G.overlapT>0.3){h1='ДЕРЖИ ПЕРЕКРЫТИЕ! Ещё удар!';h2='KEEP THE OVERLAP GOING!';}
  else if(G.alarm>70){h1='ТРЕВОГА! «Подпевать» гасит её';h2='ALARM HIGH! Resync to calm it';}
  else{h1='БЕЙ ОХРАНУ: 1 → потом 2 → потом 3';h2='Strike GUARD 1 → 2 → 3 to open gates A/B/C';}
  ctx.font='bold 20px sans-serif';const w1=ctx.measureText(h1).width;
  ctx.font='bold 15px sans-serif';const w2=ctx.measureText(h2).width;
  const bw=Math.max(w1,w2)+28;
  ctx.fillStyle='rgba(13,10,18,0.6)';ctx.fillRect(CONFIG.W/2-bw/2,94,bw,56);
  ctx.textAlign='center';
  ctx.fillStyle='#b26bff';ctx.font='bold 20px sans-serif';ctx.fillText(h1,CONFIG.W/2,116);
  ctx.fillStyle='#8f86a8';ctx.font='bold 15px sans-serif';ctx.fillText(h2,CONFIG.W/2,140);
  ctx.textAlign='left';
  bar(CONFIG.W/2-130,CONFIG.H-30,260,14,G.alarm/100,G.alarm>70?'#ff5d5d':'#ffd166');
  if(G.alarmFx&&G.alarmFx.t>0){ // всплывающее «+10 / −8» над полосой
    const a=Math.min(1,G.alarmFx.t);
    ctx.fillStyle=G.alarmFx.c;ctx.globalAlpha=a;ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText(G.alarmFx.v+' тревога',CONFIG.W/2,CONFIG.H-42-(1.2-G.alarmFx.t)*30);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
  ctx.fillStyle='#cfcbe0';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  ctx.fillText('ТРЕВОГА / ALARM '+Math.round(G.alarm)+' — 100 = пересвод / full resync',CONFIG.W/2,CONFIG.H-38);
  ctx.fillStyle=G.overlapT>0?'#7ad0ff':'#8f86a8';ctx.font='bold 16px sans-serif';
  ctx.fillText('Ворота A+B+C / Gates: '+G.overlapT.toFixed(1)+'с / '+CONFIG.OVERLAP_NEED+'с',CONFIG.W/2,CONFIG.H-56);
  ctx.fillStyle='#8f86a8';ctx.font='bold 15px sans-serif';
  ctx.fillText(Math.ceil(G.t)+'с · ударов '+G.strikes+' · каскадов '+G.cascades,CONFIG.W/2,CONFIG.H-72);
  ctx.textAlign='left';
  ctx.fillStyle='#5b5372';ctx.font='12px sans-serif';
  ctx.fillText(isTouch?'Джойстик слева · тап по анкеру = удар · «Как играть» справа':'WASD · ЛКМ у анкера — перебить · ПКМ — подпевать · H — помощь',20,CONFIG.H-28);
  ctx.fillText(isTouch?'Joystick left · tap an anchor to strike · "?" button = help':'WASD · LMB near anchor — strike · RMB — resync · H — help',20,CONFIG.H-12);
}
function bar(x,y,w,h,frac,color){
  ctx.fillStyle='#241d31';ctx.fillRect(x,y,w,h);
  ctx.fillStyle=color;ctx.fillRect(x,y,w*clamp(frac,0,1),h);
  ctx.strokeStyle='#3a3050';ctx.strokeRect(x+.5,y+.5,w,h);
}
function renderStart(){
  const t=last/1000, p=0.6+0.4*Math.sin(t*3);
  ctx.textAlign='center';
  ctx.fillStyle='#e8e6f0';ctx.font='bold 60px sans-serif';
  ctx.fillText('ЛЕЙТМОТИВ · LEITMOTIF',CONFIG.W/2,190);
  ctx.fillStyle='#8f86a8';ctx.font='bold 20px sans-serif';
  ctx.fillText('Мир тикает. Ворота откроются только хореографией сбоев.',CONFIG.W/2,250);
  ctx.fillText('The world ticks. Only choreographed disruption opens the gates.',CONFIG.W/2,280);
  ctx.fillStyle=`rgba(178,107,255,${p})`;ctx.font='bold 30px sans-serif';
  ctx.fillText('▸ КАК ИГРАТЬ / HOW TO PLAY — тапни / tap (T)',CONFIG.W/2,360);
  ctx.fillStyle='#5b5372';ctx.font='16px sans-serif';
  ctx.fillText('Enter — сразу играть / just play · H — помощь / help',CONFIG.W/2,420);
  ctx.textAlign='left';
}
function renderEnd(){
  ctx.fillStyle='rgba(13,10,18,0.8)';ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  ctx.textAlign='center';
  ctx.fillStyle=G.win?'#7ad0ff':'#ff5d5d';ctx.font='bold 54px sans-serif';
  ctx.fillText(G.win?'ПОБЕДА':'ПРОИГРЫШ',CONFIG.W/2,270);
  ctx.fillStyle='#e8e6f0';ctx.font='bold 20px sans-serif';
  const share=G.strikes?Math.round(G.cascades/G.strikes*100):0;
  ctx.fillText(`Ударов: ${G.strikes}, каскадов: ${G.cascades} (${share}%) · пик тревоги ${Math.round(G.peakAlarm)}`,CONFIG.W/2,330);
  ctx.fillStyle='#b26bff';ctx.font='16px sans-serif';
  ctx.fillText(G.win?('Цепочка: '+(G.unlockChain||'—')):'Ворота не сведены: бей петли в такт графу (рёбра — на карточках сверху)',CONFIG.W/2,372);
  ctx.fillStyle='#8f86a8';ctx.font='16px sans-serif';
  ctx.fillText(isTouch?'Ещё раз — кнопка ЗАНОВО справа':'Ещё раз — клавиша R',CONFIG.W/2,410);
  ctx.textAlign='left';
}

// ---------- цикл ----------
function loop(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0); last=ts;
  update(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
